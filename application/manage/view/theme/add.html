{include file="common/head"/}
<body>
	<div class="layui-fluid">
		<div class="table-body">
			<form class="layui-form layui-form-pane">
				<div class="layui-form-item">
					<label class="layui-form-label">布局名称</label>
					<div class="layui-input-inline from-inline-7">
					  <input type="text" name="row[name]" required  lay-verify="required" placeholder="请输入标题" autocomplete="off" class="layui-input">
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">编码</label>
					<div class="layui-input-inline from-inline-7">
						<input type="text" name="row[code]" required lay-verify="required" value="desktop_{:mt_rand(11111,99999)}" placeholder="请输入编码" autocomplete="off" class="layui-input">
                        <div class="layui-word-aux">编码必须是唯一，且只能由英文字母、下划线、数字组成</div>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">布局描述</label>
					<div class="layui-input-inline from-inline-7">
						<textarea name="row[desc]" placeholder="请输入布局描述" class="layui-textarea"></textarea>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label"></label>
					<div class="layui-input-block">
					  <button type="submit" class="layui-btn" lay-submit="" lay-filter="sub">立即提交</button>
					</div>
				</div>
			</form>
		</div>
	</div>
{include file="common/foot"/}
<script>
layui.use(['form','upload'], function(){
  var $ = layui.jquery,form = layui.form,upload = layui.upload; //Tab的切换功能，切换事件监听等，需要依赖element模块
  form.on('submit(sub)', function(data){
		loading = layer.load(1, { shade: [0.1, '#fff'] });
		$.post('',data.field,function(res) {
			layer.close(loading);
			if (res.status === 200){
				layer.msg('保存成功', { icon: 1, time: 1000 }, function () {
					var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
					parent.layer.close(index);//再执行关闭
				});
			} else {
				layer.msg(res.msg, { icon: 2, time: 1000 });
			}
		});
	  return false; //阻止表单跳转。如果需要表单跳转，去掉这段即可。
	});
    var uploadInst = upload.render({
        elem: '#onUpload',
        url: '{:createUrl("UpFiles/upload")}',
        done: function(res){
            if(res.status===200){
                $('#thumb').val(res.url);
                $('#Image').attr('src',res.url);
            }else{
                //如果上传失败
                return layer.msg('上传失败');
            }
        },
        error: function(){
            //演示失败状态，并实现重传
            var preview = $('#preview');
            preview.html('<span style="color: #FF5722;">上传失败</span> <a class="layui-btn layui-btn-mini onReload">重试</a>');
            preview.find('.onReload').on('click', function(){
                uploadInst.upload();
            });
        }
    });
});
</script>
</body>
