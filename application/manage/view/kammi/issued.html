{include file="common/head"/}
<style>
	.layui-tips-desc{
		border: #f3c685 1px solid;
		padding:15px 20px;
		color:#f90;
		background: #fdfcee;
		border-radius:5px;
		width:85%;
		margin:0 auto 20px auto;
	}
</style>
<body>
	<div class="layui-fluid">
		<div class="table-body">
			<div class="layui-tips-desc">
				使用此功能时，在【系统设置-全局设置-业务设置】-卡密计算收益 配置项，将此配置关闭，然后进行下发卡密。
				否则会导致代理分站收益重复计算
			</div>
			<form class="layui-form layui-form-pane">
				<div class="layui-form-item">
					<label class="layui-form-label">下发代理</label>
					<div class="layui-input-inline from-inline-5">
						<select name="admin_id" lay-search>
							{volist name="agentList" id="v"}
								<option value="{$v['id']}">{$v['username']}【{$v['id']}】</option>
							{/volist}
						</select>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">选择会员</label>
					<div class="layui-input-inline from-inline-5">
						<select name="vid" lay-search>
							<option value="0">不指定会员</option>
							{volist name="svip" id="v"}
								<option value="{$v['id']}">{$v['name']} - 所属站点【{$v['agent']['username']}({$v['agent']['id']})】</option>
							{/volist}
						</select>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label">金额</label>
					<div class="layui-input-inline from-inline-5">
						<input type="number" name="money" lay-verify="required" lay-reqText="请输入卡密金额" placeholder="请输入卡密金额" autocomplete="off" class="layui-input">
						<div class="layui-form-mid layui-word-aux">指定会员时，金额可设置为0</div>
					</div>
				</div>
			    <div class="layui-form-item">
					<label class="layui-form-label">数量</label>
					<div class="layui-input-inline from-inline-5">
						<input type="number" name="nums" lay-verify="required" lay-reqText="请输入卡密数量" placeholder="请输入卡密数量" autocomplete="off" class="layui-input">
					</div>
				</div>
				<div class="layui-form-item" style="padding-top: 10px;">
					<div class="layui-input-block">
					  <button type="submit" class="layui-btn" lay-submit="" lay-filter="sub">立即提交</button>
					</div>
				</div>
			</form>
		</div>
	</div>
{include file="common/foot"/}   
<script>
layui.use(['form'], function(){
    var $ = layui.jquery,form = layui.form;
    form.on('submit(sub)', function(data){
		loading = layer.load(1, { shade: [0.1, '#fff'] });
		$.post('',data.field,function(res) {
			layer.close(loading);
			if (res.status == 200){
				layer.msg(res.msg, { icon: 1, time: 1000 }, function () {
					var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
					parent.layer.close(index);//再执行关闭
				});
			} else {
				layer.msg(res.msg, { icon: 2, time: 1000 });
			}
		});
	    return false; //阻止表单跳转。如果需要表单跳转，去掉这段即可。
	});
});
</script>
</body>
