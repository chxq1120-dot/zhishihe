{include file="common/head"/}
<body>
<div class="layui-fluid">
	<div class="table-body" style="padding-top:30px;">
		<form class="layui-form layui-form-pane">
			<div class="layui-form-item">
				<label class="layui-form-label">批量选择分类</label>
				<div class="layui-input-inline from-inline-7">
					<div id="sort"></div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-input-block">
				  <button class="layui-btn" lay-submit lay-filter="sub">立即提交</button>
				</div>
			</div>
		</form>
	</div>
</div>
{include file="common/foot"/}
<script src="__STATIC__/xm-select/dist/xm-select.js"></script>
<script>
$.get("{:createUrl('gettreesort')}",function(info){
	var sort = xmSelect.render({
		el: '#sort',
		language: 'zn',
		autoRow: true,
		name: 'sort_id',
		layVerify: 'required',
		layVerType: 'msg',
		data: info,
		prop:{name:'title',value:'id',selected:'checked'},
		tree:{show:true},
	});
});
layui.use(['form'], function(){
  	var $ = layui.jquery,form = layui.form;
  	form.on('submit(sub)', function(data){
  		loading = layer.load(1, { shade: [0.1, '#fff'] });
        $.post('',data.field,function(res) {
            layer.close(loading);
            if (res.status === 200){
                layer.msg(res.msg, { icon: 1, time: 1000 }, function () {
                    var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                    parent.layer.close(index);//再执行关闭
                });
            } else {
                layer.msg(res.msg, { icon: 2, time: 1000 });
            }
        });
	  	return false; //阻止表单跳转。如果需要表单跳转，去掉这段即可。
	}); 
});
</script>
</body>
