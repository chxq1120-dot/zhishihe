{include file="common/head"/}
<body>
<div class="layui-fluid">
    <div class="table-body">
        <form class="layui-form layui-form-pane">
            <div class="layui-form-item">
                <label class="layui-form-label">跳转名称</label>
                <div class="layui-input-inline from-inline-5">
                    <input type="text" name="name" lay-verify="required" lay-reqText="请输入跳转名称" placeholder="{:lang('pleaseEnter')}跳转名称" autocomplete="off" class="layui-input"
                           value="{$info.name}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">跳转简介</label>
                <div class="layui-input-inline from-inline-5">
                    <input type="text" name="desc" lay-verify="required" lay-reqText="请输入跳转简介" placeholder="{:lang('pleaseEnter')}跳转简介" autocomplete="off" class="layui-input"
                           value="{$info.desc}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">封面</label>
                <div class="layui-input-inline from-inline-5">
                    <input type="hidden" lay-verify="required" lay-reqText="请上传封面" name="thumb" id="thumb" value="{$info.thumb}">
                    <div class="layui-upload">
                        <div class="layui-upload-list" id="onUpload" style="cursor: pointer;">
                            <img class="layui-upload-img" width="86" height="86" src="{$info.thumb}" id="Image">
                            <p id="preview"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">跳转类型</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="radio" name="type" value="1" title="外部链接" lay-filter="type" {if ($info['type']==1)}checked{/if}>
                    <input type="radio" name="type" value="2" title="小程序" lay-filter="type" {if ($info['type']==2)}checked{/if}>
                </div>
            </div>
            <div class="layui-form-item" {if ($info['type']==1)}style="display:none;"{/if} id="appid">
                <label class="layui-form-label">APPID</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="text" name="appid" autocomplete="off" placeholder="{:lang('pleaseEnter')}小程序APPID" class="layui-input" value="{$info.appid}">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">链接地址</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="text" name="url" autocomplete="off" placeholder="{:lang('pleaseEnter')}链接地址" class="layui-input" value="{$info.url}">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="radio" name="status" value="1" title="启用" {if ($info['status']==1)}checked{/if}>
                    <input type="radio" name="status" value="0" title="禁用" {if ($info['status']==0)}checked{/if}>
                </div>
            </div>

            <div class="layui-form-item" style="padding-top: 10px;">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn" lay-submit="" lay-filter="sub">立即提交</button>
                    <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="common/foot"/}
<script>
    layui.use(['element', 'form', 'upload', 'layedit', 'laydate'], function () {
        var $ = layui.jquery, element = layui.element, form = layui.form, upload = layui.upload,
            layedit = layui.layedit, laydate = layui.laydate; //Tab的切换功能，切换事件监听等，需要依赖element模块
        form.on('submit(sub)', function (data) {
            loading = layer.load(1, {shade: [0.1, '#fff']});
            $.post('', data.field, function (res) {
                layer.close(loading);
                if (res.status == 200) {
                    layer.msg(res.msg, {icon: 1, time: 1000}, function () {
                        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                        parent.layer.close(index);//再执行关闭
                    });
                } else {
                    layer.msg(res.msg, {icon: 2, time: 1000});
                }
            });
            return false; //阻止表单跳转。如果需要表单跳转，去掉这段即可。
        });
        form.on('radio(type)', function (data) {
            if (data.value == 1) {
                $("#appid").hide();
            } else {
                $("#appid").show();
            }
            form.render();
        });
        $("#uploadImg").on('click',function(){
            layer.open({
                title:'上传封面',
                type:2,
                maxmin: true,
                area:['80%','500px'],
                content:'{:createUrl("attachment/index")}?type=0&name=thumb&prename=Image',
            });
        });
        laydate.render({
            elem: '#test1',
            type: 'datetime'
        });
    });
</script>
</body>
