{include file="common/head"/}
<style>
    .layui-table-cell{
        min-height:28px!important;
        height:inherit!important;
    }
    .layui-table-cell img{
        max-width:none!important;
        width:200px!important;
        height:290px!important;
    }
</style>
<div class="layui-fluid">
    <div class="admin-head">
        <ul>
            <li class="on">推广海报列表</li>
        </ul>
    </div>
    <div class="table-body">
        <div class="search-tool" style="border-bottom:#eee 1px solid;height:50px;">
            <div class="func-btn">
                <a href="{:createUrl('add')}" class="layui-btn layui-bg-blue layui-btn-small">创建推广海报</a>
            </div>
        </div>
        <div class="listbar">
            {empty name="$list"}
                <div class="msgs">
                    您还未创建推广海报
                </div>
            {else /}
                {foreach $list as $k=>$v}
                    <div class="list-item">
                        <div class="title">{$v.name}</div>
                        <div class="list-poster">
                            <div class="list-img">
                                <img src="{$v.url}" width="100%" id="img_{$v.id}">
                            </div>
                            <div class="list-child">
                                <div class="mycont">{$v.content}</div>
                            </div>
                        </div>
                        <div class="list-btn">
                            <button class="layui-btn layui-btn-normal layui-btn-fluid" id="btn-copy">复制</button>
                            <button class="layui-btn download" data-id="{$v.id}">下载</button>
                            <button class="layui-btn edit" data-id="{$v.id}">编辑</button>
                            <button class="layui-btn layui-btn-danger deleted" data-id="{$v.id}">删除</button>
                        </div>
                    </div>
                {/foreach}
            {/empty}
        </div>
        <style>
            .listbar{
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                justify-content: space-around;
                padding:20px 10px;
            }
            .listbar .msgs{
                display: flex;
                align-items: center;
                justify-content: center;
                color:#c9c9c9;
                height:440px;
                font-size:24px;
            }
            .listbar .list-item{
                width:30%;
            }
            .listbar .list-item .title{

                padding:10px 0;
                font-size:14px;
                font-weight: bold;
                text-align: center;
            }
            .listbar .list-item .list-poster{
                display: flex;
                justify-content: space-between;
                height:280px;
                border:#eee 1px solid;
                background-color:#fefefe;
                border-radius:10px;
                overflow: hidden;
            }
            .listbar .list-item .list-img{
                width:55%;
            }
            .listbar .list-item .list-img img{
                width:200px;
                height:280px;
            }
            .listbar .list-item .list-child{
                width:45%;
                padding:10px 10px;

            }
            .listbar .list-item .list-child .title{
                font-size:14px;
                font-weight: bold;
                padding:10px 0;
            }
            .listbar .list-item .list-child .mycont{
                width:100%;
                height:260px;
                line-height:160%;
            }
            .listbar .list-item .list-btn{
                height:50px;
                display: flex;
                justify-content: space-around;
                padding-top:10px;
            }
            @media screen and (max-width: 768px) {
                .listbar .list-item{
                    width:95%;
                }
            }
        </style>
    </div>
</div>
{include file="common/foot"/}
<script src="__STATIC__/common/js/clipboard/clipboard.min.js?v=1.0.5"></script>
<script>
layui.use(['form'], function() {
    var $ = layui.jquery;
    var clipboard = new Clipboard('#btn-copy', {
        target: function () {
            return document.querySelector('.list-poster');
        }
    });
    clipboard.on('success', function (e) {
        layer.msg('复制成功', {time: 1000, icon: 1});
    });
    clipboard.on('error', function (e) {
        layer.msg('复制失败', {time: 1000, icon: 2});
    });
    /**
     * 下载
     */
    $('.download').on('click',function () {
        var id=$(this).data('id');
        var img = document.getElementById('img_' + id); // 获取要下载的图片
        var url = img.src;                            // 获取图片地址
        var a = document.createElement('a');          // 创建一个a节点插入的document
        var event = new MouseEvent('click');          // 模拟鼠标click点击事件
        a.download = 'img_' + id;                      // 设置a节点的download属性值
        a.href = url;                                 // 将图片的src赋值给a节点的href
        a.dispatchEvent(event);                      // 触发鼠标点击事件
    });
    /**
     * 编辑海报
     */
    $('.edit').on('click',function () {
        var ids=$(this).data('id');
        var edit=layer.open({
            title:'编辑海报',
            type:2,
            maxmin: true,
            content:'{:createUrl("edit")}?ids='+ids,
            area:['80%','580px'],
            end:function(){
                window.location.reload();
            }
        });
    });
    /**
     * 删除
     */
    $('.deleted').on('click',function () {
        var ids=$(this).data('id');
        layer.confirm('你确定要删除吗？', {icon: 3}, function (index) {
            $.post("{:createUrl('del')}", {ids: ids}, function (res) {
                if (res.status === 200) {
                    layer.msg('删除成功', {time: 1000, icon: 1});
                    window.location.reload();
                } else {
                    layer.msg(res.msg, {time: 1000, icon: 2});
                }
            });
        });
    });
});
</script>
