{include file="common/head"/}
<style>
.layui-table-cell{height: inherit;}
</style>
<div class="layui-fluid">
    <div class="admin-head">
        <ul>
            <li class="on">全部任务记录</li>
        </ul>
    </div>
    <div class="table-body">
        <div class="search-tool">
            <form class="layui-form">
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width: 130px;">
                      <input type="text" name='start' autocomplete="off" id="startDate" class="layui-input" placeholder="开始日期">
                    </div>
                    <div class="layui-input-inline">-</div>
                    <div class="layui-input-inline" style="width: 130px;">
                      <input type="text" name='end' autocomplete="off" id="endDate" class="layui-input" placeholder="结束日期">
                    </div>
                </div>
                <div class="layui-inline" style="width: 100px;">
                    <select name="status">
                        <option value="">状态</option>
                        <option value="0">未完成</option>
                        <option value="1">已完成</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" name="search" class="layui-input" placeholder="用户昵称">
                </div>
                <div class="layui-inline">
                    <button class="layui-btn" lay-submit="" lay-filter="search">
                        <i class="layui-icon">&#xe615;</i>
                    </button>
                </div>
            </form>
        </div>
        <table id="list" lay-filter="list"></table>
    </div>
</div>

{include file="common/foot"/}
<script>
    layui.use(['table','element','form','laydate'],function(){
        var table = layui.table, $ = layui.jquery,laydate = layui.laydate,form=layui.form,element = layui.element;
        var tableIn = table.render({
            id: 'list',
            elem: '#list',
            url: '{:createUrl("tlist")}',
            toolbar:'#table-toolbar',
            method:'post',
            page:true,
            cols: [[
                {field: 'id',title:'ID',align:'center',width:80},
                {title:'资源名称',align:'center',width:320,templet:function(d){
                	return d.spread.title;
                }},
                {title: '任务用户',align:'center',templet:function(d){
                    return d.user.nickname;
                }},
                {title: '邀请任务',align:'center',width:340,templet:function(d){

                	if(d.spread.invite){
                		return '<span class="blue_block">开启</span> <span class="gray_border">任务人数:'+d.spread.invite_num+' | 已邀请:'+d.invite_num+'</span>';
                	}else{
                		return '<span class="red_block">关闭</span>';
                	}
                }},
                {field: 'is_video',title:'视频任务',align:'center',templet:function(d){
                	if(d.spread.exc_video){
                		if(d.is_video){
	                		return '<span class="blue_block">开启</span> <span class="green_block">已完成</span>';
	                	}else{
	                		return '<span class="blue_block">开启</span> <span class="orange_block">未完成</span>';
	                	}
                	}else{
                		return '<span class="red_block">关闭</span>';
                	}
                	
                }},
                {field:'status',title: '状态',align:'center',width:120,templet:function(d){
                    if(d.status==0){
                        return '<span class="orange_block">未完成</span>';
                    }else if(d.status==1){
                        return '<span class="green_block">已完成</span>';
                    }
                }},
                {field: 'ctime', align: 'center',title: '获取时间',width:150}
            ]]
        });
        form.on('submit(search)', function(data){
            table.reload('list', {
                url: "{:createUrl('tlist')}",
                method:'post',
                where:data.field,
            });
            return false;
        });
        //选择日期
        laydate.render({
            elem: '#startDate',
            type:'datetime'
        });
        laydate.render({
            elem: '#endDate',
            type:'datetime'
        });
        //行列表操作项事件
        table.on('tool(list)', function(obj) {
            var data = obj.data;
            if(obj.event === 'del'){
                layer.confirm('确定删除吗',{icon: 3},function(index){
                    $.post("{:createUrl('delorder')}",{data:{0:data}},function(info){
                        if(info.status==200){
                            layer.msg(info.msg,{anim:0},function(){table.reload('list');});
                        }else{
                            layer.msg(info.msg);
                        }                        
                    });
                });
            }
        });
        //头工具栏事件批量操作
        table.on('toolbar(list)', function(obj){
            var checkStatus = table.checkStatus('list');
            switch(obj.event){
                case 'delAll':
                    layer.confirm('确定删除吗',{icon: 3},function(index){
                        $.post("{:createUrl('delorder')}",{data:checkStatus.data},function(info){
                            if(info.status==200){
                                layer.msg(info.msg,{anim:0},function(){table.reload('list');});
                            }else{
                                layer.msg(info.msg);
                            }
                        });
                    });
                break;
                case 'delNoPayAll':
                    layer.confirm('确定删除吗',{icon: 3},function(index){
                        $.post("{:createUrl('delnopay')}",function(info){
                            if(info.status==200){
                                layer.msg(info.msg,{anim:0},function(){table.reload('list');});
                            }else{
                                layer.msg(info.msg);
                            }
                        });
                    });
                break;
            }
        });
    })
</script>
