{include file="common/head"/}
<style>
.layui-table-cell{height: inherit;}
</style>
<div class="layui-fluid">
    <div class="admin-head">
        <ul>
            <li class="on">全部订单</li>
        </ul>
    </div>
    <div class="table-body">
        <div class="search-tool">
            <form class="layui-form">
                <div class="layui-inline">
                    <div class="layui-input-inline" style="width: 130px;">
                      <input type="text" name='start' autocomplete="off" id="startDate" class="layui-input" placeholder="开始日期">
                    </div>
                    <div class="layui-input-inline">-</div>
                    <div class="layui-input-inline" style="width: 130px;">
                      <input type="text" name='end' autocomplete="off" id="endDate" class="layui-input" placeholder="结束日期">
                    </div>
                </div>
                <div class="layui-inline" style="width: 100px;">
                    <select name="status">
                        <option value="">状态</option>
                        <option value="0">未支付</option>
                        <option value="1">已支付</option>
                        <option value="2">已取消</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" name="search" class="layui-input" placeholder="订单号">
                </div>
                <div class="layui-inline">
                    <button class="layui-btn" lay-submit="" lay-filter="search">
                        <i class="layui-icon">&#xe615;</i>
                    </button>
                </div>
            </form>
        </div>
        <table id="list" lay-filter="list"></table>
    </div>
</div>
{include file="common/foot"/}
<script type="text/html" id="action">
     <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del">{:lang('del')}</a>
    {{# if(d.status==1 && (d.refund_status==0 || d.refund_status==-1)){ }}
        <a class="layui-btn layui-btn-sm" lay-event="refund">退款</a>
    {{# } }}
</script>
<script type="text/html" id="table-toolbar">
    <div class="layui-btn-container">
        <button class="layui-btn layui-btn-danger" lay-event="delAll"><i class="layui-icon layui-icon-delete"></i> 批量删除</button>
        <button class="layui-btn layui-btn-warm" lay-event="delNoPayAll"><i class="layui-icon layui-icon-delete"></i> 一键删除未支付订单</button>
    </div>
</script>
<script>
    layui.use(['table','element','form','laydate'],function(){
        var table = layui.table, $ = layui.jquery,laydate = layui.laydate,form=layui.form,element = layui.element;
        var tableIn = table.render({
            id: 'list',
            elem: '#list',
            url: '{:createUrl("list")}',
            toolbar:'#table-toolbar',
            method:'post',
            page:true,
            cols: [[
                {type: 'checkbox',title:'ID',align:'center',width:50},
                {field: 'id',title:'ID',align:'center',width:60},
                {field: 'agent',title: '所属代理',align:'center',width:120,templet:function(d){
                    if(d.agent){
                        return d.agent.username+'【'+d.agent.id+'】';
                    }else{
                        return '-';
                    }
                }},
                {field: 'ordno',title:'订单号',align:'center',width:160},
                {title: '用户',align:'center',width:100,templet:function(d){
                    if(d.user){
                        return d.user.nickname;
                    }else{
                        return ' - ';
                    }
                }},
                {field:'pay_type',width:80,title: '支付方式',align:'center',templet:function(d){
                    if(d.pay_type==1){
                        return '<span class="green">微信支付</span>';
                    }else if(d.pay_type==2){
                        return '<span class="blue">支付宝</span>';
                    }else if(d.pay_type==3){
                        return '<span class="orange">卡密支付</span>';
                    }else{
                        return '<span class="red">抖音支付</span>';
                    }
                }},
                {field: 'money',title:'金额',align:'center',width:90},
                {field: 'pt_money',title:'收益',align:'center',width:90},
                {field: 'hr_money',title:'一级佣金',align:'center',width:90},
                {field: 'sr_money',title:'二级佣金',align:'center',width:90},
                {field: 'tc_money',title:'抽成',align:'center',width:90},
                {field: 'is_kl',title:'扣量',align:'center',width:90,templet:function(d){
                    if(d.is_kl==1){
                        return '<span class="red">扣量</span>';
                    }else{
                        return '<span class="green">正常</span>';
                    }
                }},
                {field:'status',width:80,title: '状态',align:'center',templet:function(d){
                    if(d.status==0){
                        return '<span class="red">未支付</span>';
                    }else if(d.status==1){
                        return '<span class="green">已支付</span>';
                    }else{
                        return '<span class="blue">已取消</span>';
                    }
                }},
                {field: 'type',title:'类型',align:'center',width:100,templet:function(d){
                    if(d.type==1){
                        return '购买资源';
                    }else if(d.type==2){
                        return '购买会员';
                    }
                }},
                {field: 'spread',title:'详情',align:'left',width:200,templet:function(d){
                    if(d.spread){
                        return '<div class="desc"><img src="'+d.spread.thumb+'" style="border-radius:10px;margin-right:10px;" width="48" height="auto"/><span class="name">'+d.spread.title+'</span></div>';
                    }else if(d.svip){
                        return '<div class="desc">'+d.svip.name+'</div>';
                    }else{
                        return ' - ';
                    }
                }},
                {field:'refund_status',width:120,title: '退款状态',align:'center',templet:function(d){
                    if(d.refund_status==0){
                        return '<span class="green">正常</span>';
                    }else if(d.refund_status==1){
                        return '<span class="blue">退款中</span>';
                    }else if(d.refund_status==2){
                        return '<span class="red">退款完成</span>';
                    }else{
                        return '<span class="red">退款失败 <i lay-event="reason" class="layui-icon layui-icon-about"></i></span>';
                    }
                }},
                {field: 'ctime', align: 'center',title: '时间',width:150},
                {align: 'left',toolbar:'#action',width:150}
            ]]
        });
        form.on('submit(search)', function(data){
            table.reload('list', {
                url: "{:createUrl('list')}",
                method:'post',
                where:data.field,
                page: {
                    curr: 1
                }
            });
            return false;
        });
        //选择日期
        laydate.render({
            elem: '#startDate',
            type:'datetime'
        });
        laydate.render({
            elem: '#endDate',
            type:'datetime'
        });
        //行列表操作项事件
        table.on('tool(list)', function(obj) {
            var data = obj.data;
            if(obj.event === 'del'){
                layer.confirm('确定删除吗',{icon: 3},function(index){
                    $.post("{:createUrl('delorder')}",{data:{0:data}},function(info){
                        if(info.status==200){
                            layer.msg(info.msg,{anim:0},function(){table.reload('list');});
                        }else{
                            layer.msg(info.msg);
                        }                        
                    });
                });
            }else if(obj.event === 'refund'){
                layer.confirm('本操作为系统业务退款，实际退款请在支付平台操作，确定退款吗？',{icon: 3},function(index){
                    $.post("{:createUrl('refund')}",{ids:data.id},function(info){
                        if(info.status==200){
                            layer.msg(info.msg,{anim:0},function(){table.reload('list');});
                        }else{
                            layer.msg(info.msg);
                        }
                    });
                });
            }else if(obj.event === 'reason'){
                if(data.remark){
                    layer.msg(data.remark);
                }
            }else if(obj.event === 'settle'){
                $.post("{:createUrl('settle')}",{ids:data.id},function(info){
                    if(info.status==200){
                        layer.msg(info.msg,{anim:0},function(){table.reload('list');});
                    }else{
                        layer.msg(info.msg);
                    }
                });
            }
        });
        //头工具栏事件批量操作
        table.on('toolbar(list)', function(obj){
            var checkStatus = table.checkStatus('list');
            switch(obj.event){
                case 'settleAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    layer.confirm('如未到分账期则可能执行失败！',{icon: 3},function(index){
                        $.post("{:createUrl('settle')}",{ids:ids},function(info){
                            layer.close(loading);
                            if(info.status==200){
                                layer.msg(info.msg,{anim:0},function(){table.reload('list');});
                            }else{
                                layer.msg(info.msg);
                            }
                        });
                    });
                    break;
                case 'delAll':
                    layer.confirm('确定删除吗',{icon: 3},function(index){
                        $.post("{:createUrl('delorder')}",{data:checkStatus.data},function(info){
                            if(info.status==200){
                                layer.msg(info.msg,{anim:0},function(){table.reload('list');});
                            }else{
                                layer.msg(info.msg);
                            }
                        });
                    });
                break;
                case 'delNoPayAll':
                    layer.confirm('确定删除吗',{icon: 3},function(index){
                        $.post("{:createUrl('delnopay')}",function(info){
                            if(info.status==200){
                                layer.msg(info.msg,{anim:0},function(){table.reload('list');});
                            }else{
                                layer.msg(info.msg);
                            }
                        });
                    });
                break;
            }
        });
    })
</script>
