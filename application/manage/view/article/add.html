{include file="common/head"/}
<script>
    var manage_Image="{:createUrl('Ueditor/index')}";
</script>
<div class="layui-fluid">
    <div class="layui-card-header">添加文章</div>
    <div class="layui-card">
        <form class="layui-form layui-form-pane" lay-filter="agent">
            <div class="layui-form-item">
                <label class="layui-form-label">标题</label>
                <div class="layui-input-inline from-inline-4">
                    <input type="text" name="row[title]" lay-verify="required" lay-reqText="请输入标题中文" placeholder="{:lang('pleaseEnter')}标题中文" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">缩略图</label>
                <div class="layui-input-inline from-inline-3">
                    <input type="hidden" name="row[thumb]" id="thumb" value="">
                    <div class="layui-upload">
                        <button type="button" class="layui-btn" id="uploadImg">上传图片</button>
                        <div class="layui-upload-list">
                            <img class="layui-upload-img" width="76" height="76" src="__ADMIN__/images/default.png" id="Image">
                            <p id="preview"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">文章类型</label>
                <div class="layui-input-inline from-inline-2">
                    <select name="row[sort_id]" lay-search>
                        {volist name="sort" id="v"}
                            <option value="{$v.id}">{$v.name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">文章内容</label>
                <div class="layui-input-inline from-inline-6" style="position: relative;z-index:0;">
                    <textarea type="text/plain" lay-verify="required" name="row[content]" id="content"></textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">是否置顶</label>
                <div class="layui-input-inline from-inline-3">
                    <input type="checkbox" name="row[is_top]" lay-skin="switch" value="1" checked lay-text="置顶|不置顶">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-inline from-inline-3">
                    <input type="checkbox" name="row[status]" lay-skin="switch" value="1" checked lay-text="启用|禁用">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">{:lang('submit')}</button>
                    <a href="{:createUrl('index')}" class="layui-btn layui-btn-primary">{:lang('back')}</a>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="common/foot"/}
<script src="__STATIC__/ueditor/ueditor.config.js?v=1.0.16"></script>
<script src="__STATIC__/ueditor/ueditor.all.js?v=1.1.3"></script>
<script>
var Ueditor = UE.getEditor('content');
layui.use(['form','upload'], function(){
    var form = layui.form,$= layui.jquery;
    $("#uploadImg").on('click',function(){
        layer.open({
            title:'上传封面',
            type:2,
            maxmin: true,
            area:['80%','500px'],
            content:'{:createUrl("attachment/index")}?type=0&name=thumb&prename=Image',
        });
    });
    form.on('submit(submit)', function (data) {
        loading =layer.load(1, {shade: [0.1,'#fff']});
        $.post("", data.field, function (res) {
            layer.close(loading);
            if (res.status===200){
                layer.msg('添加成功',{time: 1000, icon: 1},function(){
                    location.href = '{:createUrl("index")}';
                });
            } else {
                layer.msg(res.msg, {time: 1000, icon: 2});
            }
        });
    })
});
</script>
