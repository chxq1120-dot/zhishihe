{include file="common/head"/}
<div class="table-body" style="padding-top:15px!important;">
    <div class="layui-card">
        <form class="layui-form layui-form-pane" lay-filter="agent">
            <input type="hidden" name="row[ids]" value="{:input('ids')}"/>
            <div class="layui-form-item">
                <label class="layui-form-label">佣金设置</label>
                <div class="layui-input-inline from-inline-5">
                    <input type="radio" lay-filter="commission" name="row[sell_set]" value="1" title="按会员设置" checked>
                    <input type="radio" lay-filter="commission" name="row[sell_set]" value="2" title="按此资源设置">
                </div>
            </div>
            <div class="layui-form-item" id="allocation" style="display:none;">
                <label class="layui-form-label">分配方式</label>
                <div class="layui-input-inline  from-inline-6">
                    <div class="layui-form-item" style="margin-bottom:5px;">
                        <div style="display: flex;align-items: center">
                            <span class="layui-labels" style="padding-right:5px;">一级</span>
                            <select class="layui-select" name="row[sell_type]" style="width:100px;">
                                <option value="1">百分比</option>
                                <option value="2">固定金额</option>
                            </select>
                            <span class="layui-labels" style="padding-right:5px;">佣金</span>
                            <input style="width:100px;" type="text" name="row[sell]" value="0.05" placeholder="佣金" autocomplete="off" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">百分比填小数：例5%填0.05</div>
                    </div>
                    {if config('setting.commission_fee')=='2'}
                    <div class="layui-form-item" style="margin-bottom:5px;">
                        <div style="display: flex;align-items: center">
                            <span class="layui-labels" style="padding-right:5px;">二级</span>
                            <select class="layui-select" name="row[sell_type2]" style="width:100px;">
                                <option value="1">百分比</option>
                                <option value="2">固定金额</option>
                            </select>
                            <span class="layui-labels" style="padding-right:5px;">佣金</span>
                            <input style="width:100px;" type="text" name="row[sell2]" value="0.05" placeholder="佣金" autocomplete="off" class="layui-input">
                        </div>
                        <div class="layui-form-mid layui-word-aux">百分比填小数：例5%填0.05</div>
                    </div>
                    {/if}
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">{:lang('submit')}</button>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="common/foot"/}
<script>
    layui.use(['form'], function(){
        var form = layui.form,$= layui.jquery;
        form.on('radio(commission)',function (data) {
            if(data.value==1){
                $('#allocation').hide();
            }else{
                $('#allocation').show();
            }
        });
        form.on('submit(submit)', function (data) {
            loading =layer.load(1, {shade: [0.1,'#fff']});
            $.post("", data.field, function (res) {
                layer.close(loading);
                if (res.status===200){
                    layer.msg('设置成功',{time: 1000, icon: 1},function(){
                        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                        parent.layer.close(index);//再执行关闭
                    });
                } else {
                    layer.msg(res.msg, {time: 1000, icon: 2});
                }
            });
        })
    });
</script>
