{include file="common/head"/}
<style>
    html,body{
        background-color:#fff;
    }
</style>
<div class="table-body" style="padding-top:25px!important;border:0;">
    <div class="layui-card">
        <form class="layui-form layui-form-pane" lay-filter="agent">
            <input type="hidden" name="row[ids]" value="{:input('ids')}"/>
            <div class="layui-form-item">
                <label class="layui-form-label">选择会员专享</label>
                <div class="layui-input-inline from-inline-5">
                    <select class="layui-select" name="row[svip_id]">
                        <option value="-1">取消会员专享设置</option>
                        <option value="0">设置为所有会员专享</option>
                        {volist name="sviplist" id="v"}
                            <option value="{$v.id}">设置为{$v.name}专享</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">{:lang('submit')}</button>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="common/foot"/}
<script>
    layui.use(['form'], function(){
        var form = layui.form,$= layui.jquery;
        form.on('submit(submit)', function (data) {
            loading =layer.load(1, {shade: [0.1,'#fff']});
            $.post("", data.field, function (res) {
                layer.close(loading);
                if (res.status===200){
                    layer.msg('设置成功',{time: 1000, icon: 1},function(){
                        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                        parent.layer.close(index);//再执行关闭
                    });
                } else {
                    layer.msg(res.msg, {time: 1000, icon: 2});
                }
            });
        })
    });
</script>
