{include file="common/head"/}
<body>
<div class="layui-fluid">
    <div class="table-body">
        <form class="layui-form layui-form-pane">
            <div class="layui-form-item">
                <label class="layui-form-label">特权名称</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="text" name="name" lay-verify="required" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">特权类别</label>
                <div class="layui-input-inline from-inline-6">
                    <select name="type" lay-filter="tq">
                        <option value="1">资源级别</option>
                        <option value="2">资源数量</option>
                        <option value="3">资源分类</option>
                        <option value="4">站内广告</option>
                        <option value="5">分销佣金</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">特权图标</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="hidden" name="url" id="thumb" value="">
                    <div class="layui-upload">
                        <div class="layui-upload-list" style="width:64px;height:64px;" id="uploadImg">
                            <img class="layui-upload-img" width="64" height="64" src="__ADMIN__/images/default.png" id="Image">
                        </div>
                        <div id="preview"></div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">特权规则</label>
                <div class="layui-input-inline from-inline-6">
                    <div id="level">
                        {volist name="levels" id="v"}
                            <input type="checkbox" name="level[{$v.id}]" value="{$v.name}" title="{$v.name}" {if $key==0}checked{/if}>
                        {/volist}
                    </div>
                    <div style="display:none;" id="num">
                        <input type="text" name="num" class="layui-input" value="1">
                    </div>
                    <div style="display:none;" id="sort">
                        <input type="checkbox" name="sort_id[]" title="不限" value="0">
                        {foreach $sort as $k=>$v}
                            <input type="checkbox" name="sort_id[]" title="{$v.name}" value="{$v.id}">
                        {/foreach}
                    </div>
                    <div style="display:none;" id="adv">
                        <input type="radio" name="adv" value="0" title="无广告" checked>
                        <input type="radio" name="adv" value="1" title="有广告">
                    </div>
                    <div style="display:none;" id="sell">
                        <div class="level" style="display: flex;align-items: center;">
                            <span class="label">一级：</span>
                            <input type="text" name="sell" placeholder="请填写一级佣金" class="layui-input" style="width:150px;">
                            {if config('setting.commission_fee')=='2'}
                                <span class="label" style="padding-left:10px;">二级：</span>
                                <input type="text" name="sell2" placeholder="请填写二级佣金" class="layui-input" style="width:150px;">
                            {/if}
                        </div>
                        <div class="layui-word-aux" style="padding-top:5px;">如设置5%填写0.05,两级必须小于1</div>
                    </div>
                    <div style="display:none;" id="reward">
                        <input type="text" name="reward" class="layui-input" value="0.5">
                        <div class="layui-word-aux" style="padding-top:5px;">元，邀请好友注册奖励</div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">特权简介</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="text" name="desc" lay-verify="required" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item" style="padding-top: 10px;">
                <div class="layui-input-block">
                    <button type="submit" class="layui-btn" lay-submit="" lay-filter="sub">立即提交</button>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="common/foot"/}
<script>

    layui.use(['element', 'form'], function () {
        var $ = layui.jquery, form = layui.form; //Tab的切换功能，切换事件监听等，需要依赖element模块
        $("#uploadImg").on('click',function(){
            layer.open({
                title:'上传图标',
                type:2,
                maxmin: true,
                area:['80%','500px'],
                content:'{:createUrl("attachment/index")}?type=0&name=thumb&prename=Image',
            });
        });
        form.on('submit(sub)', function (data) {
            loading = layer.load(1, {shade: [0.1, '#fff']});
            $.post('', data.field, function (res) {
                layer.close(loading);
                if (res.status == 200) {
                    layer.msg(res.msg, {icon: 1, time: 1000}, function () {
                        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                        parent.layer.close(index);//再执行关闭
                    });
                } else {
                    layer.msg(res.msg, {icon: 2, time: 1000});
                }
            });
            return false; //阻止表单跳转。如果需要表单跳转，去掉这段即可。
        });
        var r = "#level";
        form.on('select(tq)', function (data) {
            if (data.value == 1) {
                $(r).hide();
                r = "#level";
                $(r).show();
            } else if (data.value == 2) {
                $(r).hide();
                r = "#num";
                $(r).show();
            } else if (data.value == 3) {
                $(r).hide();
                r = "#sort";
                $(r).show();
            } else if (data.value == 4) {
                $(r).hide();
                r = "#adv";
                $(r).show();
            } else if (data.value == 5) {
                $(r).hide();
                r = "#sell";
                $(r).show();
            }else{
                $(r).hide();
                r = "#reward";
                $(r).show();
            }
        });
    });
</script>
</body>
