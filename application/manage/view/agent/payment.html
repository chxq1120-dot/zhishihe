{include file="common/head"/}
<div class="layui-fluid">
    <div class="table-body">
        <div class="layui-card">
            <form class="layui-form layui-form-pane" lay-filter="formbar">
                <input type="hidden" name="row[id]" value="{$row['id']}"/>
                <input type="hidden" name="row[admin_id]" value="{$row['admin_id']}"/>
                <div class="layui-form-item">
                    <label class="layui-form-label">卡密支付开关</label>
                    <div class="layui-input-inline from-inline-3">
                        <input type="checkbox" name="row[card_pay]" lay-skin="switch" value="1" {eq name="$row['card_pay']" value="1"}checked{/eq} lay-text="开启|禁用">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">微信支付开关</label>
                    <div class="layui-input-inline from-inline-3">
                        <input type="checkbox" name="row[wechat_pay]" lay-skin="switch" value="1" {eq name="$row['wechat_pay']" value="1"}checked{/eq} lay-text="开启|禁用">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">虎皮椒支付网关</label>
                    <div class="layui-input-inline from-inline-5">
                        <input type="text" name="row[xunhu_api]" value="{$row['xunhu_api']}" lay-reqText="虎皮椒支付网关" placeholder="{:lang('pleaseEnter')}虎皮椒支付网关" class="layui-input">
                        <div class="layui-word-aux">一般不用动，如虎皮椒官方有调整手动更新即可</div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">虎皮椒appid</label>
                    <div class="layui-input-inline from-inline-4">
                        <input type="text" name="row[xunhu_appid]" value="{$row['xunhu_appid']}" lay-reqText="请输入虎皮椒appid" placeholder="{:lang('pleaseEnter')}虎皮椒appid" class="layui-input">
                        <div class="layui-word-aux">虎皮椒微信支付通道Appid</div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">虎皮椒密钥</label>
                    <div class="layui-input-inline from-inline-4">
                        <input type="text" name="row[xunhu_key]" value="{$row['xunhu_key']}" lay-reqText="请输入虎皮椒密钥" placeholder="{:lang('pleaseEnter')}虎皮椒密钥" class="layui-input">
                        <div class="layui-word-aux">虎皮椒微信支付通道密钥</div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">虎皮椒店铺域名</label>
                    <div class="layui-input-inline from-inline-4">
                        <input type="text" name="row[xunhu_domain]" value="{$row['xunhu_domain']}" lay-reqText="请输入虎皮椒店铺域名" placeholder="{:lang('pleaseEnter')}虎皮椒店铺域名" class="layui-input">
                        <div class="layui-word-aux">需要添加http://或https://，末尾不加/</div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">虎皮椒店铺名称</label>
                    <div class="layui-input-inline from-inline-4">
                        <input type="text" name="row[xunhu_name]" value="{$row['xunhu_name']}" lay-reqText="请输入虎皮椒店铺名称" placeholder="{:lang('pleaseEnter')}虎皮椒店铺名称" class="layui-input">
                        <div class="layui-word-aux">虎皮椒店铺名称</div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">保存设置</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{include file="common/foot"/}
<script>
    layui.config({
        base: '__STATIC__/layuiadmin/mods/',
        version: '1.0'
    });
    layui.use(['form','layarea','upload'], function(){
        var form = layui.form,$= layui.jquery;
        form.on('submit(submit)', function (data) {
            loading =layer.load(1, {shade: [0.1,'#fff']});
            $.post("", data.field, function (res) {
                layer.close(loading);
                if (res.status===200){
                    layer.msg('更新成功',{time: 1000, icon: 1},function(){
                        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                        parent.layer.close(index);//再执行关闭
                    });
                } else {
                    layer.msg(res.msg, {time: 1000, icon: 2});
                }
            });
        })
    });
</script>
