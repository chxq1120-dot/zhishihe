{include file="common/head"/}
<style>
   .layui-table-cell{height: inherit;}
</style>
<div class="layui-fluid">
    <div class="admin-head">
        <ul>
            <li class="on">代理列表</li>
        </ul>
    </div>
    <div class="table-body">
        <div class="search-tool">
            <form class="layui-form">
                <div class="layui-inline">
                   <input type="text" class="layui-input" placeholder="检索日期" id="ondate" style="width:200px;">
                    <span class="item-icon"><i class="layui-icon layui-icon-date"></i></span>
                </div>
                <div class="layui-inline">
                    <select id="onstatus" lay-filter="onstatus">
                        <option value="">全部状态</option>
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" class="layui-input" placeholder="帐号 / id" id="search" style="width:200px;" />
                    <span class="item-icon" id="onsearch"><i class="icon icon-search"></i></span>
                </div>
            </form>
            <div class="func-btn" id="func-btn">
                <a href="javascript:;" class="add layui-btn layui-bg-blue layui-btn-small">
                    <i class="layui-icon layui-icon-addition"></i>
                    {:lang('add')}代理
                </a>
            </div>
        </div>
        <table id="list" lay-filter="list"></table>
    </div>
</div>

{include file="common/foot"/}
<script type="text/html" id="action">
    <a lay-event="edit" class="layui-btn layui-btn-sm"><i class="layui-icon layui-icon-edit"></i>{:lang('edit')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del"><i class="layui-icon layui-icon-delete"></i>{:lang('del')}</a>
    <a lay-event="more" class="layui-btn layui-btn-sm layui-bg-blue"><i class="icon icon-down"></i> 更多</a>
</script>
<script type="text/html" id="status">
    <input type="checkbox" name="status" id="{{d.id}}" lay-filter="status" value="{{d.status}}" lay-skin="switch" lay-text="开启|禁用" {{ d.status==1 ? 'checked':'' }}>
</script>
<script type="text/html" id="kammi">
    <input type="checkbox" name="kammi_type" id="{{d.id}}" lay-filter="kammi" value="{{d.kammi_type}}" lay-skin="switch" lay-text="允许|禁用" {{ d.kammi_type==1 ? 'checked':'' }}>
</script>
<script type="text/html" id="expDate">
      <span class="exp-date">{{d.exp_time}}</span>
</script>
<script type="text/html" id="table-toolbar">
    <div class="layui-btn-container">
        <button class="layui-btn" lay-event="openAll"><i class="icon icon-qiyong"></i> 批量启用</button>
        <button class="layui-btn" lay-event="closeAll"><i class="icon icon-jinyong"></i> 批量禁用</button>
        <button class="layui-btn layui-btn-danger" lay-event="delAll"><i class="layui-icon layui-icon-delete"></i>批量删除</button>
        <button class="layui-btn" lay-event="seniorAll"><i class="icon icon-setting"></i> 绑定上级</button>
        <button class="layui-btn" lay-event="knotAll"><i class="icon icon-setting"></i> 批量扣量</button>
        <button class="layui-btn" lay-event="feeAll"><i class="icon icon-setting"></i> 批量手续费</button>
        <button class="layui-btn layui-bg-blue" id="moreMemu"><i class="icon icon-down"></i> 更多操作</button>
    </div>
</script>
<script>
    var dateVal='',statusVal='',searchVal='';
    layui.use(['table','element','form','laydate','dropdown'],function(){
        var table = layui.table, $ = layui.jquery,laydate = layui.laydate,form=layui.form,dropdown=layui.dropdown;
        var tableIn = table.render({
            id: 'list',
            elem: '#list',
            url: '{:createUrl("index")}',
            toolbar:'#table-toolbar',
            method:'get',
            page:true,
            response:{
                statusName:'status',
                statusCode:200,
                msgName:'msg',
                countName:'total',
                dataName:'data',
            },
            cols: [[
                {type: 'checkbox',title:'ID',align:'center',width:50},
                {field: 'id',title: 'ID',width:60},
                {field: 'agents',align:'center',title: '所属上级',width:120,templet:function(d){
                    if(d.agents){
                        return d.agents.username+'【'+d.agents.id+'】';
                    }else{
                        return '-';
                    }
                }},
                {field: 'avatar',align:'center',title: '头像',width:80,templet:function(d){
                    if(d.avatar){
                        return '<img src="'+d.avatar+'" width="32" height="32"/>';
                    }else{
                        return '<img src="__ADMIN__/images/default.png"  width="32px" height="32px"/>';
                    }
                }},
                {field: 'username',title: '用户名',width:120},
                {field: 'balance',align:'center',title: '账户余额',width:130,sort:true},
                {field: 'cash_fee',align:'center',title: '抽成', width:100,templet:function(d){
                    return d.min_take+'%';
                }},
                {field: 'min_pub',align:'center',title: '发布现价', width:100,templet:function(d){
                    return d.min_pub;
                }},
                {field: 'dis_pub',align:'center',title: '发布原价', width:100,templet:function(d){
                    return d.dis_pub;
                }},
                {field: 'cash_fee',align:'center',title: '手续费', width:100,templet:function(d){
                    return d.cash_fee+'%';
                }},
                {field: 'take_num',align:'center',title: '扣量', width:100,templet:function(d){
                    return d.take_num+'扣1';
                }},
                {field: 'kammi_type',align:'center',title: '卡密创建权限', width:120,toolbar: '#kammi'},
                {field: 'status',align: 'center',title: '{:lang("status")}',width: 100,toolbar: '#status'},
                {field: 'exp_time',align:'center',title: '到期时间', width:150,templet: '#expDate'},
                {field: 'logtime_text',align:'center',title: '登录时间', width:180},
                {field: 'ctime_text', align: 'center',title: '添加时间',width:150},
                {align: 'center',toolbar:'#action',title: '操作',width:280}
            ]],
            done:function(res, curr, count){
                dropdown.render({
                    elem: '#moreMemu', //可绑定在任意元素中，此处以上述按钮为例
                    data: [
                        {
                            title: '批量抽成', id: 1,
                        },
                        {
                            title: '批量现价', id: 2,
                        },
                        {
                            title: '批量原价', id: 3,
                        },
                        {
                            title: '清空推广', id: 4,
                        },
                    ],
                    click: function(data, othis){
                        var checkStatus = table.checkStatus('list');
                        var ids = [];
                        $(checkStatus.data).each(function (i, o){
                            ids.push(o.id);
                        });
                        if (ids.length === 0) {
                            layer.msg('请选择要操作的代理', {time: 1500});
                            return false;
                        }
                        switch (data.id) {
                            case 1://批量抽成
                                layer.prompt({
                                    formType: 0,
                                    value: '',
                                    title: '设置抽成比例',
                                    maxlength: 24,
                                }, function(value, index, elem){
                                    var take_id=parseInt(value);
                                    if(take_id.toString() == "NaN"){
                                        layer.msg('请输入抽成比例', {time: 1000, icon: 2});
                                        return false;
                                    }
                                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                                    $.post("{:createUrl('setUp')}",{ids:ids,params:'{"min_take":'+take_id+'}'},function (res){
                                        layer.close(loading);
                                        if (res.status === 200){
                                            layer.msg('操作成功', {time: 1000, icon: 1});
                                            tableIn.reload();
                                        } else {
                                            layer.msg(res.msg, {time: 1000, icon: 2});
                                        }
                                    });
                                    layer.close(index);
                                });
                                break;
                            case 2://设置现价
                                layer.prompt({
                                    formType: 0,
                                    value: '',
                                    title: '设置最低发布现价',
                                    maxlength: 24,
                                }, function(value, index, elem){
                                    var pub_id=parseInt(value);
                                    if(pub_id.toString() == "NaN"){
                                        layer.msg('请输入发布现价', {time: 1000, icon: 2});
                                        return false;
                                    }
                                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                                    $.post("{:createUrl('setUp')}",{ids:ids,params:'{"min_pub":'+pub_id+'}'},function (res){
                                        layer.close(loading);
                                        if (res.status === 200){
                                            layer.msg('操作成功', {time: 1000, icon: 1});
                                            tableIn.reload();
                                        } else {
                                            layer.msg(res.msg, {time: 1000, icon: 2});
                                        }
                                    });
                                    layer.close(index);
                                });
                                break;
                            case 3://设置原价
                                layer.prompt({
                                    formType: 0,
                                    value: '',
                                    title: '设置最低发布原价',
                                    maxlength: 24,
                                }, function(value, index, elem){
                                    var dis_id=parseInt(value);
                                    if(dis_id.toString() == "NaN"){
                                        layer.msg('请输入发布现价', {time: 1000, icon: 2});
                                        return false;
                                    }
                                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                                    $.post("{:createUrl('setUp')}",{ids:ids,params:'{"dis_pub":'+dis_id+'}'},function (res){
                                        layer.close(loading);
                                        if (res.status === 200){
                                            layer.msg('操作成功', {time: 1000, icon: 1});
                                            tableIn.reload();
                                        } else {
                                            layer.msg(res.msg, {time: 1000, icon: 2});
                                        }
                                    });
                                    layer.close(index);
                                });
                                break;
                            case 4://清空推广
                                layer.confirm('确定要清空推广中心资源吗', {icon: 3}, function (index) {
                                    $.post("{:createUrl('cleanUp')}", {ids: ids}, function (info) {
                                        if (info.status === 200) {
                                            layer.msg(info.msg, {time: 1000, icon: 1});
                                            tableIn.reload();
                                        } else {
                                            layer.msg(info.msg, {time: 1000, icon: 2});
                                        }
                                    });
                                });
                                break;
                        }
                    }
                });
            }
        });
        //选择日期
        laydate.render({
            elem: '#ondate',
            range: '-',
            done:function(value, date, endDate){
                dateVal=value, statusVal=$('#onstatus').val(),searchVal=$('#search').val();
                var params='';
                if(statusVal) params='{"status":"'+statusVal+'"}';
                table.reload('list',{
                    where:{
                        date:dateVal,
                        search:searchVal,
                        filter:params
                    },
                    page: {
                        curr: 1
                    }
                });
            }
        });
        //下拉选项
        form.on('select(onstatus)', function(data){
            dateVal=$('#ondate').val(),statusVal=data.value,searchVal=$('#search').val();
            var params='';
            if(statusVal) params='{"status":"'+statusVal+'"}';
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:params
                },
                page: {
                    curr: 1
                }
            });
        });
        //搜索关键字
        $('#onsearch').on('click',function(e){
            console.log(e);
            dateVal=$('#ondate').val(),statusVal=$('#onstatus').val(),searchVal=$('#search').val();
            var params='';
            if(statusVal) params='{"status":"'+statusVal+'"}';
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:params
                },
                page: {
                    curr: 1
                }
            });
        });
        //监听添加
        $('#func-btn .add').on('click',function () {
            layer.open({
                title:'添加代理',
                type:2,
                maxmin: true,
                content:'{:createUrl("add")}',
                area:['90%','580px'],
                end:function(){
                    tableIn.reload();
                }
            });
        });

        //卡密创建权限
        form.on('switch(kammi)',function(data){
            var kammi=data.elem.value==1 ? 0 : 1;
            layer.confirm('允许创建卡密前请关闭卡密计算收益配置，你确定要操作吗？', {icon: 3}, function (index) {
                layer.close(index);
                var loading = layer.load(1, {shade: [0.1, '#fff']});
                $.post('{:createUrl("setUp")}',{'ids':data.elem.id,'params':'{"kammi_type":"'+kammi+'"}'},function(res){
                    layer.close(loading);
                    if(res.status ===200){
                        data.elem['value']=kammi;
                        layer.msg('操作成功', {time: 1000, icon: 1});
                        return false;
                    }else{
                        layer.msg('操作失败', {time: 1000, icon: 2});
                        return false;
                    }
                });
            });
        });
        //启用禁用
        form.on('switch(status)',function(data){
            var loading = layer.load(1, {shade: [0.1, '#fff']});
            var status=data.elem.value==1 ? 0 : 1;
            $.post('{:createUrl("setUp")}',{'ids':data.elem.id,'params':'{"status":"'+status+'"}'},function(res){
                layer.close(loading);
                if(res.status ===200){
                    data.elem['value']=status;
                    layer.msg('操作成功', {time: 1000, icon: 1});
                    return false;
                }else{
                    layer.msg('操作失败！', {time: 1000, icon: 2});
                    return false;
                }
            });
        });
        //行列表操作项事件
        table.on('tool(list)', function(obj) {
            var that = this;
            var data = obj.data;
            if(obj.event === 'del'){
                layer.confirm('你确定要删除吗？', {icon: 3}, function (index) {
                    $.post("{:createUrl('del')}",{ids:data.id},function(res){
                        if(res.status===200){
                            layer.msg('删除成功',{time:1000,icon:1});
                            tableIn.reload();
                        }else{
                            layer.msg(res.msg,{time:1000,icon:2});
                        }
                    });
                    layer.close(index);
                });
            }else if(obj.event === 'edit'){
                layer.open({
                    title:'编辑代理',
                    type:2,
                    maxmin: true,
                    content:'{:createUrl("edit")}?ids='+data.id,
                    area:['90%','580px'],
                    end:function(){
                        tableIn.reload();
                    }
                });
            }else if(obj.event === 'more'){
                // 更多下拉菜单
                dropdown.render({
                    elem: that,
                    show: true, // 外部事件触发即显示
                    data: [
                        {
                            title: '分站设置',
                            id: 'subsite'
                        }, {
                            title: '登录密码',
                            id: 'pwd'
                        }, {
                            title: '余额充值',
                            id: 'recharge'
                        }
                    ],
                    click: function(action, othis){
                        //根据 id 做出不同操作
                        switch(action.id){
                            case 'subsite':
                                layer.open({
                                    title:'分站设置',
                                    type:2,
                                    maxmin: true,
                                    content:'{:createUrl("setting")}?ids='+data.id,
                                    area:'70%',
                                    success: function(layero, index, that){
                                        layer.iframeAuto(index); // 让 iframe 高度自适应
                                        that.offset(); // 重新自适应弹层坐标
                                    },
                                    end:function(){
                                        tableIn.reload();
                                    }
                                });
                                break;
                            case 'pwd':
                                layer.open({
                                    title:'修改密码',
                                    type:2,
                                    content:'{:createUrl("pwd")}?ids='+data.id,
                                    area:'70%',
                                    success: function(layero, index, that){
                                        layer.iframeAuto(index); // 让 iframe 高度自适应
                                        that.offset(); // 重新自适应弹层坐标
                                    },
                                    end:function(){
                                        tableIn.reload();
                                    }
                                });
                                break;
                            case 'recharge':
                                layer.open({
                                    title:'余额充值',
                                    type:2,
                                    area:['70%','450px'],
                                    content:'{:createUrl("recharge")}?ids='+data.id,
                                    end:function(){
                                        tableIn.reload();
                                    }
                                });
                                break;
                        }
                    }});
            }
        });
        //头工具栏事件批量操作---删除
        table.on('toolbar(list)', function(obj){
            var checkStatus = table.checkStatus('list');
            var ids = [];
            $(checkStatus.data).each(function (i, o){
                ids.push(o.id);
            });
            if(ids.length===0){
               layer.msg('请选择要操作的代理');
               return false;
            }
            switch(obj.event){
                case 'openAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('setUp')}",{ids:ids,params:'{"status":1}'},function (res){
                        layer.close(loading);
                        if(res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        }else{
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                case 'closeAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('setUp')}",{ids:ids,params:'{"status":0}'},function (res){
                        layer.close(loading);
                        if (res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        } else {
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                case 'delAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('del')}",{ids:ids}, function (res) {
                        layer.close(loading);
                        if (res.status === 200){
                            layer.msg(res.msg, {time: 1000, icon: 1});
                            tableIn.reload();
                        } else {
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                case 'seniorAll':
                    layer.prompt({
                        formType: 0,
                        value: '',
                        title: '请输入上级ID',
                        maxlength: 24,
                    }, function(value, index, elem){
                        var senior_id=parseInt(value);
                        if(senior_id.toString() == "NaN"){
                            layer.msg('请输入上级ID', {time: 1000, icon: 2});
                            return false;
                        }
                        var loading = layer.load(1,{shade: [0.1, '#fff']});
                        $.post("{:createUrl('setUp')}",{ids:ids,params:'{"admin_id":'+senior_id+'}'},function (res){
                            layer.close(loading);
                            if (res.status === 200){
                                layer.msg('操作成功', {time: 1000, icon: 1});
                                tableIn.reload();
                            } else {
                                layer.msg(res.msg, {time: 1000, icon: 2});
                            }
                        });
                        layer.close(index);
                    });
                    break;
                    case 'takeAll':
                        layer.prompt({
                            formType: 0,
                            value: '',
                            title: '设置抽成比例',
                            maxlength: 24,
                        }, function(value, index, elem){
                            var take_id=parseInt(value);
                            if(take_id.toString() == "NaN"){
                                layer.msg('请输入抽成比例', {time: 1000, icon: 2});
                                return false;
                            }
                            var loading = layer.load(1,{shade: [0.1, '#fff']});
                            $.post("{:createUrl('setUp')}",{ids:ids,params:'{"min_take":'+take_id+'}'},function (res){
                                layer.close(loading);
                                if (res.status === 200){
                                    layer.msg('操作成功', {time: 1000, icon: 1});
                                    tableIn.reload();
                                } else {
                                    layer.msg(res.msg, {time: 1000, icon: 2});
                                }
                            });
                            layer.close(index);
                        });
                        break;
                case 'knotAll':
                    layer.prompt({
                        formType: 0,
                        value: '',
                        title: '设置扣量',
                        maxlength: 24,
                    }, function(value, index, elem){
                        var knot_id=parseInt(value);
                        if(knot_id.toString() == "NaN"){
                            layer.msg('请输入扣量', {time: 1000, icon: 2});
                            return false;
                        }
                        var loading = layer.load(1,{shade: [0.1, '#fff']});
                        $.post("{:createUrl('setUp')}",{ids:ids,params:'{"take_num":'+knot_id+'}'},function (res){
                            layer.close(loading);
                            if (res.status === 200){
                                layer.msg('操作成功', {time: 1000, icon: 1});
                                tableIn.reload();
                            } else {
                                layer.msg(res.msg, {time: 1000, icon: 2});
                            }
                        });
                        layer.close(index);
                    });
                    break;
                case 'feeAll':
                    layer.prompt({
                        formType: 0,
                        value: '',
                        title: '设置手续费',
                        maxlength: 24,
                    }, function(value, index, elem){
                        var fee_id=parseInt(value);
                        if(fee_id.toString() == "NaN"){
                            layer.msg('请输入手续费比例', {time: 1000, icon: 2});
                            return false;
                        }
                        var loading = layer.load(1,{shade: [0.1, '#fff']});
                        $.post("{:createUrl('setUp')}",{ids:ids,params:'{"cash_fee":'+fee_id+'}'},function (res){
                            layer.close(loading);
                            if (res.status === 200){
                                layer.msg('操作成功', {time: 1000, icon: 1});
                                tableIn.reload();
                            } else {
                                layer.msg(res.msg, {time: 1000, icon: 2});
                            }
                        });
                        layer.close(index);
                    });
                    break;
                case 'pubAll':
                    layer.prompt({
                        formType: 0,
                        value: '',
                        title: '设置最低发布现价',
                        maxlength: 24,
                    }, function(value, index, elem){
                        var pub_id=parseInt(value);
                        if(pub_id.toString() == "NaN"){
                            layer.msg('请输入发布现价', {time: 1000, icon: 2});
                            return false;
                        }
                        var loading = layer.load(1,{shade: [0.1, '#fff']});
                        $.post("{:createUrl('setUp')}",{ids:ids,params:'{"min_pub":'+pub_id+'}'},function (res){
                            layer.close(loading);
                            if (res.status === 200){
                                layer.msg('操作成功', {time: 1000, icon: 1});
                                tableIn.reload();
                            } else {
                                layer.msg(res.msg, {time: 1000, icon: 2});
                            }
                        });
                        layer.close(index);
                    });
                    break;
                case 'disAll':
                    layer.prompt({
                        formType: 0,
                        value: '',
                        title: '设置最低发布原价',
                        maxlength: 24,
                    }, function(value, index, elem){
                        var dis_id=parseInt(value);
                        if(dis_id.toString() == "NaN"){
                            layer.msg('请输入发布现价', {time: 1000, icon: 2});
                            return false;
                        }
                        var loading = layer.load(1,{shade: [0.1, '#fff']});
                        $.post("{:createUrl('setUp')}",{ids:ids,params:'{"dis_pub":'+dis_id+'}'},function (res){
                            layer.close(loading);
                            if (res.status === 200){
                                layer.msg('操作成功', {time: 1000, icon: 1});
                                tableIn.reload();
                            } else {
                                layer.msg(res.msg, {time: 1000, icon: 2});
                            }
                        });
                        layer.close(index);
                    });
                    break;
