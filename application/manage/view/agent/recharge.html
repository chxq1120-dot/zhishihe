{include file="common/head"/}
<div class="layui-fluid">
    <div class="layui-card">
        <form class="layui-form layui-form-pane" lay-filter="agent">
            <input type="hidden" name="ids" lay-verify="required" value="{:input('ids/d')}"/>
            <div class="layui-form-item">
                <label class="layui-form-label">用户名</label>
                <div class="layui-input-inline from-inline-6">
                    <div class="layui-text">{$user['username']}</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">账户余额</label>
                <div class="layui-input-inline from-inline-6">
                    <div class="layui-text">{$user['balance']}</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">充值类型</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="radio" name="row[mode]" value="1" checked title="增加余额">
                    <input type="radio" name="row[mode]" value="2" title="减少余额">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">充值金额</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="number" name="row[money]" lay-verify="required" lay-reqText="请输入充值金额" placeholder="{:lang('pleaseEnter')}充值金额" class="layui-input">
                    <div class="layui-form-mid layui-word-aux">充值金额必须为数字且为正数</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">操作备注</label>
                <div class="layui-input-inline from-inline-6">
                    <input type="text" name="row[remark]" lay-verify="required" lay-reqText="请输入操作备注" placeholder="{:lang('pleaseEnter')}操作备注" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn layui-bg-blue layui-btn-small" lay-submit="" lay-filter="submit">确认充值</button>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="common/foot"/}
<script>
    layui.use(['form'], function(){
        var form = layui.form,$= layui.jquery;
        form.on('submit(submit)', function (data) {
            loading =layer.load(1, {shade: [0.1,'#fff']});
            $.post("", data.field, function (res) {
                layer.close(loading);
                if (res.status===200){
                    layer.msg('操作成功',{time: 1000, icon: 1},function(){
                        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                        parent.layer.close(index);//再执行关闭
                    });
                } else {
                    layer.msg(res.msg, {time: 1000, icon: 2});
                }
            });
        })
    });
</script>
