{include file="common/head"/}
<style>
html,body{
    background-color: #fff;
}
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <form class="layui-form layui-form-pane" lay-filter="formbar">
            <input type="hidden" name="row[id]" value="{$row['id']}"/>
            <input type="hidden" name="row[admin_id]" value="{$row['admin_id']}"/>
            <div class="layui-form-item">
                <label class="layui-form-label">分站名称</label>
                <div class="layui-input-inline from-inline-3">
                    <input type="text" name="row[webname]" value="{$row['webname']}" lay-reqText="请输入分站名称" placeholder="{:lang('pleaseEnter')}分站名称" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">分站域名</label>
                <div class="layui-input-inline from-inline-5">
                    <div class="layui-block">
                        <div class="layui-inline">
                            <label class="layui-form-mid">开启SSL</label>
                            <div class="layui-input-inline" style="width: 200px;">
                                <input type="checkbox" name="row[is_ssl]" lay-skin="switch" value="1" {eq name="$row['is_ssl']" value="1"}checked{/eq} lay-text="开启|禁用">
                            </div>
                        </div>
                    </div>
                    <div class="layui-block">
                        <div class="layui-inline">
                            <label class="layui-form-mid">域名类型</label>
                            <div class="layui-input-inline" style="width: 200px;">
                                <input type="radio" lay-filter="sub_type" name="row[sub_type]" value="0" {eq name="$row['sub_type']" value="0"}checked{/eq} title="二级域名">
                                <input type="radio" lay-filter="sub_type" name="row[sub_type]" value="1" {eq name="$row['sub_type']" value="1"}checked{/eq} title="一级域名">
                            </div>
                        </div>
                    </div>

                    <div class="layui-inline" id="sub_domain">
                        <div class="layui-input-inline" style="width: 100px;">
                            <input type="text" name="row[sub_prefix]" value="{$row['sub_prefix']}" lay-reqText="请输入分站域名" placeholder="{:lang('pleaseEnter')}分站域名" class="layui-input">
                        </div>
                        <div class="layui-form-mid">.</div>
                        <div class="layui-input-inline" style="width: 150px;">
                            <select class="layui-select" name="row[base_domain]">
                                {volist name="domain_list" id="v"}
                                    <option value="{$v}" {eq name="$row['base_domain']" value="$v"}selected{/eq}>{$v}</option>
                                {/volist}
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline" style="width: 350px;display:none;" id="one_domain">
                        <input type="text" name="row[domain]" value="{$row['domain']}" lay-reqText="请输入分站域名" placeholder="{:lang('pleaseEnter')}分站域名" class="layui-input">
                    </div>
                    <div class="layui-word-aux">H5端分站域名支持配置二级域名和一级域名</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">联系人</label>
                <div class="layui-input-inline from-inline-4">
                    <input type="text" name="row[realname]" value="{$row['realname']}" lay-reqText="请输入联系人" placeholder="{:lang('pleaseEnter')}联系人" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">微信二维码</label>
                <div class="layui-input-inline from-inline-3">
                    <input type="hidden" name="row[qrcode]" id="qrcode" value="{$row['qrcode']}">
                    <div class="layui-upload">
                        <div class="layui-upload-list" id="uploadImg" style="cursor: pointer;">
                            <img class="layui-upload-img" width="76" height="76" src="{$row['qrcode']|default='__ADMIN__/images/default.png'}" id="Image">
                            <p id="qr_preview"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">微信号</label>
                <div class="layui-input-inline from-inline-4">
                    <input type="text" name="row[wechat]" value="{$row['wechat']}" lay-reqText="请输入微信号" placeholder="{:lang('pleaseEnter')}微信号" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">手机号码</label>
                <div class="layui-input-inline from-inline-4">
                    <input type="text" name="row[mobile]" value="{$row['mobile']}" lay-reqText="请输入手机号码" placeholder="{:lang('pleaseEnter')}手机号码" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">{:lang('submit')}</button>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="common/foot"/}
<script>
    layui.config({
        base: '__STATIC__/layuiadmin/mods/',
        version: '1.0'
    });
    layui.use(['form','layarea','upload'], function(){
        var form = layui.form,$= layui.jquery;
        $("#uploadImg").on('click',function(){
            layer.open({
                title:'上传二维码',
                type:2,
                maxmin: true,
                area:['80%','500px'],
                content:'{:createUrl("attachment/index")}?type=0&name=qrcode&prename=Image',
            });
        });
        var sub_type='{$row["sub_type"]}';
        if(sub_type=='0'){
            $('#sub_domain').show();
            $('#one_domain').hide();
        }else{
            $('#sub_domain').hide();
            $('#one_domain').show();
        }
        //监听选择
        form.on('radio(sub_type)', function(data){
            if(data.value=='0'){
                $('#sub_domain').show();
                $('#one_domain').hide();
            }else{
                $('#sub_domain').hide();
                $('#one_domain').show();
            }
        });
        form.on('submit(submit)', function (data) {
            loading =layer.load(1, {shade: [0.1,'#fff']});
            $.post("", data.field, function (res) {
                layer.close(loading);
                if (res.status===200){
                    layer.msg('更新成功',{time: 1000, icon: 1},function(){
                        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                        parent.layer.close(index);//再执行关闭
                    });
                } else {
                    layer.msg(res.msg, {time: 1000, icon: 2});
                }
            });
        })
    });
</script>
