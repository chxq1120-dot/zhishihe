{include file="common/head"/}
<link rel="stylesheet" href="__STATIC__/admin/custom/element/index.css">
<link rel="stylesheet" href="__STATIC__/admin/custom/css/index.css?v=1.0.6">
<link rel="stylesheet" href="__STATIC__/admin/fonts/icon/iconfont.css">
<link rel="stylesheet" href="__STATIC__/layuiadmin/layui/css/layui.css">
<script src="__STATIC__/admin/custom/js/vue.min.js"></script>
<script src="__STATIC__/admin/custom/js/sortable.min.js"></script>
<script src="__STATIC__/admin/custom/js/vuedraggable.min.js"></script>
<script src="__STATIC__/admin/custom/element/index.js"></script>
<script src="__STATIC__/layuiadmin/layui/layui.js"></script>
<script>
    //默认底部导航组
    var tarbar_path = '{:request()->domain()}__STATIC__/common/images/tabbar/';
    var linkType = {$link_type|raw};//跳转类型
    var pageCode = "{$page_code}";//页面编码
    var pageConfig = {$page_config|raw};//页面默认数据
    var catList = {$sortList|raw};//资源分类数据 
    catList.forEach(item => { item.group = item.childlist.slice(0,2); });
    var topSortList = {$topSortList|raw};//一级资源分类
    var articleSortList = {$articleSortList|raw};//文章分类数据
    var YLink = {$linkList|raw};//友情链接
    var manage_Image = "{:createUrl('Ueditor/index')}";
    var upload_Image = "{:createUrl('UpFiles/upload')}";
    var upload_manage ="{:createUrl('UpFiles/index')}";
    var default_banner = "__STATIC__/admin/custom/images/empty-banner.png";
    var default_search = "__STATIC__/admin/images/banner.jpg";
    var default_logo = "__STATIC__/admin/custom/images/logo.png";
    var default_img = "__STATIC__/admin/custom/images/empty.png";
    var saveUrl = "{:createUrl('saveTheme')}";
    var api_ResourceList = "{:createUrl('widget/getResourceList')}";//资源列表
    var api_ResourceSort = "{:createUrl('widget/getResourceSort')}";//资源分类
    var api_getArticle = "{:createUrl('widget/getArticle')}";//文章分类
    var api_getPages = "{:createUrl('widget/getPages')}";//页面路径
    var api_getArticleSort = "{:createUrl('widget/getArticleSort')}";//文章分类
    var api_tagNotice = "{:createUrl('widget/tagNotice')}";//公告
    var api_tagSpread = "{:createUrl('widget/tagSpread')}";//资源
    var api_tagSorts = "{:createUrl('widget/tagSorts')}";//分类
    var imgWindowArr = [
        "__STATIC__/admin/custom/images/image-one-column.png",
        "__STATIC__/admin/custom/images/image-three-column.png",
        "__STATIC__/admin/custom/images/image-four-column.png",
        "__STATIC__/admin/custom/images/image-one-left.png"
    ]
</script>
<div id="app" style="padding:6px;background-color:#f2f2f2;">
    <home></home>
    <textarea id="edit_cover" style="display: none;"></textarea>
</div>
<template id="home">
    <div class="itxst">
        <div class="left">
            <div class="components-wrap">
                <div class="components-title">
                    <div class="top">组件库</div>
                </div>
                <div class="components-list">
                    <div class="component-item">
                        <div class="component-item-title">工具组件</div>
                        <draggable element="ul" :list="utilsComponents"
                            :options="{group: { name: 'widget', pull: 'clone', put: false },sort: false,ghostClass: 'ghost',animation: 150}">

                            <li class="component-item-li" v-for="(item, index) in utilsComponents" :key="index"
                                @click="selectWidget(item.type, $event)">
                                <p>
                                    <i class="icon" :class="item.icon"></i>
                                </p>
                                <p class="text">{{ item.name }}</p>
                            </li>

                        </draggable>
                        <div class="component-item-title">媒体组件</div>
                        <draggable element="ul" :list="mediaComponents"
                            :options="{group: { name: 'widget', pull: 'clone', put: false },sort: false,ghostClass: 'ghost',animation: 150}">
                            <li class="component-item-li" v-for="(item, index) in mediaComponents" :key="index"
                                @click="selectWidget(item.type, $event)">
                                <p>
                                    <i class="icon" :class="item.icon"></i>
                                </p>
                                <p class="text">{{ item.name }}</p>
                            </li>

                        </draggable>
                        <div class="component-item-title">资源组件</div>
                        <draggable element="ul" :list="storeComponents"
                            :options="{group: { name: 'widget', pull: 'clone', put: false },sort: false,ghostClass: 'ghost',animation: 150}">

                            <li class="component-item-li" v-for="(item, index) in storeComponents" :key="index"
                                @click="selectWidget(item.type, $event)">
                                <p>
                                    <i class="icon" :class="item.icon"></i>
                                </p>
                                <p class="text">{{ item.name }}</p>
                            </li>
                        </draggable>
                    </div>
                </div>
               
            </div>
        </div>
        <div class="center_bottom">
            <div class="savePageBtn">
                <p>设计完成后点击"保存页面"，在前端页面点击刷新 " <i class="layui-icon layui-icon-refresh-3"></i> " 即可看到效果。</p>
                <button class="layui-btn layui-btn-normal layui-btn-sm" @click="savePage">保存页面</button>
            </div>
            <div class="center">
            <Layout ref="layout"></Layout></div>
        </div>

        <div class="right">
            <layout-config ref="layout-config"></layout-config>
        </div>
    </div>
</template>
<!-- 栅格 -->
<template id="Grid">
    <draggable class="dragArea list-group"  :list="GridData" group="widget" @add="handleWidgetAdd"
        @remove="handleDragRemove">
        <transition-group name="fade" tag="div" class="form-widget-list">
            <div v-for="(item, index) in GridData" :key="index">
                <div class="layoutMain" :key="item.key" @click="handleSelectWidget(index, $event)">
                    <!--常见问题  -->
                    <div v-if="item.type === 'problem'" class="drags lay-item problem">
                        <div class="title">{{item.value.title || '常见问题'}}</div>
                        <draggable class="question">
                            <transition-group class="faq">
                                <div v-for="(help, index) in (item.value.List && item.value.List.length >0 ? item.value.List : item.value.list)" :key="index" v-if="help.title "
                                    class="faqList" style="width: 200px;">
                                    <li>
                                        <p>{{help.title}}</p>
                                    </li>
                                </div>
                            </transition-group>
                        </draggable>
                    </div>
                    <!--友情链接  -->
                    <div v-if="item.type === 'Link'" class="drags lay-link"
                        :style="{background:`linear-gradient(to ${item.value.gradientDirection}, ${item.value.startColor}, ${item.value.endColor})`}">
                        <div class="title">{{item.value.title || '友情链接'}} :</div>
                        <draggable class="link">
                            <div v-for="(link, index) in item.value.list.slice(0,item.value.limit)" :key="index"
                                :style="{'line-height':item.lineHight+'px'}">
                              <a href="link.url">{{link.name}}</a>  
                            </div>
                        </draggable>
                    </div>
                    <!--栅格  -->
                    <div v-if="item.type === 'grid'" class="drags lay-item grid">
                        <el-row :gutter="item.value.gutter">
                            <div v-for=" (row,index) in item.value.rows" :key="index">
                                <el-col :span="row.col"
                                    :style="{ 'min-height': row.height + 'px',background:`linear-gradient(to ${row.gradientDirection},${row.startColor},${row.endColor})` }">
                                    <div class="grid-content bg-purple">
                                        <Grid ref="Grid" :list="row.list"></Grid>
                                    </div>
                                </el-col>
                            </div>
                        </el-row>
                    </div>
                    <!-- 图片 -->
                    <div v-if="item.type==='imgSingle'" class="drags lay-imgSingle">
                        <div class="img-sole" :style="{width:'100%',height:item.value.height+'px'}">
                            <div v-for="(img,index) in item.value.list" :key="index" :style="{width:'100%',height:item.value.height+'px'}">
                            <img :src="img.image" alt="" style="width: 100%;height: 100%;">
                        </div>
                            <div class="img-btn"
                                :style="{background: `linear-gradient(to ${item.value.color.gradientDirection}, ${item.value.color.startColor}, ${item.value.color.endColor})`,color:item.value.textColor,width:item.value.color.width+'px',height:item.value.color.height+'px',lineHeight:item.value.color.height+'px'}"
                                v-show="item.value.buttonShow">{{item.value.buttonText}}
                            </div>
                        </div>
                    </div>
                    <!-- 导航栏 -->
                    <div v-if="item.type === 'nav'" class="drags lay-item drag-img">
                        <draggable
                            :style="{  'background': `linear-gradient(to ${item.value.gradientDirection}, ${item.value.startColor}, ${item.value.endColor})`, color: item.value.color}">
                            <transition-group class="grid_nav" :style="{ height: item.value.height + 'px' }">
                                <div v-for="(nav, index) in item.value.list" :key="index">
                                    <!-- Logo -->
                                    <img v-if="nav.image" :src="nav.image" alt="logo">
                                    <!-- 导航项 -->
                                    <div v-if="nav.hobbies" class="hobbies">
                                        <el-menu  mode="horizontal" class="el-menu" :active-text-color="item.value.color" :default-active="1" :text-color="item.value.color" @select="handleSelect">
                                            <template v-for="list in nav.hobbies" :key="list.id">
                                                <menu-item :item="list" :index="list.url"></menu-item>
                                            </template>
                                        </el-menu>
                                    </div>
                                    <!-- search -->
                                    <el-input v-if="nav.input" :placeholder="nav.input.value"
                                        v-show="nav.input.radio =='1' ">
                                        <el-button slot="append" icon="el-icon-search"></el-button>
                                    </el-input><!-- 登录/注册 -->
                                    <div v-if="nav.login && nav.login.text" class="btn" v-show="nav.login.radio == '1' "
                                        :style="{ color: nav.login.color1, background: `linear-gradient(to ${nav.login.gradientDirection}, ${nav.login.startColor}, ${nav.login.endColor})`, fontSize: nav.login.size + 'px'}">
                                        {{ nav.login.text }}
                                    </div>
                                </div>
                            </transition-group>
                        </draggable>
                    </div>

                    <!-- 搜索框 -->
                    <div v-if="item.type === 'search'" class="drags lay-item lay-search">
                        <div class="Search_input">
                            <el-input :placeholder="item.value.keywords"  :class="item.value.style">
                                <el-button slot="append" icon="el-icon-search"></el-button>
                            </el-input>
                        </div>
                    </div>
                    <!-- 资源组 -->
                    <div v-if="item.type === 'resource'" class="drags clearfix lay-goods" >
                        <div class="goods-head" v-if="item.value.show =='1' ">
                            <div class="name">
                                <p>{{item.value.title}}</p>
                                <div class="twolist-hidden">
                                    <div v-for="option in item.value.radios" v-if="option.label " :key="option.label">
                                        <span>{{ option.label }}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="more" v-if="item.value.lookMore=='1'">更多></div>
                        </div>
                        <li class="goods_item">
                            <div
                                v-for="(spreads,key) in  (item.value.from === '2' ? item.value.List : item.value.list.slice(0,item.value.limit))" :key="key"
                                class="list">
                                <img :src="spreads.thumb ||  default_banner " alt="" >
                                <div class="goods-detail">
                                    <p class="goods-name ">
                                        {{spreads.title||'此处显示资源名称'}}
                                    </p>
                                    <div class="collect">
                                        <div class="btn">
                                            <p class="text">{{spreads.level_name}}</p>
                                              <div  v-for="(Sort,index) in spreads.sort_list" :key="index"> 
                                                <p v-if="spreads.sort_list.length >0"> {{Sort.name}}</p>
                                            </div>
                                        </div>
                                    <div class="goods-info">
                                        <div class="price">
                                            <p class="goods-price">￥{{spreads.price||'99.00'}}</p>
                                            <p class="goods-dprice">￥{{spreads.dis_price||'99.00'}}</p>
                                        </div>
                                        <span>{{spreads.sales}}人学习</span>
                                    </div>
                                </div>

                            </div>
                        </li>
                    </div>
                    <!-- 图片轮播 -->
                    <div v-if="item.type === 'imgSlide'" class="drags lay-item lay-imgSlide drag-img"
                        :style="{overflow:'hidden' }">
                        <el-carousel :interval="item.value.duration" autoplay="false" arrow="nerver"
                            :style="{ width: '100%', height: item.value.height + 'px' }">
                            <el-carousel-item v-for="(list, key) in item.value.list" :key="key"
                                :style="{ height: item.value.height + 'px' }">
                                <img :src="list.image" alt="banner">
                            </el-carousel-item>
                        </el-carousel>
                    </div>

                    <!-- 图片分组 -->
                    <div v-if="item.type==='imgWindow'" class="drags lay-imgWindow clearfix">
                        <div class="goods-head" v-if="item.value.radio === '1'">
                            <p>{{item.value.title || '精选图片'}}</p>
                            <div class="more" v-if="item.value.lookMore === '1'">更多></div>
                        </div>
                        <div class="img">
                            <div class="image"
                                :style="{ width: 'calc(100% / ' + item.value.style + ')',padding:item.value.margin+'px' }"
                                v-for="(i,index) in item.value.list" ::key="index">
                                <img :src="i.image" alt="">
                            </div>
                        </div>
                    </div>
                    <!-- 视频组 -->
                    <div v-if="item.type==='video'" class="drags lay-item lay-video"
                        style="width: 100%;overflow: hidden;">
                        <div class="video-wrap" v-for="(video,key) in item.value.list" :key="key" style="width: 100%;">
                            <video :src="video.url" :poster="video.image" controls="controls"
                                :style="{width: '100%',height:item.value.height+'px'}"></video>
                        </div>
                    </div>
                    <!-- 文章组 -->

                    <div v-if="item.type==='article'" class="drags lay-article">
                        <div class="goods-head" v-if="item.value.radio === '1'">
                            <p>{{item.value.title || '精选文章'}}</p>
                            <div class="more" v-if="item.value.lookMore === '1'">更多></div>
                        </div>
                        <div class="Wrap">
                            <div class="ArticleWrap clearfix" style="width: 360px;"
                                v-for="(article,key) in (item.value.choose === '2' ? item.value.List : item.value.list)" :key="key">
                                <img :src="article.thumb|| default_banner" alt="">
                                <div class="article-right">
                                    <div class="article-title">
                                        {{article.title||'此处显示文章标题'}}
                                    </div>
                                    <p>
                                        {{article.discrible||'此处显示文章描述'}}
                                    </p>
                                    <div class="flex">
                                        <div>
                                            <span><i class="icon icon-time"></i> {{ article.ctime ? article.ctime.split(" ")[0] : '2023-11-09' }}</span>
                                            <span><i class="icon icon-edit"></i>
                                                {{article.writer || ''}}</span>
                                        </div>
                                        <i>{{article.reader || ''}}人已阅读 </i>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                    <!-- 公告组 -->
                    <div v-if="item.type==='notice'" class="drags lay-item lay-notice"
                    :style="{ 'line-height': item.value.lineHeight + 'px',fontSize:item.value.FontSize+'px',background: `linear-gradient(to ${item.value.gradientDirection}, ${item.value.startColor}, ${item.value.endColor})`,color:item.value.color2}">
                    <i class="icon icon-gonggao" :style="{ fontSize:item.value.FontSize+'px'}"></i>
                    <el-carousel height="100%" :interval="4000" arrow="never" loop indicator-position="none"
                        style="width: 100%;" :autoplay="true">
                        <el-carousel-item v-for="(notice,key) in (item.value.type === 'choose' ? item.value.List :item.value.list)" class="notice-text" :key="key">
                            <h3 class="medium">{{ notice.title }}</h3>
                        </el-carousel-item>
                    </el-carousel>
                </div>
                    <!-- 辅助空白 -->
                    <div v-if="item.type==='blank'" class="drags lay-item lay-blank"
                        :style="{height:item.value.height+'px', background: `linear-gradient(to ${item.value.gradientDirection}, ${item.value.startColor}, ${item.value.endColor})`}">
                    </div>
                    <!-- 文本域 -->
                    <div v-if="item.type==='textarea'" class="drags lay-item lay-textarea">
                        <div class="editor-container" v-html="item.value">
                        </div>
                    </div>
                    <!--资源分类-->
                    <div v-if="item.type==='resourceSort'" class="drags lay-navBar  clearfix"
                        style="overflow: visible;">
                        <div class="lay-group"
                            :style="{ minHeight: item.value.L_height + 'px',backgroundColor:item.value.L_Bk_color,color:item.value.L_Txt_color,fontSize:item.value.Size + 'px'}">
                            <draggable>
                                <li v-for="(name,index) in item.value.catList.slice(0, item.value.limit)" :key="index">
                                  <!-- 一级菜单 -->
                                    <div class="one" @mouseenter="handleMouseEnter" @mouseleave="handleMouseLeave"
                                        :style="{backgroundColor:item.value.L_Bk_color}">
                                        <div class="name">{{name.name}}</div>
                                        <div class="Tname">
                                            <p v-if="name.group.length === 0">请选择</p>
                                            <p v-for="(Tname, index) in name.group" :key="index">{{ Tname.name }}</p>
                                        </div>
                                    </div>
                                    <!-- 二级菜单  -->
                                    <div class="child" @mouseenter="handleChildMouseEnter"
                                        @mouseleave="handleChildMouseLeave"
                                        :style="{ minHeight: item.value.R_height + 'px',display: 'none',backgroundColor:item.value.R_Bk_color,color:item.value.R_Txt_color}">
                                        <draggable group="menu">
                                            <transition-group>
                                                <div v-for="(child,i) in name.childlist" :key="i" class="childs">
                                                    <div class="two"> {{child.name}}</div>
                                                    <draggable class="three">
                                                        <div v-for="(children,index) in child.childlist" :key="index">
                                                            {{children.name}}
                                                        </div>
                                                    </draggable>
                                                </div>
                                            </transition-group>
                                        </draggable>
                                    </div>
                                </li>
                            </draggable>
                        </div>
                    </div>
                    <!--底部tabbar--->
                    <div v-if="item.type === 'tabbar'" class="drags tabbar clearfix"  :style="{background:`linear-gradient(to ${item.value.color.gradientDirection}, ${item.value.color.startColor}, ${item.value.color.endColor})`}">
                        <div  class="tabbar_list">
                        <draggable class="way">
                                <!-- 简介 -->
                                <div v-if="item.value.intro && item.value.intro.radio === '1' "  class="list">
                                    <div class="bold"> {{item.value.intro.name || '关于'}}</div>
                                    <div v-for="(list,index) in item.value.intro.list">
                                        <p class="flex">{{list.value}}</p>
                                    </div>
                                </div>
                                <!-- 合作 -->
                                <div v-if="item.value.partner && item.value.partner.radio === '1' " class="list">
                                    <div class="bold">{{item.value.partner.name || '合作'}}</div>
                                    <div v-for="(list,index) in item.value.partner.list">
                                        <p class="flex">{{list.value}}</p> 
                                    </div>
                                </div>
                                <!-- 帮助 -->
                                <div v-if="item.value.help && item.value.help.radio === '1' " class="list">
                                    <div class="bold">{{item.value.help.name || '帮助'}}</div> 
                                    <div v-for="(list,index) in item.value.help.list">
                                        <p class="flex">{{list.value}}</p>
                                    </div>
                                </div>
                                <!-- 联系方式 -->
                                <div v-if="item.value.contact && item.value.contact.radio === '1' " class="list">
                                    <div class="bold">{{item.value.contact.name || '联系方式'}}</div>
                                    <div v-for="(list,index) in item.value.contact.list">
                                        <div class="flex">
                                            <div class="phone">
                                                <h4> {{list.name}}</h4>
                                                <p>{{list.value}}</p>
                                        </div>
                                        </div>
                                    </div>
                                </div>
                        </draggable>
                          <!--联系客服  微信公众号-->
                        <draggable class="connection">
                            <div v-for="(List,index) in item.value.list">
                            <div v-if="List.show === '1' "  class="list">
                                <img :src="List.image" alt="" >
                                <div class="bold">{{List.name}}</div>
                            </div>
                             </div>
                        </draggable>
                    </div>
                        <!-- 版权 -->
                        <div class="copy"  v-if="item.value.copy">{{item.value.copy.CopyRight}}</div>
                    </div>
                    <div @click.stop="handleWidgetDelete(index)" class="btn-delete" v-if="selectWg.key === item.key">
                        删除
                    </div>
                    <div @click.stop="handleWidgetClone(index)" class="btn-clone" v-if="selectWg.key === item.key">
                        复制
                    </div>
                </div>
            </div>
        </transition-group>
    </draggable>
</template>
<!-- 中间 -->
<template id="layout">
    <draggable v-model="pageData" @add="handleWidgetAdd" class="layout-list" group="widget"
        style="width:100%;height: 100%;" @remove="handleDragRemove">
        <div v-for="(item, index) in pageData" :key="index">
            <div class="layout-main" :key="item.key"
                :class="{ active: selectWg.key === item.key,npr:item.type=='record'}"
                @click="handleSelectWidget(index,$event)">
                <!--常见问题  -->
                <div v-if="item.type === 'problem'" class="drag lay-item problem">
                    <div class="title">{{item.value.title || '常见问题'}}</div>
                    <draggable class="question">
                        <transition-group class="faq">
                            <div v-for="(help, index) in (item.value.List && item.value.List.length >0 ? item.value.List : item.value.list)" :key="index"
                                :style="{ width: 'calc((100% - 40px) / ' + item.value.limit + ')' }" class="faqList">
                    <li>
                        <p>{{ help.title }}</p>
                    </li>
                </div>
                        </transition-group>
                    </draggable>
                </div>
                <!--友情链接  -->
                <div v-if="item.type === 'Link'" class="drag lay-link"
                    :style="{background:`linear-gradient(to ${item.value.gradientDirection}, ${item.value.startColor}, ${item.value.endColor})`}">
                    <div class="title">{{item.value.title || '友情链接'}} :</div>
                    <draggable class="link">
                        <div v-for="(link, index) in item.value.list.slice(0,item.value.limit)" :key="index"
                        :style="{'line-height':item.lineHight+'px'}">
                      <a href="link.url">{{link.name}}</a>  
                    </div>
                    </draggable>
                </div>
                <!--栅格  -->
                <div v-if="item.type === 'grid'" class="drag lay-item grid">
                    <el-row :gutter="item.value.gutter">
                        <div v-for=" (row,index) in item.value.rows" :key="index">
                            <el-col :span="row.col"

<!-- 导航项 -->
<template id="menu-item">
    <!-- 有tasks时进入子级 -->
    <el-submenu :index="item.url" v-if="item.tasks && item.tasks.length > 0">
        <!-- slot -->
        <template slot="title">{{ item.name }}</template>
        <!-- 循环子级 -->
        <template v-for="subItem in item.tasks">
            <template v-if="subItem.tasks && subItem.tasks.length > 0">
                <menu-item :item="subItem"></menu-item>
            </template>
            <el-menu-item v-else :index="subItem.url" :key="subItem.name">{{ subItem.name }}</el-menu-item>
        </template>
    </el-submenu>
    <!-- 否则直接显示name -->
    <el-menu-item v-else :index="item.url" :key="item.url">
        {{ item.name }}
    </el-menu-item>
</template>
<!-- 拖拽嵌套 -->
<template id="nested-draggable-template">
    <draggable class="dragArea" tag="ul" :list="tasks" :group="{ name: 'g1' }" item-key="name">
        <li v-for="(element, index) in tasks" :key="element.id">
            <div class="tasks">
                <div class="name">
                    <div class="icon_plus" @click="AddName(index)"> <i class="el-icon-plus"></i>{{ element.name }}
                    </div>
                    <!-- 添加同级 -->
                    <el-dialog title="添加同级" :visible.sync="dialogVisible" width="50%" :before-close="canceled">
                        <el-form :model="form" ref="form" label-width="80px" :inline="false" size="normal"
                            class="AddName">
                            <el-form-item label="导航标签">
                                <el-input v-model="form.name" value="form.name" placeholder="请输入标签名"></el-input>
                            </el-form-item>
                            <el-form-item label="链接类型:" size="normal">
                                <el-select v-model="form.value" disabled  placeholder="请选择">
                                    <el-option v-for="(option,index) in linkType" :key="index" :label="option"
                                    :value="index">
                                </el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item label="链接指向:" size="normal" v-if="form.value==='1'">
                                <el-input v-model="form.url" placeholder="请输入url地址" size="normal" clearable></el-input>
                            </el-form-item>
                            <el-form-item label="链接指向:" size="normal" v-if="form.value==='2'">
                                    <el-select v-model="form.cat" placeholder="请选择分类">
                                        <el-option :value="0" label="不限分类"></el-option>
                                        <template v-for="item in catList">
                                            <el-option :value="item.id" :label="item.name"></el-option>
                                            <template v-if="item.childlist">
                                                <el-option v-for="second in item.childlist" :key="second.id"
                                                           :label="second.name" :value="second.id" class="second">
                                                </el-option>
                                            </template>
                                        </template>
                                    </el-select>
                            </el-form-item>
                            <el-form-item label="链接指向:" size="normal" v-if="form.value==='3'">
                                <el-select v-model="form.art" placeholder="请选择">
                                    <el-option v-for="art in articleSortList" :key="art.id" :label="art.name"
                                            :value="art.id">
                                        </el-option>
                                </el-select>
                            </el-form-item>
                            <el-form-item>
                                <el-button type="primary" @click="onSubmit(index)">立即添加</el-button>
                                <el-button @click="canceled()">取消</el-button>
                            </el-form-item>
                        </el-form>
                    </el-dialog>
                    <div class="edit">
                        <i :class="activeIndex === index ? 'el-icon-caret-top' : 'el-icon-caret-bottom'"
                            @click="toggleInput(index)"></i>
                        <i class="el-icon-delete" @click="removeName(index)"></i>
                    </div>
                </div>
                <el-form class="Input" v-if="activeIndex === index" ref="formData" :model="formData">
                    <el-form-item label="导航标签:" size="normal">
                        <el-input v-model="formData.name" value="formData.name" placeholder="请输入导航项" size="normal"
                            clearable></el-input>
                    </el-form-item>
                    <el-form-item label="链接类型:" size="normal">
                        <el-select v-model="formData.value" disabled placeholder="请选择">
                            <el-option v-for="(option,index) in linkType" :key="index" :label="option"
                                            :value="index">
                                        </el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="链接指向:" size="normal" v-if="formData.value==='1'">
                        <el-input v-model="formData.url" placeholder="请输入url地址" size="normal" clearable></el-input>
                    </el-form-item>
                    <el-form-item label="链接指向:" size="normal" v-if="formData.value==='2'">
                        <el-select v-model="formData.cat" placeholder="请选择分类">
                            <el-option :value="0" label="不限分类"></el-option>
                            <template v-for="item in catList">
                                <el-option :value="item.id" :label="item.name"></el-option>
                                <template v-if="item.childlist">
                                    <el-option v-for="second in item.childlist" :key="second.id"
                                               :label="second.name" :value="second.id" class="second">
                                    </el-option>
                                </template>
                            </template>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="链接指向:" size="normal" v-if="formData.value==='3'">
                        <el-select v-model="formData.art" placeholder="请选择">
                            <el-option v-for="art in articleSortList" :key="art.id" :label="art.name"
                                            :value="art.id">
                                        </el-option>
                            </el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item size="normal">
                        <div>
                            <el-button type="primary" size="mini" @click="cancel(index)">取消</el-button>
                            <el-button type="primary" size="mini" @click="save(index)">保存</el-button>

                        </div>
                    </el-form-item>

                </el-form>
            </div>
            <nested-draggable :tasks="element.tasks"></nested-draggable>
        </li>
    </draggable>

</template>
<!-- 上传图片 -->
<template id="upload-img">
    <div class="UploadImage">
        <button type="button" class="layui-btn layui-btn-sm" @click="uploadImg">上传图片</button>
        <div class="layui-upload-list" v-if="tags">
            <img class="layui-upload-img" :src="[tags=='image'?item.image:item.image_on]"
