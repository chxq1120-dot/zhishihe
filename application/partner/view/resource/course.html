{include file="common/head"/}
<style>
    .layui-table-cell{height: inherit;}
</style>
<div class="layui-fluid">
    <div class="table-body">
        <div class="layui-header" style="height:35px;">
            <div class="func-btn" id="func-btn">
                {if ($res.admin_id==$partner.id)}
                    <a href="javascript:;" class="add layui-btn layui-bg-blue layui-btn-small">
                        <i class="layui-icon layui-icon-addition"></i>
                        {:lang('add')}课程章节
                    </a>
                {/if}
            </div>
        </div>
        <table id="list" lay-filter="list"></table>
    </div>
</div>
{include file="common/foot"/}
<script type="text/html" id="action">
{if ($res.admin_id==$partner.id)}
    <a class="layui-btn layui-btn-sm" lay-event="edit">{:lang('edit')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del">{:lang('del')}</a>
{/if}    
</script>
<script>
    layui.use(['table','element'],function(){
        var table = layui.table, $ = layui.jquery,element = layui.element;
        var tableIn = table.render({
            id: 'list',
            elem: '#list',
            url: '{:createUrl("course",["ids"=>input("get.ids")])}',
            toolbar:'#table-toolbar',
            method:'get',
            page:true,
            cols: [[
                {field: 'title',title: '章节名称',align:'center'},
                {title: '是否试看',align:'center',templet:function(d){
                        if(d.is_try==0){
                            return '<span class="blue_block">否</span>';
                        }else if(d.is_try==1){
                            return '<span class="green_block">是</span>';
                        }
                    }},
                {field: 'times',title: '时长',align:'center'},
                {field: 'indexid',title: '分类排序',align:'center'},
                {field: 'ctime', align: 'center',title: '添加时间'},
                {align: 'center',toolbar:'#action'}
            ]]
        });
        //监听添加
        $('#func-btn .add').on('click',function () {
            layer.open({
                title:'添加课程章节',
                type:2,
                maxmin: true,
                content:'{:createUrl("savecourse",["rid"=>input("get.ids")])}',
                area:['80%','500px'],
                end:function(){
                    tableIn.reload();
                }
            });
        });
        //行列表操作项事件
        table.on('tool(list)', function(obj) {
            var data = obj.data;
            if(obj.event === 'del'){
                layer.confirm('你确定要删除吗？', {icon: 3}, function (index) {
                    $.post("{:createUrl('delcourse')}",{ids:data.id,rid:data.rid},function(res){
                        if(res.status===200){
                            layer.msg('删除成功',{time:1000,icon:1});
                            tableIn.reload();
                        }else{
                            layer.msg(res.msg,{time:1000,icon:2});
                        }
                    });
                    layer.close(index);
                });
            }else if(obj.event === 'edit'){
                layer.open({
                    title:'编辑章节',
                    type:2,
                    maxmin: true,
                    content:'{:createUrl("savecourse")}?id='+data.id+'&rid='+data.rid,
                    area:['80%','500px'],
                    end:function(){
                        tableIn.reload();
                    }
                });
            }
        });
    })
</script>
