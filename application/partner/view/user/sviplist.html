{include file="common/head"/}
<style>
.layui-table-cell{height: inherit;}
</style>
<div class="layui-fluid">
    <div class="admin-head">
        <ul>
            <li class="on">SVIP设置</li>
        </ul>
    </div>
    <div class="table-body">
        <div class="search-tool">
            <form class="layui-form">
                <div class="layui-inline">
                    <input type="text" class="layui-input" placeholder="检索日期" id="ondate" style="width:200px;">
                    <span class="item-icon"><i class="layui-icon layui-icon-date"></i></span>
                </div>
                <div class="layui-inline">
                    <select id="online" lay-filter="onstatus">
                        <option value="">状态</option>
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" class="layui-input" placeholder="搜索内容" id="search" style="width:200px;" />
                    <span class="item-icon" id="onsearch"><i class="icon icon-search"></i></span>
                </div>
            </form>
            <div class="func-btn" id="func-btn">
                <a href="javascript:;" class="layui-btn layui-bg-blue layui-btn-small add">
                    添加SVIP套餐
                </a>
            </div>
        </div>
        <table id="list" lay-filter="list"></table>
    </div>
</div>
{include file="common/foot"/}
<script type="text/html" id="action">
    <a class="layui-btn layui-btn-sm" lay-event="edit"><i class="layui-icon layui-icon-edit"></i> {:lang('edit')}</a>
    <a class="layui-btn layui-btn-danger layui-btn-sm" lay-event="del" title="{:lang('del')}">
        <i class="layui-icon layui-icon-delete"></i>
        {:lang('del')}
    </a>
</script>
<script type="text/html" id="table-toolbar">
    <div class="layui-btn-container">
        <button class="layui-btn" lay-event="openAll"><i class="icon icon-qiyong"></i> 批量启用</button>
        <button class="layui-btn" lay-event="closeAll"><i class="icon icon-jinyong"></i> 批量禁用</button>
        <button class="layui-btn layui-btn-danger" lay-event="delAll"><i class="layui-icon layui-icon-delete"></i>批量删除</button>
    </div>
</script>
<script>
    var dateVal='',statusVal='',searchVal='',onlineVal='';
    layui.use(['table','element','form','laydate'],function(){
        var table = layui.table, $ = layui.jquery,laydate = layui.laydate,form=layui.form,element = layui.element;
        var tableIn = table.render({
            id: 'list',
            elem: '#list',
            url: '{:createUrl("sviplist")}',
            toolbar:'#table-toolbar',
            method:'get',
            page:true,
            response:{
                statusName:'status',
                statusCode:200,
                msgName:'msg',
                countName:'total',
                dataName:'data',
            },
            cols: [[
                {type: 'checkbox',title:'ID',align:'center',width:50},
                {field: 'id',title: 'ID',align:'center',width:50},
                {field: 'name',title: '名称',align:'center',width:140},
                {field: 'days',title:'天数',align:'center',width:80},
                {field: 'price', align: 'center',title: '价格',width:70},
                {field: 'invite_num', align: 'center',title: '升级人数',width:80},
                {field: 'discount', align: 'center',title: '折扣',width:60},
                {field:'level',width:80,title: '级别',align:'center'},
                {field:'type',width:100,title: '代理套餐',align:'center',templet:function(d){
                    if(d.type==1){
                        var checked='checked';
                    }else{
                        var checked='';
                    }
                    return '<input type="checkbox" '+checked+' lay-skin="switch" lay-filter="isAgent" lay-text="是|否" value="'+d.type+'" id="'+d.id+'">';
                }},
                {field:'status',width:100,title: '状态',align:'center',templet:function(d){
                    if(d.status==1){
                        var checked='checked';
                    }else{
                        var checked='';
                    }
                    return '<input type="checkbox" '+checked+' lay-skin="switch" lay-filter="status" lay-text="正常|禁用" value="'+d.status+'" id="'+d.id+'">';
                }},
                {field: '', align: 'center',title: '特权',width:380,templet:function(d){
                    var str='';
                    for(let i in d.privilege){
                        str+='<a class="layui-btn layui-btn-xs">'+d.privilege[i].name+'</a>';
                    }
                    return str;
                }},
                {field:'ctime',width:150,title: '添加时间',align:'center'},
                {align: 'center',toolbar:'#action',title: '操作',width:180}
            ]]
        });
        //选择日期
        laydate.render({
            elem: '#ondate',
            range: '-',
            done:function(value, date, endDate){
                dateVal=value, statusVal=$('#onstatus').val(),searchVal=$('#search').val();
                var params={};
                if(statusVal){
                    params['status']=statusVal
                }
                table.reload('list',{
                    where:{
                        date:dateVal,
                        search:searchVal,
                        filter:JSON.stringify(params)
                    }
                });
            }
        });
        //下拉选项
        form.on('select(onstatus)', function(data){
            dateVal=$('#ondate').val(),statusVal=data.value,searchVal=$('#search').val();
            var params={};
            if(statusVal){
                params['status']=statusVal
            }
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:JSON.stringify(params)
                }
            });
        });
        //搜索关键字
        $('#onsearch').on('click',function(e){
            dateVal=$('#ondate').val(),statusVal=$('#onstatus').val(),searchVal=$('#search').val();
            var params={};
            if(statusVal){
                params['status']=statusVal
            }
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:JSON.stringify(params)
                }
            });
        });
        $("#func-btn .add").on('click',function (){
            layer.open({
                title:'添加SVIP套餐',
                type:2,
                maxmin: true,
                content:'{:createUrl("addsvip")}',
                area:['80%','550px'],
                end:function(){
                    tableIn.reload();
                }
            });
        });
        form.on('switch(isAgent)',function(data){
            var loading = layer.load(1, {shade: [0.1, '#fff']});
            var types=parseInt(data.elem.value)==1 ? 0 : 1;
            $.post('{:createUrl("setVipUp")}',{'ids':data.elem.id,'params':'{"type":"'+types+'"}'},function(res){
                layer.close(loading);
                if(res.status ===200){
                    data.elem['value']=types;
                    return false;
                }else{
                    layer.msg('操作失败！', {time: 1000, icon: 2});
                    return false;
                }
            });
        });
        form.on('switch(status)',function(data){
            var loading = layer.load(1, {shade: [0.1, '#fff']});
            var status=parseInt(data.elem.value)==1 ? 0 : 1;
            $.post('{:createUrl("setVipUp")}',{'ids':data.elem.id,'params':'{"status":"'+status+'"}'},function(res){
                layer.close(loading);
                if(res.status ===200){
                    data.elem['value']=status;
                    return false;
                }else{
                    layer.msg('操作失败！', {time: 1000, icon: 2});
                    return false;
                }
            });
        });
        //行列表操作项事件
        table.on('tool(list)', function(obj) {
            var data = obj.data;
            if(obj.event === 'edit'){
                layer.open({
                    title:'编辑SVIP',
                    type:2,
                    maxmin: true,
                    content:'{:createUrl("editsvip")}?ids='+data.id,
                    area:['80%','550px'],
                    end:function(){
                        tableIn.reload();
                    }
                });
            }else if(obj.event === 'del'){
                layer.confirm('确定删除吗',{icon: 3},function(index){
                    $.post("{:createUrl('delsvip')}?ids="+data.id,function(info){
                        if(info.status==200){
                            layer.msg(info.msg,{anim:0},function(){
                                tableIn.reload();
                            });
                        }else{
                            layer.msg(info.msg);
                        }                        
                    });
                });
            }
        });
        //头工具栏事件批量操作---删除
        table.on('toolbar(list)', function(obj){
            var checkStatus = table.checkStatus('list');
            var ids = [];
            $(checkStatus.data).each(function (i, o){
                ids.push(o.id);
            });
            if(ids.length===0){
                layer.msg('请选择SVIP后再操作', {time: 1000, icon: 2});
                return false;
            }
            switch(obj.event){
                case 'openAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('setVipUp')}",{ids:ids,params:'{"status":1}'},function (res){
                        layer.close(loading);
                        if(res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        }else{
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                case 'closeAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('setVipUp')}",{ids:ids,params:'{"status":0}'},function (res){
                        layer.close(loading);
                        if (res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        } else {
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                case 'delAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('delsvip')}",{ids:ids}, function (res) {
                        layer.close(loading);
                        if (res.status === 200){
                            layer.msg(res.msg, {time: 1000, icon: 1});
                            tableIn.reload();
                        } else {
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                //自定义头工具栏右侧图标 - 提示
                case 'LAYTABLE_TIPS':

                    break;
            }
        });
    })
</script>
