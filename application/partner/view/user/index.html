{include file="common/head"/}
<div class="layui-fluid">
    <div class="admin-head">
        <ul>
            <li class="on">用户列表</li>
        </ul>
    </div>
    <div class="table-body">
        <div class="search-tool">
            <form class="layui-form">
                <div class="layui-inline">
                   <input type="text" class="layui-input" placeholder="检索日期" id="ondate" style="width:200px;">
                    <span class="item-icon"><i class="layui-icon layui-icon-date"></i></span>
                </div>
                <div class="layui-inline">
                    <select id="online" lay-filter="onstatus">
                        <option value="">状态</option>
                        <option value="1">启用</option>
                        <option value="0">禁用</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <select id="onsvip" lay-filter="onsvip">
                        <option value="">所有用户</option>
                        <option value="0">非会员</option>
                        {volist name="sviplist" id="v"}
                            <option value="{$v.id}">{$v.name}</option>
                        {/volist}
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" class="layui-input" placeholder="搜索" id="search" style="width:200px;" />
                    <span class="item-icon" id="onsearch"><i class="icon icon-search"></i></span>
                </div>
            </form>
        </div>
        <table id="list" lay-filter="list"></table>
    </div>
</div>

{include file="common/foot"/}
<script type="text/html" id="action">
    <a class="layui-btn layui-btn-sm layui-btn-danger" lay-event="del">
        <i class="layui-icon layui-icon-delete"></i>删除
    </a>
    <a class="layui-btn layui-btn-sm layui-btn-normal" lay-event="more">
        <i class="icon icon-down"></i> 更多
    </a>
</script>
<script type="text/html" id="table-toolbar">
    <div class="layui-btn-container">
        
    </div>
</script>
<script>
    var dateVal='',statusVal='',searchVal='',onlineVal='',svipVal='';
    layui.use(['table','element','form','laydate','dropdown'],function(){
        var table = layui.table, $ = layui.jquery,laydate = layui.laydate,form=layui.form,dropdown=layui.dropdown;
        var tableIn = table.render({
            id: 'list',
            elem: '#list',
            url: '{:createUrl("index")}',
            toolbar:'#table-toolbar',
            method:'get',
            page:true,
            response:{
                statusName:'status',
                statusCode:200,
                msgName:'msg',
                countName:'total',
                dataName:'data',
            },
            cols: [[
                {type: 'checkbox',title:'ID',align:'center',width:50},
                {field: 'id',title: 'ID',align:'center',width:70},
                {field: 'agent',title:'所属代理',align:'center',width:150,templet:function(d){
                    if(d.agent){
                        return d.agent.username+'【'+d.agent.id+'】';
                    }else{
                        return ' - ';
                    }
                }},
                {field: 'avatar',title: '头像',align:'center',width:80,templet:function(d){
                    return '<a href="'+d.avatar+'" target="_blank"><img src="'+d.avatar+'" width="32" height="32"/></a>';
                }},
                {field: 'nickname',title:'昵称',align:'center',width:150},
                {field: 'username',title:'用户名',align:'center',width:150},
                {field: 'mobile', align: 'center',title: '手机',width:120},
                {field: 'invite',title:'邀请人',align:'center',width:150,templet:function(d){
                    if(d.invite){
                        return d.invite.nickname+'【'+d.invite.id+'】';
                    }else{
                        return ' - ';
                    }
                }},
                {field: 'balance', align: 'center',title: '余额',width:120},
                {field:'status',width:120,title: '账户状态',align:'center',templet:function(d){
                    if(d.status==1){
                        var checked='checked';
                    }else{
                        var checked='';
                    }
                    return '<input type="checkbox" '+checked+' lay-skin="switch" lay-filter="status" lay-text="正常|禁用" value="'+d.status+'" id="'+d.id+'">';
                }},
                {field: 'is_vip', align: 'center',title: '会员',width:80,templet:function(d){
                    if(d.is_vip){return '是';}else{return '否'}
                }},
                {field: 'exp_time_text', align: 'center',title: '到期时间',width:150},
                {field: 'login_time_text', align: 'center',title: '登录时间',width:150},
                {field: 'ctime_text', align: 'center',title: '注册时间',width:150},
                {align: 'center',toolbar:'#action',width:360}
            ]]
        });
        form.on('switch(status)',function(data){
            var loading = layer.load(1, {shade: [0.1, '#fff']});
            var status=parseInt(data.elem.value)==1 ? 0 : 1;
            $.post('{:createUrl("setUp")}',{'ids':data.elem.id,'params':'{"status":"'+status+'"}'},function(res){
                layer.close(loading);
                if(res.status ===200){
                    data.elem['value']=status;
                    return false;
                }else{
                    layer.msg('操作失败！', {time: 1000, icon: 2});
                    return false;
                }
            });
        });
        //选择日期
        laydate.render({
            elem: '#ondate',
            range: '-',
            done:function(value, date, endDate){
                dateVal=value, onlineVal=$('#online').val(),searchVal=$('#search').val(),svipVal=$('#onsvip').val();
                var params={};

                if(onlineVal){
                    params['status']=onlineVal
                }
                if(svipVal){
                    params['vid']=svipVal;
                }
                table.reload('list',{
                    where:{
                        date:dateVal,
                        search:searchVal,
                        filter:JSON.stringify(params)
                    },
                    page: {
                        curr: 1
                    }
                });
            }
        });
        //下拉选项
        form.on('select(onstatus)', function(data){
            dateVal=$('#ondate').val(),onlineVal=data.value,searchVal=$('#search').val(),svipVal=$('#onsvip').val();
            var params={};
            if(onlineVal){
                params['status']=onlineVal
            }
            if(svipVal){
                params['vid']=svipVal;
            }
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:JSON.stringify(params)
                },
                page: {
                    curr: 1
                }
            });
        });
        //SVIP选项
        form.on('select(onsvip)', function(data){
            dateVal=$('#ondate').val(),svipVal=data.value,searchVal=$('#search').val(),onlineVal=$('#online').val();
            var params={};
            if(svipVal){
                params['vid']=svipVal;
            }
            if(onlineVal){
                params['status']=onlineVal
            }
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:JSON.stringify(params)
                },
                page: {
                    curr: 1
                }
            });
        });
        //搜索关键字
        $('#onsearch').on('click',function(e){
            dateVal=$('#ondate').val(),onlineVal=$('#online').val(),searchVal=$('#search').val(),svipVal=$('#onsvip').val();
            var params={};
            if(onlineVal){
                params['status']=onlineVal
            }
            if(svipVal){
                params['vid']=svipVal;
            }
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:JSON.stringify(params)
                },
                page: {
                    curr: 1
                }
            });
        });

        //行列表操作项事件
        table.on('tool(list)', function(obj) {
            var that = this;
            var data = obj.data;
            if(obj.event === 'more'){
                // 更多下拉菜单
                dropdown.render({
                    elem: that,
                    show: true, // 外部事件触发即显示
                    data: [
                        {
                            title: 'SVIP升级',
                            id: 'svip'
                        }, {
                            title: '资源获取',
                            id: 'resource'
                        }
                        , {
                            title: '余额记录',
                            id: 'bill'
                        }
                        , {
                            title: '邀请列表',
                            id: 'spread'
                        }
                    ],
                    click: function(action, othis){
                        //根据 id 做出不同操作
                        switch(action.id){
                            case 'svip':
                                layer.open({
                                    title:'SVIP升级记录',
                                    type:2,
                                    maxmin: true,
                                    area:['90%','550px'],
                                    content:'{:createUrl("usersvip")}?ids='+data.id,
                                    end:function(){
                                        tableIn.reload();
                                    }
                                });
                                break;
                            case 'resource':
                                layer.open({
                                    title:'资源获取记录',
                                    type:2,
                                    maxmin: true,
                                    area:['90%','550px'],
                                    content:'{:createUrl("userResource")}?ids='+data.id,
                                    end:function(){
                                        tableIn.reload();
                                    }
                                });
                                break;
                            case 'bill':
                                layer.open({
                                    title:'余额记录',
                                    type:2,
                                    maxmin: true,
                                    area:['90%','550px'],
                                    content:'{:createUrl("bill")}?ids='+data.id,
                                    end:function(){
                                        tableIn.reload();
                                    }
                                });
                                break;
                            case 'spread':
                                layer.open({
                                    title:'邀请列表',
                                    type:2,
                                    maxmin: true,
                                    area:['90%','550px'],
                                    content:'{:createUrl("spread")}?ids='+data.id,
                                    end:function(){
                                        tableIn.reload();
                                    }
                                });
                                break;
                        }
                    }
                });
            }else if(obj.event === 'setSvip'){
                layer.open({
                    title:'会员SVIP升级',
                    type:2,
                    maxmin: true,
                    area:['50%','300px'],
                    content:'{:createUrl("setsvip")}?ids='+data.id,
                    end:function(){
                        tableIn.reload();
                    }
                });
            }else if(obj.event==='recharge'){
                layer.open({
                    title:'余额充值',
                    type:2,
                    area:['70%','450px'],
                    content:'{:createUrl("recharge")}?ids='+data.id,
                    end:function(){
                        tableIn.reload();
                    }
                });
            }else if(obj.event==='del'){
                layer.confirm('确定删除吗？',{icon:3,title:'提示'},function(index){
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('del')}",{ids:data.id}, function (res) {
                        layer.close(loading);
                        if (res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        } else {
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                });
            }
        });
        //头工具栏事件批量操作---删除
        table.on('toolbar(list)', function(obj){
            var checkStatus = table.checkStatus('list');
            var ids = [];
            $(checkStatus.data).each(function (i, o){
                ids.push(o.id);
            });
            if(ids.length===0){
                layer.msg('请选择操作项', {time: 1000, icon: 2});
                return false;
            }
            switch(obj.event){
                case 'openAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('setUp')}",{ids:ids,params:'{"status":1}'},function (res){
                        layer.close(loading);
                        if(res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        }else{
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                case 'closeAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('setUp')}",{ids:ids,params:'{"status":0}'},function (res){
                        layer.close(loading);
                        if (res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        } else {
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                case 'inviteAll':
                    layer.prompt({
                        formType: 0,
                        value: '',
                        title: '请输入邀请人ID',
                        maxlength: 24,
                    }, function(value, index, elem){
                        var invite_id=parseInt(value);
                        if(invite_id.toString() == "NaN"){
                            layer.msg('请输入邀请人ID', {time: 1000, icon: 2});
                            return false;
                        }
                        var loading = layer.load(1,{shade: [0.1, '#fff']});
                        $.post("{:createUrl('setUp')}",{ids:ids,params:'{"pid":'+invite_id+'}'},function (res){
                            layer.close(loading);
                            if (res.status === 200){
                                layer.msg('操作成功', {time: 1000, icon: 1});
                                tableIn.reload();
                            } else {
                                layer.msg(res.msg, {time: 1000, icon: 2});
                            }
                        });
                        layer.close(index);
                    });
                    break;
                case 'agentAll':
                    layer.prompt({
                        formType: 0,
                        value: '',
                        title: '请输入代理ID',
                        maxlength: 24,
                    }, function(value, index, elem){
                        var agent_id=parseInt(value);
                        if(agent_id.toString() == "NaN"){
                            layer.msg('请输入代理ID', {time: 1000, icon: 2});
                            return false;
                        }
                        var loading = layer.load(1,{shade: [0.1, '#fff']});
                        $.post("{:createUrl('setUp')}",{ids:ids,params:'{"admin_id":'+agent_id+'}'},function (res){
                            layer.close(loading);
                            if (res.status === 200){
                                layer.msg('操作成功', {time: 1000, icon: 1});
                                tableIn.reload();
                            } else {
                                layer.msg(res.msg, {time: 1000, icon: 2});
                            }
                        });
                        layer.close(index);
                    });
                    break;
                case 'delAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('del')}",{ids:ids}, function (res) {
                        layer.close(loading);
                        if (res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        } else {
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                //自定义头工具栏右侧图标 - 提示
                case 'LAYTABLE_TIPS':

                    break;
            }
        });
    })
</script>
