{include file="common/head"/}
<style>
    html,body{
        background-color: #fff;
    }
</style>
<div class="layui-fluid">
    <div class="layui-card">
        <form class="layui-form layui-form-pane" lay-filter="formbar">
            <div class="layui-form-item">
                <label class="layui-form-label">用户名</label>
                <div class="layui-input-inline from-inline-3">
                    <div class="layui-text">{$row['username']}</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">用户头像</label>
                <div class="layui-input-inline from-inline-5">
                    <input type="hidden" name="row[avatar]" id="thumb" value="{$row['avatar']}">
                    <div class="layui-upload">
                        <div class="layui-upload-list" id="uploadImg" style="cursor: pointer;">
                            <img class="layui-upload-img" width="76" height="76" src="{$row['avatar']|default='__ADMIN__/images/default.png'}" id="Image">
                            <p id="preview"></p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">到期日期</label>
                <div class="layui-input-inline from-inline-3">
                    <input type="input" id="exp_time" name="row[exp_time]" lay-verify="required" value="{$exp_date}" lay-reqText="请选择到期日期" autocomplete="off" placeholder="选择到期日期" class="layui-input">
                    <div class="layui-word-aux" style="color:#f90!important;">【账号到期日期】</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">抽成比例</label>
                <div class="layui-input-inline from-inline-5">
                    <div class="layui-inline">
                        <input type="number" name="row[min_take]" lay-verify="required" value="{$row['min_take']}" lay-reqText="请输入抽成比例" placeholder="{:lang('pleaseEnter')}抽成比例" class="layui-input">
                    </div>
                    <div class="layui-inline">%</div>
                    <div class="layui-word-aux" style="color:#f90!important;">【设置此代理被抽成比例:百分之几】</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">资源最低现价:</label>
                <div class="layui-input-inline from-inline-5">
                    <div class="layui-inline">
                        <input type="number" name="row[min_pub]" lay-verify="required" value="{$row['min_pub']}" lay-reqText="请输入最低发布金额" placeholder="{:lang('pleaseEnter')}最低发布金额" class="layui-input">
                    </div>
                    <div class="layui-inline">元</div>
                    <div class="layui-word-aux" style="color:#f90!important;">【设置此代理资源最低现价（元）】</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">资源最低原价:</label>
                <div class="layui-input-inline from-inline-3">
                    <div class="layui-inline">
                        <input type="number" name="row[dis_pub]" lay-verify="required" value="{$row['dis_pub']}" lay-reqText="请输入最低发布原价" placeholder="{:lang('pleaseEnter')}最低发布原价" class="layui-input">
                    </div>
                    <div class="layui-inline">元</div>
                    <div class="layui-word-aux" style="color:#f90!important;">【设置此代理资源最低原价（元）】</div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">{:lang('submit')}</button>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="common/foot"/}
<script>
    layui.config({
        base: '__STATIC__/layuiadmin/mods/',
        version: '1.0'
    });
    layui.use(['form','upload','laydate'], function(){
        var form = layui.form,$= layui.jquery,laydate = layui.laydate;
        laydate.render({
            elem: '#exp_time',
            type:'date',
            value:'{$exp_date}'
        });
        $("#uploadImg").on('click',function(){
            layer.open({
                title:'选择头像',
                type:2,
                maxmin: true,
                area:['80%','500px'],
                content:'{:createUrl("attachment/index")}?type=0&name=thumb&prename=Image',
            });
        });
        form.on('submit(submit)', function (data) {
            loading =layer.load(1, {shade: [0.1,'#fff']});
            $.post("", data.field, function (res) {
                layer.close(loading);
                if (res.status===200){
                    layer.msg('更新成功',{time: 1000, icon: 1},function(){
                        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                        parent.layer.close(index);//再执行关闭
                    });
                } else {
                    layer.msg(res.msg, {time: 1000, icon: 2});
                }
            });
        })
    });
</script>
