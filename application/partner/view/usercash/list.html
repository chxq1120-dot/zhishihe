{include file="common/head"/}
<style>
.layui-table-cell{height: inherit;}
</style>
<div class="layui-fluid">
    <div class="admin-head">
        <ul>
            <li class="on">全部提现记录</li>
        </ul>
    </div>
    <div class="table-body">
        <div class="search-tool">
            <form class="layui-form">
                <div class="layui-inline">
                    <input type="text" class="layui-input" placeholder="检索日期" id="ondate" style="width:200px;">
                    <span class="item-icon"><i class="layui-icon layui-icon-date"></i></span>
                </div>
                <div class="layui-inline" style="width: 100px;">
                    <select id="onstatus" lay-filter="onstatus">
                        <option value="">状态</option>
                        <option value="0">审核中</option>
                        <option value="1">通过</option>
                        <option value="2">已完成</option>
                        <option value="-1">不通过</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" class="layui-input" placeholder="名称" id="search" style="width:200px;" />
                    <span class="item-icon" id="onsearch"><i class="icon icon-search"></i></span>
                </div>
            </form>
        </div>
        <table id="list" lay-filter="list"></table>
    </div>
</div>
{include file="common/foot"/}

<script>
    layui.use(['table','element','form','laydate'],function(){
        var table = layui.table, $ = layui.jquery,laydate = layui.laydate,form=layui.form,element = layui.element;
        var tableIn = table.render({
            id: 'list',
            elem: '#list',
            url: '{:createUrl("list")}',
            toolbar:'#table-toolbar',
            method:'get',
            page:true,
            response:{
                statusName:'status',
                statusCode:200,
                msgName:'msg',
                countName:'total',
                dataName:'data',
            },
            cols: [[
                {field: 'id',title:'ID',align:'center',width:60},
                {title: '用户',align:'center',width:150,templet:function(d){
                    if(d.user){
                        return d.user.nickname;
                    }else{
                        return ' - ';
                    }
                }},
                {field:'type',width:90,title: '类型',align:'center',templet:function(d){
                    if(d.type==1){
                        return '<span class="blue_block">支付宝</span>';
                    }else if(d.type==2){
                        return '<span class="green_block">微信</span>';
                    }else{
                        return '<span class="orange_block">银行卡</span>';
                    }
                }},
                {field: 'realname',title:'姓名',align:'center',width:100},
                {title: '收款信息',align:'left',width:260,templet:function(d){
                    if(d.type==1){
                        if(d.image){
                            var str= '<a lay-event="viewPhoto"><img src="'+d.image+'" width="64" height="auto"/></a>';
                        }else{
                            var str= '<div class="lines">支付宝姓名：'+d.realname+'</div>'+
                                     '<div class="lines">支付宝账号：'+d.account+'</div>';
                        }
                    }else if(d.type==2){
                        if(d.image){
                            var str= '<a lay-event="viewPhoto"><img src="'+d.image+'" width="64" height="auto"/></a>';
                        }else{
                            var str= '<div class="lines">微信实名姓名：'+d.realname+'</div>';
                        }
                    }else{
                        var str= '<div class="lines">开户行：'+d.bankname+'</div>'+
                                 '<div class="lines">开户名：'+d.realname+'</div>'+
                                 '<div class="lines">银行卡号：'+d.bankno+'</div>';
                    }
                    return str;
                }},
                {field: 'money',title:'提现金额',align:'center',width:90},
                {field: 'fee',title:'手续费',align:'center',width:80},
                {field: 'amount',title:'到账金额',align:'center',width:90},
                {field:'status',width:80,title: '状态',align:'center',templet:function(d){
                    if(d.status==0){
                        return '<span class="orange">审核中</span>';
                    }else if(d.status==1){
                        return '<span class="green">待付款</span>';
                    }else if(d.status==2){
                        return '<span class="blue">已完成</span>';
                    }else{
                        return '<span class="red">审核拒绝</span>';
                    }
                }},
                {field: 'ctime_text', align: 'center',title: '申请时间',width:150},
                {field: 'utime_text', align: 'center',title: '处理时间',width:150},
            ]]
        });
        //选择日期
        laydate.render({
            elem: '#ondate',
            range: '-',
            done:function(value, date, endDate){
                dateVal=value, statusVal=$('#onstatus').val(),searchVal=$('#search').val();
                var params={};
                if(statusVal){
                    params['status']=statusVal
                }
                table.reload('list',{
                    where:{
                        date:dateVal,
                        search:searchVal,
                        filter:JSON.stringify(params)
                    }
                });
            }
        });
        //下拉选项
        form.on('select(onstatus)', function(data){
            dateVal=$('#ondate').val(),statusVal=data.value,searchVal=$('#search').val();
            var params={};
            if(statusVal){
                params['status']=statusVal
            }
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:JSON.stringify(params)
                }
            });
        });

        //搜索关键字
        $('#onsearch').on('click',function(e){
            dateVal=$('#ondate').val(),statusVal=$('#onstatus').val(),searchVal=$('#search').val();
            var params={};
            if(statusVal){
                params['status']=statusVal
            }
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:JSON.stringify(params)
                }
            });
        });
        //行列表操作项事件
        table.on('tool(list)', function(obj) {
            var data = obj.data;
            if(obj.event === 'del'){
                layer.confirm('你确定要删除吗？', {icon: 3}, function (index) {
                    $.post("{:createUrl('del')}",{ids:data.id},function(res){
                        if(res.status===200){
                            layer.msg('删除成功',{time:1000,icon:1});
                            tableIn.reload();
                        }else{
                            layer.msg(res.msg,{time:1000,icon:2});
                        }
                    });
                    layer.close(index);
                });
            }else if(obj.event === 'viewPhoto'){
                layer.open({
                    type:1,
                    title:'收款码',
                    area:['300px','450'],
                    content:'<img src="'+data.image+'" width="100%" height="auto"/>'
                });
            }
        });
    })
</script>
