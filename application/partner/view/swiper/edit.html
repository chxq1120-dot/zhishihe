{include file="common/head"/}
<div class="layui-fluid">
    <div class="table-body">
        <div class="layui-card-header">编辑图片</div>
        <div class="layui-card" style="padding-top:20px;">
            <form class="layui-form layui-form-pane" lay-filter="agent">
                <input type="hidden" name="row[id]" value="{$row['id']}"/>
                <div class="layui-form-item">
                    <label class="layui-form-label">图片名称</label>
                    <div class="layui-input-inline from-inline-3">
                        <input type="text" name="row[title]" value="{$row['title']}" lay-verify="required" lay-reqText="请输入图片名称" placeholder="{:lang('pleaseEnter')}图片名称" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">图片类型</label>
                    <div class="layui-input-inline from-inline-3">
                        <select name="row[type]" class="layui-select">
                            <option value="0" {eq name="$row['type']" value="0"}selected{/eq}>自主代理分站</option>
                            <option value="1" {eq name="$row['type']" value="1"}selected{/eq}>电脑端首页</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">背景样式</label>
                    <div class="layui-input-inline from-inline-3">
                        <input type="text" name="row[style]" value="{$row['style']}" placeholder="{:lang('pleaseEnter')}背景样式" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">上传图片</label>
                    <div class="layui-input-inline from-inline-3">
                        <input type="hidden" name="row[url]" id="thumb" value="{$row['url']}">
                        <div class="layui-upload">
                            <div class="layui-upload-list" id="uploadImg" style="cursor: pointer;">
                                <img class="layui-upload-img" width="82" height="82" src="{$row['url']}" id="Image">
                                <p id="preview"></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">链接地址</label>
                    <div class="layui-input-inline from-inline-3">
                        <input type="text" name="row[link]" value="{$row['link']}" lay-verify="required" placeholder="{:lang('pleaseEnter')}链接地址" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline from-inline-3">
                        <input type="checkbox" name="row[status]" lay-skin="switch" value="1" {eq name="$row['status']" value="1"}checked{/eq} lay-text="启用|禁用">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">{:lang('submit')}</button>
                        <a href="{:createUrl('index')}" class="layui-btn layui-btn-primary">{:lang('back')}</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{include file="common/foot"/}
<script>
layui.config({
    base: '__STATIC__/layuiadmin/mods/',
    version: '1.0'
});
layui.use(['form'], function(){
    var form = layui.form,$= layui.jquery;
    $("#uploadImg").on('click',function(){
        layer.open({
            title:'上传图片',
            type:2,
            maxmin: true,
            area:['80%','500px'],
            content:'{:createUrl("attachment/index")}?type=0&name=thumb&prename=Image',
        });
    });
    form.on('submit(submit)', function (data) {
        loading =layer.load(1, {shade: [0.1,'#fff']});
        $.post("", data.field, function (res) {
            layer.close(loading);
            if (res.status===200){
                layer.msg('更新成功',{time: 1000, icon: 1},function(){
                    location.href = '{:createUrl("index")}';
                });
            } else {
                layer.msg(res.msg, {time: 1000, icon: 2});
            }
        });
    })
});
</script>
