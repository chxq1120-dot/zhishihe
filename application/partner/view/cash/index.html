{include file="common/head"/}
<style>
    .layui-table-cell{height: inherit;}
</style>
<div class="layui-fluid">
    <div class="admin-head">
        <ul>
            <li class="on">提现列表</li>
        </ul>
    </div>
    <div class="table-body">
        <div class="search-tool">
            <form class="layui-form">
                <div class="layui-inline">
                    <input type="text" class="layui-input" placeholder="检索日期" id="ondate" style="width:200px;">
                    <span class="item-icon"><i class="layui-icon layui-icon-date"></i></span>
                </div>
                <div class="layui-inline">
                    <select id="online" lay-filter="onstatus">
                        <option value="">全部状态</option>
                        <option value="1">审核通过</option>
                        <option value="0">待审核</option>
                        <option value="-1">审核拒绝</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" class="layui-input" placeholder="备注 / id" id="search" style="width:200px;" />
                    <span class="item-icon" id="onsearch"><i class="icon icon-search"></i></span>
                </div>
            </form>
            <div class="func-btn" id="func-btn">
                <a href="javascript:;" class="add layui-btn layui-bg-blue layui-btn-small">
                    <i class="layui-icon layui-icon-addition"></i>
                    申请提现
                </a>
            </div>
        </div>
        <table id="list" lay-filter="list"></table>
    </div>
</div>
{include file="common/foot"/}
<script type="text/html" id="statusTpl">
    {{# if(d.status==1){ }}
        <span class="green_block">审核通过</span>
    {{# }else if(d.status==-1){ }}
        <span class="red_block">审核拒绝</span>
    {{# }else{ }}
        <span class="blue_block">待审核</span>
    {{# } }}
</script>
<script type="text/html" id="table-toolbar">
    <div class="layui-btn-container"></div>
</script>
<script>
    var dateVal='',statusVal='',searchVal='',onlineVal='';
    layui.use(['table','element','form','laydate'],function(){
        var table = layui.table, $ = layui.jquery,laydate = layui.laydate,form=layui.form;
        var tableIn = table.render({
            id: 'list',
            elem: '#list',
            url: '{:createUrl("index")}',
            toolbar:'#table-toolbar',
            method:'get',
            page:true,
            response:{
                statusName:'status',
                statusCode:200,
                msgName:'msg',
                countName:'total',
                dataName:'data',
            },
            cols: [[
                {type: 'checkbox',title:'ID',align:'center',width:50},
                {field: 'user',title: '申请代理',align:'center',width:150,templet:function(d){
                    if(d.user){
                        return d.user.username+'【'+d.user.id+'】';
                    }else{
                        return ' - ';
                    }
                }},
                {field:'status',width:120,title: '审核状态',align:'center',templet:'#statusTpl'},
                {field: 'money',title: '提现金额',align:'center',width:90},
                {field: 'fee',title: '手续费',align:'center',width:90},
                {field: 'amount',title: '实际到账',align:'center',width:90},
                {field: 'type',title: '收款类型',align:'center',width:90,templet:function(d){
                    if(d.type===1){
                        return '<span class="blue">支付宝</span>';
                    }else if(d.type===2){
                        return '<span class="green">微信</span>';
                    }else{
                        return '<span class="orange">银行卡</span>';
                    }
                }},
                {field: 'image',title: '收款信息',align:'center',width:220,templet:function(d){
                    if(d.type==3){
                        var str='<div>开户行:'+d.bank+'</div>'+
                            '<div>开户名:'+d.truename+'</div>'+
                            '<div>银行账号:'+d.bankno+'</div>';
                        return str;
                    }else{
                        return '<a lay-event="viewPhoto"><img src="'+d.image+'" width="64" height="auto"/></a>';
                    }
                }},
                {field: 'remark', align: 'center',title: '备注',width:200},
                {field: 'reason', align: 'center',title: '审核说明',width:200},
                {field: 'utime_text', align: 'center',title: '审核时间',width:150},
                {field: 'ctime_text', align: 'center',title: '申请时间',width:150},
            ]]
        });
        //选择日期
        laydate.render({
            elem: '#ondate',
            range: '-',
            done:function(value, date, endDate){
                dateVal=value, onlineVal=$('#online').val(),searchVal=$('#search').val();
                var params={};

                if(onlineVal){
                    params['status']=onlineVal
                }
                table.reload('list',{
                    where:{
                        date:dateVal,
                        search:searchVal,
                        filter:JSON.stringify(params)
                    },
                    page: {
                        curr: 1
                    }
                });
            }
        });
        //下拉选项
        form.on('select(onstatus)', function(data){
            dateVal=$('#ondate').val(),onlineVal=data.value,searchVal=$('#search').val();
            var params={};
            if(onlineVal){
                params['status']=onlineVal
            }
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:JSON.stringify(params)
                },
                page: {
                    curr: 1
                }
            });
        });

        //搜索关键字
        $('#onsearch').on('click',function(e){
            dateVal=$('#ondate').val(),onlineVal=$('#online').val(),searchVal=$('#search').val();
            var params={};
            if(onlineVal){
                params['status']=onlineVal
            }
            table.reload('list',{
                where:{
                    date:dateVal,
                    search:searchVal,
                    filter:JSON.stringify(params)
                },
                page: {
                    curr: 1
                }
            });
        });
        //监听添加
        $('#func-btn .add').on('click',function () {
            layer.open({
                title:'申请提现',
                type:2,
                maxmin: true,
                content:'{:createUrl("add")}',
                area:['800px','550px'],
                end:function(){
                    tableIn.reload();
                }
            });
        });

        //行列表操作项事件
        table.on('tool(list)', function(obj) {
            var data = obj.data;
            if(obj.event === 'del'){
                layer.confirm('你确定要删除吗？', {icon: 3}, function (index) {
                    $.post("{:createUrl('del')}",{ids:data.id},function(res){
                        if(res.status===200){
                            layer.msg('删除成功',{time:1000,icon:1});
                            tableIn.reload();
                        }else{
                            layer.msg(res.msg,{time:1000,icon:2});
                        }
                    });
                    layer.close(index);
                });
            }else if(obj.event === 'edit'){
                layer.open({
                    title:'编辑申请',
                    type:2,
                    maxmin: true,
                    content:'{:createUrl("edit")}?ids='+data.id,
                    area:['800px','550px'],
                    end:function(){
                        tableIn.reload();
                    }
                });
            }else if(obj.event === 'passed'){
                layer.open({
                    title:'提现审核',
                    type:2,
                    maxmin: true,
                    content:'{:createUrl("passed")}?ids='+data.id,
                    area:['700px','350px'],
                    end:function(){
                        tableIn.reload();
                    }
                });
            }else if(obj.event === 'viewPhoto'){
                layer.open({
                    type:1,
                    title:'收款码',
                    area:['300px','450'],
                    content:'<img src="'+data.image+'" width="100%" height="auto"/>'
                });
            }
        });
        //头工具栏事件批量操作---删除
        table.on('toolbar(list)', function(obj){
            var checkStatus = table.checkStatus('list');
            var ids = [];
            $(checkStatus.data).each(function (i, o){
                ids.push(o.id);
            });
            if(ids.length===0){
                return false;
            }
            switch(obj.event){
                case 'openAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('setUp')}",{ids:ids,params:'{"status":1}'},function (res){
                        layer.close(loading);
                        if(res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        }else{
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                case 'closeAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('setUp')}",{ids:ids,params:'{"status":0}'},function (res){
                        layer.close(loading);
                        if (res.status === 200){
                            layer.msg('操作成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        } else {
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                case 'delAll':
                    var loading = layer.load(1,{shade: [0.1, '#fff']});
                    $.post("{:createUrl('del')}",{ids:ids}, function (res) {
                        layer.close(loading);
                        if (res.status === 200){
                            layer.msg('删除成功', {time: 1000, icon: 1});
                            tableIn.reload();
                        } else {
                            layer.msg(res.msg, {time: 1000, icon: 2});
                        }
                    });
                    break;
                //自定义头工具栏右侧图标 - 提示
                case 'LAYTABLE_TIPS':

                    break;
            }
        });
    });
</script>
