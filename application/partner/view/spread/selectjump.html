<form class="layui-form seller-form"  action="" >
    <div class="layui-form-item" style="display: flex;align-items: center;margin-bottom:0;padding:10px 0 0 10px;">
        <div class="layui-inline">名称：</div>
        <div class="layui-inline">
            <input type="text" name="name" lay-verify="title" style="width:200px;" placeholder="请输入跳转名称" autocomplete="off" class="layui-input">
        </div>
        <div class="layui-inline">
            <button class="layui-btn layui-btn-sm" lay-submit lay-filter="jump-search">查询</button>
        </div>
        <div class="layui-inline"><div class="layui-form-mid">您选择了:<span id="tagGoodsNum">0</span>个跳转。<span class="orange">温馨提示：如没有勾选跳转，点击《完成》按钮将取消对应资源挂载的跳转。</span></div></div>
    </div>
</form>
<table id="tagTable" lay-filter="tagTable"></table>
<script>
    var id_s = {};
    var table_data=new Array();
    layui.use(['form', 'laydate','table'], function(){
        layui.table.render({
            elem: '#tagTable',
            height: '320',
            page: 'true',
            limit:'10',
            method:'get',
            url: "{:createUrl('jump')}",
            id:'tagTable',
            cols: [[
                {type:'checkbox'},
                {field: 'name',width:260,title: '名称',align:'center'},
                {field:'thumb', width:100,title:'图标', align: 'center',templet: function(data){
                    return '<a href="javascript:void(0);" onclick=viewImage("'+data.thumb+'")><image style="max-width:30px;max-height:30px;" src="'+data.thumb+'"/></a>';
                }},
                {field: 'url',align:'center',title: '跳转地址',width:240},
                {field: 'desc',align:'center',title: '简介'},
            ]],
            done: function(res, curr, count){
                //数据表格加载完成时调用此函数
                //如果是异步请求数据方式，res即为你接口返回的信息。
                //设置全部数据到全局变量
                table_data=res.data;
                //在缓存中找到id ,然后设置data表格中的选中状态
                //循环所有数据，找出对应关系，设置checkbox选中状态
                for(var i=0;i< res.data.length;i++){
                    if(id_s[res.data[i].id]){
                        //这里才是真正的有效勾选
                        res.data[i]["LAY_CHECKED"]='true';
                        //找到对应数据改变勾选样式，呈现出选中效果
                        var index= res.data[i]['LAY_TABLE_INDEX'];
                        $('#tagTable + div .layui-table-body tr[data-index=' + index + '] input[type="checkbox"]').prop('checked', true);
                        $('#tagTable + div .layui-table-body tr[data-index=' + index + '] input[type="checkbox"]').next().addClass('layui-form-checked');
                    }
                }
                //设置全选checkbox的选中状态，只有改变LAY_CHECKED的值， table.checkStatus才能抓取到选中的状态
                var checkStatus = layui.table.checkStatus('tagTable');
                if(checkStatus.isAll){
                    $('#tagTable + div .layui-table-header th[data-field="0"] input[type="checkbox"]').prop('checked', true);
                    $('#tagTable + div .layui-table-header th[data-field="0"] input[type="checkbox"]').next().addClass('layui-form-checked');
                }
            }
        });
        //监听表格复选框选择
        layui.table.on('checkbox(tagTable)', function(obj){
            if(obj.checked){
                if(obj.type=='one'){
                    id_s[obj.data.id] = obj.data;
                }else{
                    for(var i=0;i<table_data.length;i++){
                        id_s[table_data[i].id] = table_data[i];
                    }
                }
            }else{
                if(obj.type=='one'){
                    delete id_s[obj.data.id];
                }else{
                    for(var i=0;i<table_data.length;i++){
                        delete id_s[table_data[i].id];
                    }
                }
            }
            $('#tagGoodsNum').html(Object.getOwnPropertyNames(id_s).length);
        });
        layui.form.on('submit(jump-search)', function(data){
            layui.table.reload('tagTable', {
                where: {
                    search:data.field.name
                },page: {
                    curr: 1 //重新从第 1 页开始
                }
            });
            return false; //阻止表单跳转。如果需要表单跳转，去掉这段即可。
        });
    });
</script>
