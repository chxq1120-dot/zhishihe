{include file="common/head"/}
<div class="table-body" style="padding-top:15px!important;">
    <div class="layui-card">
        <form class="layui-form layui-form-pane" lay-filter="agent">
            <input type="hidden" name="row[ids]" value="{:input('ids')}"/>
            <div class="layui-form-item">
                <label class="layui-form-label">设置最小邀请人数</label>
                <div class="layui-input-inline from-inline-5">
                    <input type="text" name="row[min_money]" value="5" lay-verify="required" lay-reqText="请设置最小人数" placeholder="{:lang('pleaseEnter')}设置最小人数" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">设置最大邀请人数</label>
                <div class="layui-input-inline from-inline-5">
                    <input type="text" name="row[max_money]" value="10" lay-verify="required" lay-reqText="请设置最大人数" placeholder="{:lang('pleaseEnter')}设置最大人数" class="layui-input">
                    <div class="layui-form-mid layui-word-aux">(如不想随机邀请人数则填相同的数字)</div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button type="button" class="layui-btn" lay-submit="" lay-filter="submit">{:lang('submit')}</button>
                </div>
            </div>
        </form>
    </div>
</div>
{include file="common/foot"/}
<script>
    layui.use(['form'], function(){
        var form = layui.form,$= layui.jquery;
        form.on('submit(submit)', function (data) {
            loading =layer.load(1, {shade: [0.1,'#fff']});
            $.post("", data.field, function (res) {
                layer.close(loading);
                if (res.status===200){
                    layer.msg('设置成功',{time: 1000, icon: 1},function(){
                        var index = parent.layer.getFrameIndex(window.name); //先得到当前iframe层的索引
                        parent.layer.close(index);//再执行关闭
                    });
                } else {
                    layer.msg(res.msg, {time: 1000, icon: 2});
                }
            });
        })
    });
</script>
