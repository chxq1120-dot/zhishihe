{include file="common/head"/}
<link rel="stylesheet" href="__STATIC__/admin/custom/element/index.css">
<script src="__STATIC__/admin/custom/js/vue.min.js"></script>
<script src="__STATIC__/admin/custom/js/sortable.min.js"></script>
<script src="__STATIC__/admin/custom/js/vuedraggable.min.js"></script>
<script src="__STATIC__/admin/custom/element/index.js"></script>
<style>
    .wrapper {
        padding: 10px 30px;
        background-color: #fff;
        display: flex;
        justify-content: space-between;
        min-height: 500px;
    }

    .main-wrapper {
        width: 320px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 500px;
    }

    .main-header {
        height: 64px;
    }

    .main-body {
        height: calc(100% - 114px);
        background-color: #F4F5F9;
    }

    .main-menus {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: url("__STATIC__/admin/custom/images/keyboard.png") center center no-repeat;
        border: #e9e9e9 1px solid;
        border-top: 0;
    }

    .main-menus .ico-keyboard {
        width: 44px;
    }

    .main-menus .menu-bar {
        width: calc(100% - 45px);
        display: flex;
        align-items: center;
        justify-content: flex-start;
    }

    .menu-bar .menu_bottom {
        position: relative;
        float: left;
        display: inline-block;
        box-sizing: border-box;
        width: 91px;
        text-align: center;
        background-color: #e2e2e2;
        border: 1px solid #ebedee;
        cursor: pointer;
    }

    .menu-bar .menu_addicon {
        height: 46px;
        line-height: 46px;
    }

    .menu_bottom .menu_item {
        height: 44px;
        line-height: 44px;
        /*padding: 14px 0;*/
        text-align: center;
        box-sizing: border-box;
    }

    .menu-bar .active {
        border: 1px solid #2bb673;
    }

    .menu-bar .menu_subItem {
        height: 44px;
        line-height: 44px;
        text-align: center;
        box-sizing: border-box;
    }

    .submenu {
        position: absolute;
        width: 91px;
        bottom: 45px;
    }

    .submenu .subtitle {
        background-color: #e8e7e7;
        box-sizing: border-box;
        margin-bottom: 2px;
    }

    .menu-config {
        width: calc(100% - 350px);
        height: 500px;
        background-color: #fff;
    }

    .menu-config .config_page {
        padding: 0 30px 10px 30px;
    }

    .menu-config .delete_btn {
        text-align: right;
        margin-bottom: 15px;
    }

    .menu-config .menu_content {
        margin-top: 20px;
    }

    .menu-config .configur_content {
        margin-top: 20px;
    }

    .menu-config .media-type {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        margin: 10px 0;
    }

    .menu-config .media-type .media-item {
        padding: 8px 20px;
        background-color: #eee;
        border-radius: 5px;
        margin-right: 10px;
        cursor: pointer;
    }

    .menu-config .media-type .on {
        background-color: #ecf5ff;
        color: #409EFF;
    }

    .menu-config .blue {
        color: #29b6f6;
        margin-top: 10px;
    }

    .menu-config .applet {
        margin-bottom: 20px;
    }

    .menu-config .applet span {
        margin-right: 18px;
    }

    .material .input_width {
        width: 30%;
    }

    .material .el-textarea {
        width: 80%
    }

    .material .el-button {
        float: right;
    }

    .menu-config p {
        padding: 20px 0;
    }

    .el-dialog__header {
        border-bottom: #eee 1px solid;
    }

    .el-dialog__body {
        padding: 5px 15px !important;
    }

    .dialog-header {
        text-align: right;
        border-bottom: #eee 1px solid;
        padding: 10px 5px;
    }

    .el-pagination {
        margin: 20px;
        text-align: center;
    }
    .config-bottom{
        border-top:#eee 1px solid;
        margin:20px 30px;
        padding:10px 10px 20px 10px;
        display: flex;
        justify-content: space-between;
    }
    .config_title{
        padding:20px 0;
    }
    .config_title .name{
        font-size:16px;
        font-weight: bold;
    }
    .config_title .tips{
        font-size:12px;
        padding-left: 20px;
        color:#9c9c9c;
    }
    .config_item span{
        display: block;
        margin:10px 0;
    }
</style>
<div id="app" class="wrapper">
    <div class="main-wrapper">
        <div class="main-header">
            <img src="__STATIC__/admin/custom/images/wechat-header.png">
        </div>
        <div class="main-body"></div>
        <div class="main-menus">
            <div class="ico-keyboard"></div>
            <div class="menu-bar">
                <div class="menu_bottom" v-for="(item, i) of menu.button" :key="i">
                    <!-- 一级菜单 -->
                    <div @click="menuFun(i,item)" class="menu_item" :class="{'active': isActive == i}">{{item.name}}
                    </div>
                    <!--以下为二级菜单-->
                    <div class="submenu" v-if="isSubMenuFlag == i">
                        <div class="subtitle" v-for="(subItem, k) in item.sub_button" :key="k">
                            <div class="menu_subItem" :class="{'active': isSubMenuActive == i + '' +k}"
                                 @click="subMenuFun(item, subItem, i, k)">{{subItem.name}}
                            </div>
                        </div>
                        <!--  二级菜单加号， 当长度 小于  5 才显示二级菜单的加号  -->
                        <div class="menu_bottom menu_addicon" v-if="item.sub_button.length < 5"
                             @click="addSubMenu(item)"><i class="el-icon-plus"></i></div>
                    </div>
                </div>
                <!-- 一级菜单加号 -->
                <div class="menu_bottom menu_addicon" v-if="menuKeyLength < 3" @click="addMenu"><i
                        class="el-icon-plus"></i></div>
            </div>
        </div>
    </div>
    <div class="menu-config" v-if="!showFlag">
        <div class="config_page" v-if="menusShow">
            <div class="config_title" v-if="tempSelfObj.grand=='1'">
                <span class="name">菜单信息</span>
                <span class="tips">已添加子菜单，仅可设置菜单名称</span>
            </div>
            <div class="config_title" v-else>
                <span class="name">子菜单信息</span>
            </div>
            <div class="config_item">
                <span>菜单名称：</span>
                <el-input class="input_width" v-model="tempObj.name" maxlength="16" placeholder="请输入菜单名称" clearable></el-input>
                <div class="blue">仅支持中英文和数字，字数不超过8个汉字或16个字母</div>
            </div>
            <div v-if="tempObj.type">
                <div class="menu_content">
                    <span>菜单内容：</span>
                    <el-radio-group v-model="tempObj.type">
                        <el-radio :label="'click'">发送消息</el-radio>
                        <el-radio :label="'view'">跳转网页</el-radio>
                        <el-radio :label="'miniprogram'">小程序</el-radio>
                    </el-radio-group>
                </div>
                <div class="configur_content">
                    <div class="config_item" v-if="tempObj.type == 'view'">
                        <span>跳转网页：</span>
                        <el-input class="input_width" v-model="tempObj.url" placeholder="请输入链接" clearable></el-input>
                    </div>
                    <div class="config_item" v-if="tempObj.type == 'click'">
                        <span>关键词：</span>
                        <el-input class="input_width" v-model="tempObj.key" placeholder="请输入关键词" clearable></el-input>
                        <div class="blue">tips:这里需要配合关键词推送消息一起使用</div>
                    </div>
                    <div class="config_item" v-if="tempObj.type == 'miniprogram'">
                        <div class="applet">
                            <span>小程序的appid：</span>
                            <el-input class="input_width" v-model="tempObj.appid" placeholder="请输入小程序的appid" clearable></el-input>
                        </div>
                        <div>
                            <span>小程序的页面路径：</span>
                            <el-input class="input_width" v-model="tempObj.pagepath" placeholder="请输入小程序的页面路径，如：pages/index" clearable></el-input>
                        </div>
                        <div class="blue">tips:需要和公众号进行关联才可以把小程序绑定带微信菜单上哟！</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="config-bottom">
            <el-button size="mini" v-if="menusShow" type="danger" size="mini" icon="el-icon-delete" @click="deleteMenu(tempObj)">删除菜单</el-button>
            <el-button class="save_btn" type="primary" @click="saveFun">保存并发布至菜单</el-button>
        </div>
    </div>
    <!--一进页面就显示的默认页面，当点击左边按钮的时候，就不显示了-->
    <div v-if="showFlag" class="menu-config">
        <p style="padding:20px 30px;font-size:14px;color:#6c6c6c;">点击左侧添加菜单为公众号配置菜单栏。</p>
    </div>
</div>
{include file="common/foot"/}
<script type="text/javascript">
    Vue.config.productionTip = false;
    Vue.config.lang = 'zh-CN';
    new Vue({
        el: '#app',
        data: {
            showFlag: true,
            menu: {
                button: []
            },
            isActive: -1,// 一级菜单点中样式
            isSubMenuActive: -1,// 一级菜单点中样式
            isSubMenuFlag: -1,// 二级菜单显示标志
            listLoading: false,
            media_type: 'text',
            menusShow: true,
            query: {
                page: 1,
                limit: 5
            },
            total: 0,
            tempObj: {
                //type:"click",//media_id:素材内容; view:跳转链接
                // name:"",//菜单名称
                // material:"",//素材名称
                // link:"",//跳转链接
            },//右边临时变量，作为中间值牵引关系
            tempSelfObj: {
                //一些临时值放在这里进行判断，如果放在tempObj，由于引用关系，menu也会多了多余的参数
                // grand:"" 1:表示一级菜单； 2:表示二级菜单
                // index:"" 表示一级菜单索引
                // secondIndex:"" 表示二级菜单索引
            },

            visible2: false,//素材内容  "选择素材"按钮弹框显示隐藏
            tableData: [] //素材内容弹框数据
        },
        components: {},
        computed: {
            // menuObj的长度，当长度 小于  3 才显示一级菜单的加号
            menuKeyLength: function () {
                return this.menu.button.length;
            }
        },
        mounted: function () {
            this.getMenulist();
        },
        methods: {
            getMenulist() {
                let self = this;
                $.post("{:createUrl('menus')}", {act: 'menulist'}, function (res) {
                    if (res.status == 200) {
                        self.menu = res.data.menulist;
                    } else if (res.status == 304) {
                        console.log(res.msg);
                    } else {
                        self.$message({
                            type: 'error',
                            message: res.msg
                        });
                    }
                }, 'json');
            },
            saveFun() {
                let self = this;
                var loading=layer.load(1,{shade:[0.1,'#fff']});
                var menus=self.menu.button;
                $.post("{:createUrl('menus')}", {act: 'SAVEMENU',menus:menus}, function (res) {
                    layer.close(loading);
                    if (res.status == 200) {
                        self.$message({
                            type: 'success',
                            message: '菜单保存成功'
                        });
                    } else {
                        self.$message({
                            type: 'error',
                            message: res.msg
                        });
                    }
                }, 'json');
            },
            // 一级菜单点击事件
            menuFun(i, item) {
                let subMenuKeyLength = item.sub_button.length;//获取二级菜单key长度
                this.showFlag = false;//右边菜单隐藏
                this.menusShow = true;
                if(subMenuKeyLength==0){
                    if(!item.type){
                        item={
                            type:'click',
                            name:item.name,
                            sub_button:[]
                        };
                    }
                    this.tempObj = item;//这个如果放在顶部，flag会没有。因为重新赋值了。
                }else{
                    item={
                        name:item.name,
                        sub_button:item.sub_button
                    };
                    this.tempObj = item;//这个如果放在顶部，flag会没有。因为重新赋值了。
                }
                this.tempSelfObj.grand = "1";//表示一级菜单
                this.tempSelfObj.index = i;//表示一级菜单索引
                this.isActive = i; //一级菜单选中样式
                this.isSubMenuFlag = i; //二级菜单显示标志
                this.isSubMenuActive = -1; //二级菜单去除选中样式

            },
            // 二级菜单点击事件
            subMenuFun(item, subItem, index, k) {
                this.showFlag = false;//右边菜单隐藏
                this.tempObj = subItem;//将点击的数据放到临时变量，对象有引用作用
                this.tempSelfObj.grand = "2";//表示二级菜单
                this.tempSelfObj.index = index;//表示一级菜单索引
                this.tempSelfObj.secondIndex = k;//表示二级菜单索引
                this.isSubMenuActive = index + "" + k; //二级菜单选中样式
                this.isActive = -1;//一级菜单去除样式
            },
            // 添加横向一级菜单
            addMenu() {
                let self = this;
                // 先判断1，再判断2,对象增加，会进行往下计算，所以必须先判断2，再判断1
                if (self.menuKeyLength < 3) {
                    var items={
                        type: "click",
                        name: "菜单" + (self.menuKeyLength + 1),
                        sub_button: []
                    };
                    self.$set(this.menu.button,self.menuKeyLength,items);
                    self.menuFun(self.menuKeyLength-1,items);
                }
            },
            // 添加横向二级菜单
            addSubMenu(item) {
                let subMenuKeyLength = item.sub_button.length;//获取二级菜单key长度
                if (subMenuKeyLength < 5) {
                    this.$set(item.sub_button, subMenuKeyLength,
                        {
                            type: "click",
                            name: "子菜单"+(subMenuKeyLength + 1),
                        }
                    );
                }
            },
            //删除当前菜单
            deleteMenu(obj) {
                var _this = this;
                this.$confirm('此操作将永久删除该文件, 是否继续?', '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    _this.deleteData();// 删除菜单数据
                }).catch(() => {

                });
            },
            // 删除菜单数据
            deleteData() {
                // 一级菜单的删除方法
                if (this.tempSelfObj.grand == "1") {
                    this.menu.button.splice(this.tempSelfObj.index, 1);
                    var newlen=this.menuKeyLength;
                    if(newlen==0){
                        this.menusShow = false;
                    }else{
                        var newIndex=(newlen-1);
                        this.menuFun(newIndex, this.menu.button[newIndex]);
                    }
                }
                // 二级菜单的删除方法
                if (this.tempSelfObj.grand == "2") {
                    this.menu.button[this.tempSelfObj.index].sub_button.splice(this.tempSelfObj.secondIndex, 1);
                    var newIndex=this.tempSelfObj.index;
                    var subItem=this.menu.button[newIndex].sub_button;
                    if(subItem.length==0){
                        this.menuFun(newIndex, this.menu.button[newIndex]);
                    }else{
                        this.subMenuFun(this.menu.button[newIndex], subItem, newIndex, 0);
                    }
                }
                this.$message({
                    type: 'success',
                    message: '删除成功!'
                });
            }
        },
    });
</script>
