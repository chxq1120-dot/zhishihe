<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>智创云享知识付费系统安装向导</title>
    <link rel="stylesheet" href="__INSTALL__/css/style.css">
</head>
<body>
<nav class="zp-section-primary">
    <div class="zp-container zp-navbar">
        <div class="zp-navbar-left">
            <a href="/" class="zp-navbar-item zp-logo dux-logo">
                <img src="__STATIC__/admin/images/logo.png"/>知识付费系统
            </a>
        </div>
        <div class="zp-navbar-right">
            <div class="zp-navbar-item">
                安装向导
            </div>
        </div>
    </div>
</nav>
<br>
<div class="zp-container">
    <div class="zp-grid">
        <div class="zp-width-1-4">
            <div class="zp-card zp-card-default zp-card-body zp-card-small">
                <ul class="zp-tab zp-tab-left">
                    <li><a href="#">使用协议</a></li>
                    <li><a href="#">安装环境</a></li>
                    <li><a href="#">参数配置</a></li>
                    <li class="zp-active"><a href="#">完成安装</a></li>
                </ul>
            </div>

        </div>
        <div class="zp-width-3-4">
            <div class="zp-card zp-card-default zp-card-body ">
                <div class="dux-content" id="log"></div>
            </div>
            <div class="zp-margin-top zp-text-center">
                <span class="zp-hidden" id="error">
                    <a class="zp-button zp-button-secondary" href="{:url('config')}">上一步</a>
                </span>
                <div class="zp-hidden" id="complete">
                    <a class="zp-button zp-button-primary" href="{:url('/manage/login/index')}">进入后台</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript" src="__STATIC__/common/js/jquery.min.js"></script>
<script>
    var msg = function (str, error) {
        var html = '<p>';
        if (error) {
            html += '<span class="zp-text-danger">' + str + '</span>';
        } else {
            html += str;
        }
        html += '</p>';
        $('#log').append(html);
        if (error) {
            $('#error').removeClass('zp-hidden');
        }
    };
    var complete = function (str) {
        msg(str);
        $('#complete').removeClass('zp-hidden');
    };
</script>
</html>
