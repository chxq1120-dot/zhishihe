<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>智创云享知识付费系统安装向导</title>
    <link rel="stylesheet" href="__INSTALL__/css/style.css">
</head>
<body>
<nav class="zp-section-primary">
    <div class="zp-container zp-navbar">
        <div class="zp-navbar-left">
            <a href="/" class="zp-navbar-item zp-logo dux-logo">
                <img src="__STATIC__/admin/images/logo.png"/>知识付费系统
            </a>
        </div>
        <div class="zp-navbar-right">
            <div class="zp-navbar-item">
                安装向导
            </div>
        </div>
    </div>
</nav>
<br>
<div class="zp-container">
    <div class="zp-grid">
        <div class="zp-width-1-4">
            <div class="zp-card zp-card-default zp-card-body zp-card-small">
                <ul class="zp-tab zp-tab-left">
                    <li><a href="#">使用协议</a></li>
                    <li class="zp-active"><a href="#">安装环境</a></li>
                    <li><a href="#">参数配置</a></li>
                    <li><a href="#">完成安装</a></li>
                </ul>
            </div>

        </div>
        <div class="zp-width-3-4">
            <div class="zp-card zp-card-default zp-card-body ">
                <h2>
                    目录权限检测
                </h2>
                <table class="zp-table zp-table-divider">
                    <tbody>
                    {volist name="list" id="vo"}
                    <tr>
                        <td>{$vo.dir}</td>
                        {if $vo.writeable}
                        <td width="80"><span class="zp-label zp-label-success">可写</span></td>
                        {else}
                        <td width="80"><span class="zp-label zp-label-danger">无权限</span></td>
                        {/if}
                    </tr>
                    {/volist}
                    </tbody>
                </table>

                <h2>
                    功能支持检测
                </h2>
                <table class="zp-table zp-table-striped">
                    <tbody>
                    {volist name="funList" id="vo"}
                    <tr>
                        <td>{$vo.name}
                            {if $vo.must}
                            (非必须)
                            {/if}
                        </td>
                        {if $vo.status}
                        <td width="80"><span class="zp-label zp-label-success">支持</span></td>
                        {else}
                        <td width="80"><span class="zp-label zp-label-danger">不支持</span></td>
                        {/if}
                    </tr>
                    {/volist}
                    </tbody>
                </table>
            </div>
            <div class="zp-margin-top zp-text-center">
                <a class="zp-button zp-button-secondary" href="{:url('index')}">上一步</a>
                <a class="zp-button zp-button-primary" href="{:url('config')}">下一步</a>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="__STATIC__/common/js/jquery.min.js"></script>
</body>
</html>
