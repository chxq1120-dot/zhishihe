<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP会员 - 智创云享</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
        .page { min-height: 100vh; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #FF9800, #FFB74D); padding: 15px; color: #fff; font-size: 18px; font-weight: bold; text-align: center; }
        .vip-banner { background: linear-gradient(135deg, #FFD700, #FFA500); padding: 30px 20px; text-align: center; color: #fff; margin: 15px; border-radius: 10px; }
        .vip-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .vip-desc { font-size: 14px; opacity: 0.9; }
        .vip-items { padding: 0 15px; }
        .vip-item { background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; align-items: center; }
        .vip-icon { width: 40px; height: 40px; background: #FFD700; border-radius: 50%; margin-right: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .vip-item-name { font-size: 14px; color: #333; font-weight: bold; }
        .vip-item-desc { font-size: 12px; color: #999; }
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; display: flex; padding: 8px 0; z-index: 999; }
        .tab-item { flex: 1; text-align: center; cursor: pointer; padding: 5px 0; }
        .tab-item:active { background: #f0f0f0; }
        .tab-icon { width: 24px; height: 24px; background: #ddd; border-radius: 4px; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; overflow: hidden; }
        .tab-icon.active { background: #FF9800; }
        .tab-text { font-size: 10px; color: #999; margin-top: 2px; }
        .tab-text.active { color: #FF9800; }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <span>VIP会员</span>
        </div>
        <div class="vip-banner">
            <div class="vip-title">开通VIP会员</div>
            <div class="vip-desc">享受更多特权和优质服务</div>
        </div>
        <div class="vip-items">
            <div class="vip-item">
                <div class="vip-icon">✓</div>
                <div>
                    <div class="vip-item-name">专属资源</div>
                    <div class="vip-item-desc">解锁全部专属资源</div>
                </div>
            </div>
            <div class="vip-item">
                <div class="vip-icon">✓</div>
                <div>
                    <div class="vip-item-name">无限下载</div>
                    <div class="vip-item-desc">下载无限制</div>
                </div>
            </div>
            <div class="vip-item">
                <div class="vip-icon">✓</div>
                <div>
                    <div class="vip-item-name">专属客服</div>
                    <div class="vip-item-desc">享受专属客服服务</div>
                </div>
            </div>
            <div class="vip-item">
                <div class="vip-icon">✓</div>
                <div>
                    <div class="vip-item-name">优惠活动</div>
                    <div class="vip-item-desc">参与VIP专属活动</div>
                </div>
            </div>
        </div>
        <div class="tabbar">
            <div class="tab-item" onclick="location.href='/'">
                <div class="tab-icon"><span>首</span></div>
                <div class="tab-text">首页</div>
            </div>
            <div class="tab-item" onclick="location.href='/pages/tabbar/sort/index'">
                <div class="tab-icon"><span>分</span></div>
                <div class="tab-text">分类</div>
            </div>
            <div class="tab-item" onclick="location.href='/pages/tabbar/vip/index'">
                <div class="tab-icon active"><span>VIP</span></div>
                <div class="tab-text active">VIP</div>
            </div>
            <div class="tab-item" onclick="location.href='/pages/tabbar/my/index'">
                <div class="tab-icon"><span>我</span></div>
                <div class="tab-text">我的</div>
            </div>
        </div>
    </div>
</body>
</html>
