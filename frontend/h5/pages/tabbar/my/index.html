<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - 智创云享</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
        .page { min-height: 100vh; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #FF9800, #FFB74D); padding: 30px 15px; color: #fff; text-align: center; }
        .user-avatar { width: 60px; height: 60px; background: #fff; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .user-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .user-desc { font-size: 12px; opacity: 0.8; }
        .menu-section { background: #fff; margin: 15px; border-radius: 8px; overflow: hidden; }
        .menu-item { padding: 15px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; cursor: pointer; transition: background 0.2s; }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:active { background: #f9f9f9; }
        .menu-icon { width: 24px; height: 24px; background: #FF9800; border-radius: 4px; margin-right: 12px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
        .menu-name { flex: 1; font-size: 14px; color: #333; }
        .menu-arrow { color: #ccc; font-size: 14px; }
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; display: flex; padding: 8px 0; z-index: 999; }
        .tab-item { flex: 1; text-align: center; cursor: pointer; padding: 5px 0; }
        .tab-item:active { background: #f0f0f0; }
        .tab-icon { width: 24px; height: 24px; background: #ddd; border-radius: 4px; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; overflow: hidden; }
        .tab-icon.active { background: #FF9800; }
        .tab-text { font-size: 10px; color: #999; margin-top: 2px; }
        .tab-text.active { color: #FF9800; }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <div class="user-avatar">👤</div>
            <div class="user-name">游客用户</div>
            <div class="user-desc">点击登录享受更多功能</div>
        </div>
        <div class="menu-section">
            <div class="menu-item">
                <div class="menu-icon">📁</div>
                <div class="menu-name">我的资源</div>
                <div class="menu-arrow">&gt;</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">⭐</div>
                <div class="menu-name">我的收藏</div>
                <div class="menu-arrow">&gt;</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">📋</div>
                <div class="menu-name">我的订单</div>
                <div class="menu-arrow">&gt;</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">💰</div>
                <div class="menu-name">我的钱包</div>
                <div class="menu-arrow">&gt;</div>
            </div>
        </div>
        <div class="menu-section">
            <div class="menu-item">
                <div class="menu-icon">👥</div>
                <div class="menu-name">我的团队</div>
                <div class="menu-arrow">&gt;</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">🎫</div>
                <div class="menu-name">卡密兑换</div>
                <div class="menu-arrow">&gt;</div>
            </div>
        </div>
        <div class="menu-section">
            <div class="menu-item">
                <div class="menu-icon">⚙️</div>
                <div class="menu-name">设置</div>
                <div class="menu-arrow">&gt;</div>
            </div>
            <div class="menu-item">
                <div class="menu-icon">📞</div>
                <div class="menu-name">联系客服</div>
                <div class="menu-arrow">&gt;</div>
            </div>
        </div>
        <div class="tabbar">
            <div class="tab-item" onclick="location.href='/'">
                <div class="tab-icon"><span>首</span></div>
                <div class="tab-text">首页</div>
            </div>
            <div class="tab-item" onclick="location.href='/pages/tabbar/sort/index'">
                <div class="tab-icon"><span>分</span></div>
                <div class="tab-text">分类</div>
            </div>
            <div class="tab-item" onclick="location.href='/pages/tabbar/vip/index'">
                <div class="tab-icon"><span>VIP</span></div>
                <div class="tab-text">VIP</div>
            </div>
            <div class="tab-item" onclick="location.href='/pages/tabbar/my/index'">
                <div class="tab-icon active"><span>我</span></div>
                <div class="tab-text active">我的</div>
            </div>
        </div>
    </div>
</body>
</html>
