<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 智创云享</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
        .page { min-height: 100vh; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #FF9800, #FFB74D); padding: 15px; color: #fff; font-size: 18px; font-weight: bold; text-align: center; }
        .search { background: #fff; margin: -10px 15px 15px; padding: 10px 15px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; color: #999; font-size: 14px; cursor: pointer; }
        .module { background: #fff; margin: 10px 15px; border-radius: 8px; overflow: hidden; }
        .banner { width: 100%; height: 180px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; overflow: hidden; }
        .banner img { width: 100%; height: 100%; object-fit: cover; }
        .nav { display: flex; flex-wrap: wrap; padding: 10px; }
        .nav-item { width: 25%; text-align: center; padding: 10px 0; cursor: pointer; }
        .nav-item:active { background: #f0f0f0; }
        .nav-icon { width: 40px; height: 40px; background: #FF9800; border-radius: 8px; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; overflow: hidden; }
        .nav-icon img { width: 100%; height: 100%; object-fit: cover; }
        .nav-text { font-size: 12px; color: #333; }
        .title-text { padding: 12px 15px; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        .title-more { font-size: 12px; color: #999; font-weight: normal; cursor: pointer; }
        .goods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .goods-item { border-radius: 8px; overflow: hidden; cursor: pointer; background: #fff; }
        .goods-item:active { opacity: 0.9; transform: scale(0.98); }
        .goods-img { width: 100%; height: 120px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; font-size: 12px; overflow: hidden; position: relative; }
        .goods-img img { width: 100%; height: 100%; object-fit: cover; }
        .goods-info { padding: 10px; }
        .goods-title { font-size: 13px; line-height: 1.4; color: #333; min-height: 36px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .goods-price { color: #ff6b00; font-size: 16px; font-weight: bold; margin-top: 5px; }
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; display: flex; padding: 8px 0; z-index: 999; }
        .tab-item { flex: 1; text-align: center; cursor: pointer; padding: 5px 0; }
        .tab-item:active { background: #f0f0f0; }
        .tab-icon { width: 24px; height: 24px; background: #ddd; border-radius: 4px; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; overflow: hidden; }
        .tab-icon.active { background: #FF9800; }
        .tab-text { font-size: 10px; color: #999; margin-top: 2px; }
        .tab-text.active { color: #FF9800; }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">芝士盒</div>
        <div class="search" onclick="location.href='/'">搜索资源...</div>
        
        <div class="module">
            <div class="banner">
                <img src="https://zpcms.oss-cn-beijing.aliyuncs.com/uploads/20241007/c514fd92769122adcbc96d94a919f00a.png" alt="banner">
            </div>
        </div>
        
        <div class="module">
            <div class="nav">
                <div class="nav-item" onclick="location.href='/'">
                    <div class="nav-icon"><img src="/static/img/tabbar/home_on.png" alt="首页"></div>
                    <div class="nav-text">首页</div>
                </div>
                <div class="nav-item" onclick="location.href='/pages/tabbar/sort/index'">
                    <div class="nav-icon"><img src="/static/img/tabbar/sort_on.png" alt="分类"></div>
                    <div class="nav-text">分类</div>
                </div>
                <div class="nav-item" onclick="location.href='/pages/tabbar/vip/index'">
                    <div class="nav-icon"><img src="/static/img/tabbar/vip_on.png" alt="VIP"></div>
                    <div class="nav-text">VIP</div>
                </div>
                <div class="nav-item" onclick="location.href='/pages/tabbar/my/index'">
                    <div class="nav-icon"><img src="/static/img/tabbar/my_on.png" alt="我的"></div>
                    <div class="nav-text">我的</div>
                </div>
            </div>
        </div>
        
        <div class="module">
            <div class="title-text">推荐资源<span class="title-more" onclick="location.href='/pages/tabbar/sort/index'">更多 &gt;</span></div>
            <div class="goods">
                <div class="goods-item">
                    <div class="goods-img"><img src="https://zpcms.oss-cn-beijing.aliyuncs.com/uploads/20241007/c514fd92769122adcbc96d94a919f00a.png" alt="芝士盒知识付费系统"></div>
                    <div class="goods-info"><div class="goods-title">芝士盒知识付费系统</div><div class="goods-price">¥99</div></div>
                </div>
            </div>
        </div>
    </div>
    <div class="tabbar">
        <div class="tab-item" onclick="location.href='/'">
            <div class="tab-icon active"><img src="/static/img/tabbar/home_on.png" alt="首页"></div>
            <div class="tab-text active">首页</div>
        </div>
        <div class="tab-item" onclick="location.href='/pages/tabbar/sort/index'">
            <div class="tab-icon"><img src="/static/img/tabbar/sort.png" alt="分类"></div>
            <div class="tab-text">分类</div>
        </div>
        <div class="tab-item" onclick="location.href='/pages/tabbar/vip/index'">
            <div class="tab-icon"><img src="/static/img/tabbar/vip.png" alt="VIP"></div>
            <div class="tab-text">VIP</div>
        </div>
        <div class="tab-item" onclick="location.href='/pages/tabbar/my/index'">
            <div class="tab-icon"><img src="/static/img/tabbar/my.png" alt="我的"></div>
            <div class="tab-text">我的</div>
        </div>
    </div>
</body>
</html>
