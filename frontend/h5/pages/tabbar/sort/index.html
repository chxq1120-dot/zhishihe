<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类 - 智创云享</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
        .page { min-height: 100vh; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #FF9800, #FFB74D); padding: 15px; color: #fff; font-size: 18px; font-weight: bold; text-align: center; }
        .content { padding: 15px; }
        .category-item { background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .category-item:active { background: #f0f0f0; }
        .category-name { font-size: 16px; color: #333; font-weight: bold; }
        .category-desc { font-size: 12px; color: #999; margin-top: 5px; }
        .back-btn { display: inline-block; padding: 8px 15px; background: #FF9800; color: #fff; border-radius: 15px; text-decoration: none; font-size: 12px; cursor: pointer; }
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; display: flex; padding: 8px 0; z-index: 999; }
        .tab-item { flex: 1; text-align: center; cursor: pointer; padding: 5px 0; }
        .tab-item:active { background: #f0f0f0; }
        .tab-icon { width: 24px; height: 24px; background: #ddd; border-radius: 4px; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; overflow: hidden; }
        .tab-icon.active { background: #FF9800; }
        .tab-text { font-size: 10px; color: #999; margin-top: 2px; }
        .tab-text.active { color: #FF9800; }
    </style>
</head>
<body>
    <div class="page">
        <div class="header">
            <span>分类</span>
        </div>
        <div class="content">
            <div class="category-item">
                <div class="category-name">知识付费</div>
                <div class="category-desc">各类知识付费资源</div>
            </div>
            <div class="category-item">
                <div class="category-name">视频课程</div>
                <div class="category-desc">视频教学课程</div>
            </div>
            <div class="category-item">
                <div class="category-name">文档资料</div>
                <div class="category-desc">各类文档资料资源</div>
            </div>
            <div class="category-item">
                <div class="category-name">软件工具</div>
                <div class="category-desc">实用软件工具</div>
            </div>
            <div class="category-item">
                <div class="category-name">模板素材</div>
                <div class="category-desc">各类模板素材资源</div>
            </div>
        </div>
        <div class="tabbar">
            <div class="tab-item" onclick="location.href='/'">
                <div class="tab-icon"><span>首</span></div>
                <div class="tab-text">首页</div>
            </div>
            <div class="tab-item" onclick="location.href='/pages/tabbar/sort/index'">
                <div class="tab-icon active"><span>分</span></div>
                <div class="tab-text active">分类</div>
            </div>
            <div class="tab-item" onclick="location.href='/pages/tabbar/vip/index'">
                <div class="tab-icon"><span>VIP</span></div>
                <div class="tab-text">VIP</div>
            </div>
            <div class="tab-item" onclick="location.href='/pages/tabbar/my/index'">
                <div class="tab-icon"><span>我</span></div>
                <div class="tab-text">我的</div>
            </div>
        </div>
    </div>
</body>
</html>
