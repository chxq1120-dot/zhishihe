<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>智创云享 - 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
        
        .page-wrap { min-height: 100vh; padding-bottom: 65px; }
        
        .loading-box { text-align: center; padding: 100px 20px; color: #666; }
        .error-box { text-align: center; padding: 100px 20px; color: #f00; }
        
        /* Header */
        .header { background: linear-gradient(135deg, #FF9800 0%, #FFB74D 100%); padding: 15px; color: #fff; }
        .header h1 { font-size: 18px; font-weight: bold; }
        
        /* Search */
        .search-box { background: #fff; padding: 10px 15px; margin: -10px 15px 15px; border-radius: 20px; position: relative; top: -15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .search-box input { width: 100%; border: none; background: #f5f5f5; border-radius: 15px; padding: 8px 15px; font-size: 14px; outline: none; }
        
        /* Banner */
        .banner-box { padding: 0 15px 15px; }
        .banner-box img { width: 100%; height: 180px; border-radius: 8px; object-fit: cover; background: #eee; display: block; }
        
        /* Nav Grid */
        .nav-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; background: #fff; margin: 0 15px 15px; border-radius: 8px; }
        .nav-item { text-align: center; }
        .nav-item img { width: 44px; height: 44px; border-radius: 8px; margin-bottom: 5px; background: #f5f5f5; }
        .nav-item span { display: block; font-size: 12px; color: #333; }
        
        /* Section Title */
        .section-box { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; margin: 0 15px 10px; border-radius: 8px 8px 0 0; }
        .section-box h3 { font-size: 15px; color: #333; font-weight: bold; }
        .section-box a { font-size: 12px; color: #999; text-decoration: none; }
        
        /* Goods Grid */
        .goods-box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 15px 15px; background: #fff; margin: 0 15px; border-radius: 0 0 8px 8px; }
        .goods-item { background: #fff; border-radius: 8px; overflow: hidden; }
        .goods-item img { width: 100%; height: 120px; object-fit: cover; background: #f0f0f0; }
        .goods-item .info { padding: 10px; }
        .goods-item .title { font-size: 13px; color: #333; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
        .goods-item .price { color: #ff6b00; font-size: 16px; margin-top: 5px; font-weight: bold; }
        
        /* Tabbar */
        .tabbar { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            display: flex; background: #fff; 
            border-top: 1px solid #eee; 
            padding: 8px 0; 
            padding-bottom: env(safe-area-inset-bottom, 8px);
            z-index: 9999; 
        }
        .tabbar-item { flex: 1; text-align: center; cursor: pointer; text-decoration: none; }
        .tabbar-item img { width: 24px; height: 24px; }
        .tabbar-item span { display: block; font-size: 10px; color: #999; margin-top: 2px; }
        .tabbar-item.active span { color: #FF9800; }
        
        /* Module container */
        .module { margin-bottom: 15px; }
        
        /* Fallback placeholder */
        .placeholder-img { background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%); display: flex; align-items: center; justify-content: center; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div id="app" class="page-wrap">
        <div class="loading-box">
            <div>加载中...</div>
            <div style="margin-top:10px;font-size:12px;">正在获取数据</div>
        </div>
    </div>
    
    <script>
    (function() {
        var API = 'http://localhost:8080';
        
        var app = document.getElementById('app');
        
        function get(url, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            callback(null, JSON.parse(xhr.responseText));
                        } catch(e) {
                            callback(e);
                        }
                    } else {
                        callback(new Error('HTTP ' + xhr.status));
                    }
                }
            };
            xhr.onerror = function(e) { callback(e); };
            xhr.send();
        }
        
        function getImgUrl(path) {
            if (!path) return '';
            if (path.startsWith('http')) return path;
            if (path.startsWith('/')) return API + path;
            return API + '/' + path;
        }
        
        function createPlaceholder(w, h, text) {
            return '<div class="placeholder-img" style="width:' + w + 'px;height:' + h + 'px;">' + (text || '图片') + '</div>';
        }
        
        function renderSearch(params) {
            var placeholder = params.placeholder || '搜索资源';
            return '<div class="search-box"><input type="text" placeholder="' + placeholder + '" readonly></div>';
        }
        
        function renderBanner(params) {
            if (!params.list || params.list.length === 0) return '';
            var item = params.list[0];
            var imgUrl = getImgUrl(item.url);
            return '<div class="banner-box"><img src="' + imgUrl + '" alt="banner" onerror="this.style.display=\'none\'"></div>';
        }
        
        function renderNav(params) {
            if (!params.list || params.list.length === 0) return '';
            var html = '<div class="nav-box">';
            params.list.forEach(function(item) {
                var imgUrl = getImgUrl(item.icon);
                html += '<div class="nav-item">';
                html += '<img src="' + imgUrl + '" alt="' + (item.name || '') + '" onerror="this.style.display=\'none\'">';
                html += '<span>' + (item.name || '') + '</span></div>';
            });
            html += '</div>';
            return html;
        }
        
        function renderTitle(params) {
            var title = params.title || '推荐';
            var moreText = params.moreText || '更多';
            return '<div class="section-box"><h3>' + title + '</h3><a href="#">' + moreText + ' &gt;</a></div>';
        }
        
        function renderGoods(params) {
            if (!params.list || params.list.length === 0) return '';
            var html = '<div class="goods-box">';
            params.list.forEach(function(item) {
                var imgUrl = getImgUrl(item.thumb);
                var price = item.price || '0';
                html += '<div class="goods-item">';
                html += '<img src="' + imgUrl + '" alt="' + (item.title || '') + '" onerror="this.style.display=\'none\'">';
                html += '<div class="info">';
                html += '<div class="title">' + (item.title || '') + '</div>';
                html += '<div class="price">¥' + price + '</div>';
                html += '</div></div>';
            });
            html += '</div>';
            return html;
        }
        
        function renderTabbar(config) {
            var list = config.tabbar && config.tabbar.list;
            if (!list || list.length === 0) {
                list = [
                    { pagePath: 'pages/tabbar/home/index', text: '首页', iconPath: '/static/img/tabbar/home.png', selectedIconPath: '/static/img/tabbar/home_on.png' },
                    { pagePath: 'pages/tabbar/sort/index', text: '分类', iconPath: '/static/img/tabbar/sort.png', selectedIconPath: '/static/img/tabbar/sort_on.png' },
                    { pagePath: 'pages/tabbar/vip/index', text: 'VIP', iconPath: '/static/img/tabbar/vip.png', selectedIconPath: '/static/img/tabbar/vip_on.png' },
                    { pagePath: 'pages/tabbar/my/index', text: '我的', iconPath: '/static/img/tabbar/my.png', selectedIconPath: '/static/img/tabbar/my_on.png' }
                ];
            }
            
            var html = '<div class="tabbar">';
            list.forEach(function(item, idx) {
                var isActive = idx === 0;
                var iconPath = isActive ? item.selectedIconPath : item.iconPath;
                var iconUrl = getImgUrl(iconPath);
                var pagePath = '/' + item.pagePath;
                html += '<a href="#" class="tabbar-item' + (isActive ? ' active' : '') + '" data-page="' + pagePath + '">';
                html += '<img src="' + iconUrl + '" alt="' + item.text + '" onerror="this.style.display=\'none\'">';
                html += '<span>' + item.text + '</span></a>';
            });
            html += '</div>';
            return html;
        }
        
        function renderPage(config, pageData) {
            var html = '';
            
            html += '<div class="header"><h1>' + (config.web && config.web.name || '首页') + '</h1></div>';
            
            pageData.forEach(function(module) {
                var type = module.type;
                var params = module.params || {};
                
                switch(type) {
                    case 'search':
                        html += '<div class="module">' + renderSearch(params) + '</div>';
                        break;
                    case 'banner':
                        html += '<div class="module">' + renderBanner(params) + '</div>';
                        break;
                    case 'nav':
                        html += '<div class="module">' + renderNav(params) + '</div>';
                        break;
                    case 'title':
                        html += '<div class="module">' + renderTitle(params) + '</div>';
                        break;
                    case 'goods':
                        html += '<div class="module">' + renderGoods(params) + '</div>';
                        break;
                }
            });
            
            html += renderTabbar(config);
            
            app.innerHTML = html;
            document.title = (config.web && config.web.name) || '智创云享';
        }
        
        // Load config
        get(API + '/api/index/config?from_id=1&plat_form=web&site=127.0.0.1', function(err, config) {
            if (err || config.code !== 200) {
                app.innerHTML = '<div class="error-box">配置加载失败: ' + (err ? err.message : config.msg) + '</div>';
                return;
            }
            
            if (config.data.web && config.data.web.nosite == 1) {
                app.innerHTML = '<div class="error-box">站点已禁用</div>';
                return;
            }
            
            // Load page data
            get(API + '/api/index/pageData?from_id=1&plat_form=web', function(err, pageData) {
                if (err || pageData.code !== 200) {
                    app.innerHTML = '<div class="error-box">页面数据加载失败: ' + (err ? err.message : pageData.msg) + '</div>';
                    return;
                }
                
                renderPage(config.data, pageData.data);
            });
        });
    })();
    </script>
</body>
</html>
