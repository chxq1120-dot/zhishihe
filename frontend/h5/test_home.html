<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智创云享 - 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
        .page { min-height: 100vh; padding-bottom: 70px; }
        .loading { text-align: center; padding: 100px 20px; color: #666; }
        .error { padding: 20px; margin: 20px; background: #ffe0e0; border-radius: 8px; color: #f00; text-align: center; }
        
        .header { background: linear-gradient(135deg, #FF9800, #FFB74D); padding: 15px; color: #fff; }
        .header h1 { font-size: 18px; }
        
        .search { background: #fff; margin: -10px 15px 15px; padding: 10px 15px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .search input { width: 100%; border: none; background: #f5f5f5; border-radius: 15px; padding: 8px 15px; font-size: 14px; }
        
        .module { background: #fff; margin: 10px 15px; border-radius: 8px; overflow: hidden; }
        .banner img { width: 100%; height: 180px; object-fit: cover; }
        .nav { display: flex; flex-wrap: wrap; padding: 10px; }
        .nav-item { width: 25%; text-align: center; padding: 10px 0; }
        .nav-item img { width: 40px; height: 40px; border-radius: 8px; margin-bottom: 5px; }
        .nav-item span { display: block; font-size: 12px; }
        .module-title { padding: 12px 15px; font-weight: bold; }
        
        .goods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .goods-item { border-radius: 8px; overflow: hidden; }
        .goods-item img { width: 100%; height: 120px; object-fit: cover; background: #eee; }
        .goods-item .info { padding: 10px; }
        .goods-item .title { font-size: 13px; line-height: 1.4; min-height: 36px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .goods-item .price { color: #ff6b00; font-size: 16px; font-weight: bold; margin-top: 5px; }
        
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; display: flex; padding: 8px 0; z-index: 999; }
        .tabbar-item { flex: 1; text-align: center; }
        .tabbar-item img { width: 24px; height: 24px; }
        .tabbar-item span { display: block; font-size: 10px; color: #999; }
        .tabbar-item.active span { color: #FF9800; }
    </style>
</head>
<body>
    <div id="app"><div class="loading">加载中...</div></div>
    
    <script>
    var API = 'http://127.0.0.1:8080';
    var app = document.getElementById('app');
    
    function showError(msg) {
        app.innerHTML = '<div class="error">' + msg + '</div>';
    }
    
    function img(path) {
        if (!path) return '';
        if (path.indexOf('http') === 0) return path;
        return API + path;
    }
    
    function render(config, data) {
        var html = '<div class="page">';
        html += '<div class="header"><h1>' + (config.web && config.web.name || '首页') + '</h1></div>';
        
        for (var i = 0; i < data.length; i++) {
            var m = data[i];
            var p = m.params || {};
            
            if (m.type === 'search') {
                html += '<div class="search"><input type="text" placeholder="' + (p.placeholder || '搜索') + '" readonly></div>';
            } else if (m.type === 'banner' && p.list && p.list[0]) {
                html += '<div class="module"><img src="' + img(p.list[0].url) + '" class="banner"></div>';
            } else if (m.type === 'nav' && p.list) {
                html += '<div class="module"><div class="nav">';
                for (var j = 0; j < p.list.length; j++) {
                    var n = p.list[j];
                    html += '<div class="nav-item"><img src="' + img(n.icon) + '"><span>' + n.name + '</span></div>';
                }
                html += '</div></div>';
            } else if (m.type === 'title') {
                html += '<div class="module"><div class="module-title">' + (p.title || '') + '</div></div>';
            } else if (m.type === 'goods' && p.list) {
                html += '<div class="module"><div class="goods">';
                for (var k = 0; k < p.list.length; k++) {
                    var g = p.list[k];
                    html += '<div class="goods-item"><img src="' + img(g.thumb) + '"><div class="info"><div class="title">' + g.title + '</div><div class="price">¥' + (g.price || '0') + '</div></div></div>';
                }
                html += '</div></div>';
            }
        }
        html += '</div>';
        
        html += '<div class="tabbar">';
        var tabs = [
            {n:'首页', i:'/static/img/tabbar/home.png', a:'/static/img/tabbar/home_on.png'},
            {n:'分类', i:'/static/img/tabbar/sort.png', a:'/static/img/tabbar/sort_on.png'},
            {n:'VIP', i:'/static/img/tabbar/vip.png', a:'/static/img/tabbar/vip_on.png'},
            {n:'我的', i:'/static/img/tabbar/my.png', a:'/static/img/tabbar/my_on.png'}
        ];
        for (var t = 0; t < tabs.length; t++) {
            var isA = t === 0;
            html += '<div class="tabbar-item' + (isA ? ' active' : '') + '"><img src="' + img(isA ? tabs[t].a : tabs[t].i) + '"><span>' + tabs[t].n + '</span></div>';
        }
        html += '</div>';
        
        app.innerHTML = html;
        document.title = config.web && config.web.name || '首页';
    }
    
    function request(url, callback, timeout) {
        timeout = timeout || 10000;
        var xhr = new XMLHttpRequest();
        var timeoutId = setTimeout(function() {
            xhr.abort();
            callback({error: '请求超时'});
        }, timeout);
        
        xhr.open('GET', url);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                clearTimeout(timeoutId);
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        callback(null, data);
                    } catch(e) {
                        callback({error: 'JSON解析失败: ' + e.message});
                    }
                } else {
                    callback({error: 'HTTP ' + xhr.status});
                }
            }
        };
        xhr.onerror = function() {
            clearTimeout(timeoutId);
            callback({error: '网络错误'});
        };
        xhr.send();
    }
    
    request(API + '/api/index/config?from_id=1&plat_form=web&site=127.0.0.1', function(err, cfg) {
        if (err) {
            showError('配置请求失败: ' + err.error);
            return;
        }
        if (cfg.code !== 200) {
            showError('配置错误: ' + cfg.msg);
            return;
        }
        
        request(API + '/api/index/pageData?from_id=1&plat_form=web', function(err, pd) {
            if (err) {
                showError('数据请求失败: ' + err.error);
                return;
            }
            if (pd.code !== 200) {
                showError('数据错误: ' + pd.msg);
                return;
            }
            
            render(cfg.data, pd.data);
        });
    });
    </script>
</body>
</html>
