<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 智创云享</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
        .page { min-height: 100vh; padding-bottom: 70px; }
        .header { background: linear-gradient(135deg, #FF9800, #FFB74D); padding: 15px; color: #fff; font-size: 18px; font-weight: bold; }
        .search { background: #fff; margin: -10px 15px 15px; padding: 10px 15px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; color: #999; font-size: 14px; }
        .module { background: #fff; margin: 10px 15px; border-radius: 8px; overflow: hidden; }
        .banner { width: 100%; height: 180px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; }
        .nav { display: flex; flex-wrap: wrap; padding: 10px; }
        .nav-item { width: 25%; text-align: center; padding: 10px 0; }
        .nav-icon { width: 40px; height: 40px; background: #FF9800; border-radius: 8px; margin: 0 auto 5px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; }
        .nav-text { font-size: 12px; color: #333; }
        .title-text { padding: 12px 15px; font-weight: bold; font-size: 15px; }
        .goods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .goods-item { border-radius: 8px; overflow: hidden; }
        .goods-img { width: 100%; height: 120px; background: #eee; display: flex; align-items: center; justify-content: center; color: #999; font-size: 12px; }
        .goods-info { padding: 10px; }
        .goods-title { font-size: 13px; line-height: 1.4; color: #333; }
        .goods-price { color: #ff6b00; font-size: 16px; font-weight: bold; margin-top: 5px; }
        .tabbar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #eee; display: flex; padding: 8px 0; z-index: 999; }
        .tab-item { flex: 1; text-align: center; }
        .tab-icon { width: 24px; height: 24px; background: #ddd; border-radius: 4px; margin: 0 auto; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; }
        .tab-icon.active { background: #FF9800; }
        .tab-text { font-size: 10px; color: #999; margin-top: 2px; }
        .tab-text.active { color: #FF9800; }
    </style>
</head>
<body>
    <div id="app">
        <div class="page">
            <div class="header">智创云享</div>
            <div class="search">搜索资源...</div>
            
            <div class="module">
                <div class="banner">轮播图</div>
            </div>
            
            <div class="module">
                <div class="nav">
                    <div class="nav-item"><div class="nav-icon">首</div><div class="nav-text">首页</div></div>
                    <div class="nav-item"><div class="nav-icon">分</div><div class="nav-text">分类</div></div>
                    <div class="nav-item"><div class="nav-icon">V</div><div class="nav-text">VIP</div></div>
                    <div class="nav-item"><div class="nav-icon">我</div><div class="nav-text">我的</div></div>
                </div>
            </div>
            
            <div class="module">
                <div class="title-text">推荐商品</div>
                <div class="goods">
                    <div class="goods-item">
                        <div class="goods-img">商品图</div>
                        <div class="goods-info">
                            <div class="goods-title">芝士盒知识付费系统</div>
                            <div class="goods-price">¥99</div>
                        </div>
                    </div>
                    <div class="goods-item">
                        <div class="goods-img">商品图</div>
                        <div class="goods-info">
                            <div class="goods-title">VIP会员特权</div>
                            <div class="goods-price">¥299</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="tabbar">
            <div class="tab-item"><div class="tab-icon active">首</div><div class="tab-text active">首页</div></div>
            <div class="tab-item"><div class="tab-icon">分</div><div class="tab-text">分类</div></div>
            <div class="tab-item"><div class="tab-icon">V</div><div class="tab-text">VIP</div></div>
            <div class="tab-item"><div class="tab-icon">我</div><div class="tab-text">我的</div></div>
        </div>
    </div>
    
    <script>
    document.getElementById('app').innerHTML = document.getElementById('app').innerHTML;
    </script>
</body>
</html>
