<!DOCTYPE html>
<html>
<head>
    {include file="head" title="$title" keyword="$keyword" desc="$desc"/}
</head>
<body>
{include file="header"/}
<!-- 面包削 -->
<div class="crumbs clearfix">
    <div class="crumbs-min">
        <a href="/" title="首页">首页</a> &gt;
        <a href="/user" rel="nofollow">用户中心</a> &gt; 支付结果
    </div>
</div>
<div class="container">
    <!-- 内容 -->
    <div class="pay_result">
        <div class="result_info">
            {if $order['status']==1 }
                <div class="status success"><i class="icon icon-success"></i>您的订单已支付成功 </div>
            {else/}
                <div class="status fail"><i class="icon icon-shibai"></i>您的订单支付失败 </div>
            {/if}
            <div class="pay_info">
                <div class="item"><span class="name">订单号</span><span class="txt">{$order['ordno']}</span></div>
                <div class="item"><span class="name">支付金额</span><span class="txt">￥{$order['money']}</span></div>
                <div class="item"><span class="name">订单名称</span><span class="txt">{$subject}</span></div>
            </div>
            <div class="jump-tips">
                <div class="down-time"><span id="downTime">5</span>秒后将会自动跳转</div>
                <div class="jump-link"><a href="{$jump_url}">立即跳转</a></div>
            </div>
            <div class="quick-menu">
                <button class="btn-view" onclick="window.location.href='/user';">用户中心</button>
                <button class="btn-user" onclick="window.location.href='/user/mycourse';">查看订单</button>
            </div>
        </div>
    </div>
</div>
{include file="footer"/}
<script>
    var downTime=5;
    setInterval(function () {
        if(downTime==0){
            window.location.href='{$jump_url}';
        }else{
            downTime--;
            $('#downTime').text(downTime);
        }
    },1000);
</script>
</body>
</html>
