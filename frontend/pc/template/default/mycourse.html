<!DOCTYPE html>
<html>
<head>
  {include file="head" title="$title" keyword="$keyword" desc="$desc"/}
  <script type="text/javascript" src="__STATIC__/default/js/jquery.lazyload.js"></script>
</head>
<body>
  {include file="header"/}
  <!-- top头部 End -->
  <div class="container">
    <!-- 会员中心左侧 -->
    <div class="Member-left">
      {include file="usermenu"/}
    </div>
    <!-- 会员中心左侧 End -->
    <!-- 右侧功能定位 -->
    <div class="Member-right">
      <div class="Ml-box uc-main-box">
        <div class="zp-conter zp-lister">
          <div class="zp-right-box"><h1 class="title">我的资源</h1></div>
          <!-- tab 切换 -->
          <div class="tab-nav-menu sign-up-tab">
            <ul>
              <li class="tab-nav-item current" data-type="1"><span>付费购买</span></li>
              <li class="tab-nav-item" data-type="2"><span>免费获取</span></li>
            </ul>
          </div>
          <div class="tab-content sign-up-bar">
            <input type="hidden" id="sid" value="{:input('sid/d',0)}">
            <!-- 付费购买 -->
            <div class="tab-content-item" style="display: block;">
                <div class="mycourse_list" style="width: 100%;">
                    <ul id="mycourse_list"></ul>
                </div>
            </div>
            <!-- 课程列表 End -->
            <!-- 免费获取 -->
            <div class="tab-content-item" style="display: none;">
                <div class="mycourse_list" style="width: 100%;">
                    <ul id="mycourse_task"></ul>
                </div>
            </div>
            <div class="nodata" style="display: none;">
                <i class="icon icon-nodata"></i>
                <span class="msg">暂时没有内容</span>
            </div>
          </div>
        </div>
      </div>
      <!-- 课程 -->
      <!-- 右侧功能定位 End -->
    </div>
  </div>
  {include file="footer"/}
  <!-- 网站导航 End -->
  <script>
    WCCE.tab();// 切换
    WCCE.MyCoursef();//付费
  </script>
  </body>
</html>
